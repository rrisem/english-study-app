  /* ================= 画面：履歴・復習（単元一覧 → 単元の詳細） ================= */
  /** 問題IDから、その問題がある単元の問題集を探す */
  function bankOfQuestion(id) {
    for (var k in EA.banks) if (EA.findQuestion(EA.banks[k], id)) return EA.banks[k];
    return null;
  }
  /** 回答の単元ID（記録の unitId。古い記録で無い場合は、問題がある単元） */
  function attemptUnitId(a) {
    var b = (a.unitId && EA.banks[a.unitId]) || bankOfQuestion(a.questionId);
    if (!b) return a.unitId || null;
    // 練習用の問題集（不定詞 Lv1 など）の回答は、親の単元の履歴にまとめる
    return b.unit.parent && EA.banks[b.unit.parent] ? b.unit.parent : b.unit.id;
  }

  /**
   * 単元の復習の状態。既存の復習判定（planner.dueReviews / buildReviewSession）と、ホームの課題の順番
   * （途中の学習 → 初回診断 → 解説と類題 → 復習）をそのまま使う。
   *   ready     今すぐ始められる。count は buildReviewSession が実際に出す問題数（一覧の「復習◯問」と一致）
   *   blocked   期限は来ているが、途中の学習・初回診断・解説と類題が先（why に理由）
   *   scheduled 次の復習日が決まっている（next）
   *   none      予定なし（診断前・試作の単元）
   */
  function reviewInfo(bank, t) {
    if (bank.unit.trial) return { kind: 'none', trial: true };
    var u = state.units[bank.unit.id] || {};
    var due = P.dueReviews(state, bank, t);
    var next = P.nextReviewDate(state, bank);
    if (due.length) {
      if (state.activeSession) return { kind: 'blocked', why: '途中の学習を最後まで進めると始められます。', resume: true };
      if (!u.diagnosticDoneAt) return { kind: 'blocked', why: '初回診断のあとに始められます。' };
      if (!u.practiceDoneAt && !u.practiceSkippedAt) return { kind: 'blocked', why: '解説と類題のあとに始められます。' };
      var count = P.buildReviewSession(state, bank, t).items.length;
      if (count) return { kind: 'ready', count: count };
    }
    return next ? { kind: 'scheduled', next: next } : { kind: 'none' };
  }

  function renderHistory() {
    var t = now();
    var unitId = view.params.unit;
    var bank = unitId && EA.banks[unitId];
    if (!bank) return historyUnitsHtml(t);
    return historyUnitHtml(bank, t);
  }

  /** 単元一覧：単元名のボタン。今すぐ復習できる単元だけ「復習◯問」を添える */
  function historyUnitsHtml(t) {
    return '<h1 class="page-title">履歴・復習</h1>' +
      '<ul class="unit-picks" aria-label="単元">' + Object.keys(EA.banks).filter(function (k) { return !EA.banks[k].unit.parent; }).map(function (k) {
        var b = EA.banks[k], ri = reviewInfo(b, t);
        return '<li><button type="button" class="unit-pick" data-act="history-unit" data-unit="' + esc(k) + '">' +
          '<span class="unit-pick-name">' + esc(b.unit.title) + '</span>' +
          (ri.kind === 'ready' ? '<span class="unit-pick-due">' + icon('repeat') + '復習' + ri.count + '問</span>' : '') +
          icon('chevron') + '</button></li>';
      }).join('') + '</ul>';
  }

  /** 単元の詳細：見出し＝単元名、上に「復習」、下に「学習履歴」（この単元の記録だけ） */
  function historyUnitHtml(bank, t) {
    var id = bank.unit.id, ri = reviewInfo(bank, t);
    var h = '<button type="button" class="btn-text back" data-act="history-units">← 単元一覧に戻る</button>' +
      '<h1 class="page-title">' + esc(bank.unit.title) + '</h1>';

    // 復習
    h += '<section class="panel review-panel" aria-labelledby="review-title"><div class="panel-head"><h2 id="review-title">復習</h2></div>';
    if (ri.kind === 'ready') {
      h += '<div class="review-now"><p class="review-count"><span class="num">' + ri.count + '</span>問 今すぐ復習できます</p>' +
        '<button type="button" class="btn-primary btn-lg" data-act="task-review" data-unit="' + esc(id) + '">復習をはじめる' + icon('chevron') + '</button></div>';
    } else if (ri.kind === 'blocked') {
      h += '<p class="review-note">' + esc(ri.why) + '</p>' +
        (ri.resume ? '<div class="actions-inline"><button type="button" class="btn-quiet" data-act="task-resume">続きから再開</button></div>' : '');
    } else if (ri.kind === 'scheduled') {
      h += '<p class="review-next">' + icon('calendar') + '<span>次の復習</span><strong>' + esc(monthDay(ri.next)) + '</strong><span class="muted">' + U.relDay(ri.next, t) + '</span></p>';
    } else {
      h += '<p class="muted">' + (ri.trial ? 'この単元は復習の対象外です。' : '復習の予定はまだありません。') + '</p>';
    }
    if (!bank.unit.trial && (view.params.skill || state.attempts.some(function (a) { return attemptUnitId(a) === id; }))) {
      h += '<details class="review-skills"' + (view.params.skill ? ' open' : '') + '><summary>項目ごとの確認状況と復習予定</summary>' + skillPanelsHtml(bank, t) + '</details>';
    }
    h += '</section>';

    // 学習履歴（この単元の回答だけ。新しい順）
    var list = state.attempts.filter(function (a) { return attemptUnitId(a) === id; }).reverse();
    h += '<section aria-labelledby="log-title" class="history-log"><h2 id="log-title" class="section-title">学習履歴</h2>' +
      (list.length ? '<ul class="att-list panel">' + list.map(function (a) {
        var qq = q(a.questionId);
        return '<li><button type="button" class="att-row" data-act="question" data-q="' + esc(a.questionId) + '">' +
          '<span class="att-type">' + esc(typeLabelOf(a)) + '<span class="muted">' + U.fmtDateTime(a.answeredAt) + '</span></span>' +
          '<span class="att-q">' + esc(qq ? plain(qq.ja || qq.sentence) : a.questionId) + '<span class="muted att-ans" lang="en">' + esc(a.responseText || '（わからない）') + '</span></span>' +
          '<span class="att-tags">' + resultBadge(a.result) + flagsHtml(a) + '</span></button></li>';
      }).join('') + '</ul>' : '<p class="muted">学習履歴はまだありません</p>') + '</section>';
    return h;
  }

  /** 項目ごとの確認状況と復習予定（選んだ単元の項目・問題だけ） */
  function skillPanelsHtml(bank, t) {
    return bank.skills.map(function (sk) {
        var st = M.analyze(sk.id, state.attempts, bank);
        var sch = state.schedule[sk.id];
        var open = view.params.skill === sk.id;
        var qs = bank.questions.filter(function (x) { return x.skill === sk.id; });
        var meaningText = { confirmed: '訳を見ずに確認できた', recheck: '再確認が必要', reference: '訳・解説を見たあとの回答のみ（参考）', unchecked: 'まだ確認していない' }[st.meaning];
        return '<section class="panel skill-panel" id="skill-' + sk.id + '"><div class="skill-panel-head">' +
          '<div><h3>' + esc(sk.label) + '<span class="skill-term">' + esc(sk.term) + '</span></h3><p class="muted">' + esc(sk.plain) + '</p></div>' +
          '<div class="skill-panel-due">' + (sch ? '<span class="label">次の復習</span><strong>' + U.fmtDate(sch.dueAt) + '</strong><span class="muted">' + U.relDay(sch.dueAt, t) + ' ・ 間隔 ' + sch.intervalDays + '日</span>' : '<span class="muted">予定なし（診断前）</span>') + '</div></div>' +
          '<dl class="status-grid">' +
            '<dt>いまの状態</dt><dd class="tone-text-' + st.tone + '">' + esc(st.headline) + '</dd>' +
            '<dt>これまでの確認実績</dt><dd>' + achievementMeter(st.achievement) + ' ' + esc(st.achievementLabel) + '</dd>' +
            '<dt>意味の確認</dt><dd>' + esc(meaningText) + '</dd>' +
          '</dl>' +
          // 詳しい実績（ホームの一行では「実績 n/3」だけを示す）
          '<ul class="ach-list" aria-label="これまでの確認実績">' + ACH_SHORT.map(function (label, j) {
            var on = st.achievement >= j + 1;
            return '<li class="' + (on ? 'is-on' : '') + '"><span>' + label + '</span><span class="ach-dot" aria-hidden="true">' + (on ? icon('check') : '') + '</span>' +
              '<span class="sr">' + (on ? '（確認済み）' : '（まだ）') + '</span></li>';
          }).join('') + '</ul>' +
          (st.issues.length ? '<ul class="issue-list">' + st.issues.map(function (i) {
            return '<li><strong>' + esc(i.label) + '</strong>（' + U.fmtDate(i.since) + '〜）<span class="muted">' + esc(i.rule) + '</span></li>';
          }).join('') + (st.teacherCandidate ? '<li><strong>講師に相談する候補</strong><span class="muted">同じ内容で2回以上つまずいています。</span></li>' : '') + '</ul>' : '') +
          '<details' + (open ? ' open' : '') + '><summary>判定の根拠</summary><ul class="evidence">' + st.evidence.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul></details>' +
          (sch && sch.history ? '<details><summary>復習予定が決まった理由</summary><ul class="sched-history">' + sch.history.slice().reverse().map(function (x) {
            return '<li><span class="muted">' + U.fmtDateTime(x.at) + '</span> ' + esc(SESSION_LABEL[x.sessionType]) + '：' + esc(x.why) + ' → ' + U.fmtDate(x.dueAt) + '</li>';
          }).join('') + '</ul></details>' : '') +
          '<details' + (open ? ' open' : '') + '><summary>この項目の問題（' + qs.length + '問）・解説・過去の回答</summary><ul class="q-list">' + qs.map(function (x) {
            var n = state.attempts.filter(function (a) { return a.questionId === x.id; });
            var last = n[n.length - 1];
            return '<li><button type="button" class="att-row" data-act="question" data-q="' + x.id + '"><span class="att-type">' + esc(fmtLabel(x)) + '</span>' +
              '<span class="att-q">' + esc(plain(x.ja || x.sentence)) + (x.status === 'excluded' ? '（判定から除外中）' : '') + '</span>' +
              '<span class="att-tags">' + (last ? resultBadge(last.result) : '<span class="muted">未回答</span>') + '<span class="muted">' + n.length + '回</span></span></button></li>';
          }).join('') + '</ul></details></section>';
      }).join('');
  }

  /* ================= 画面：問題の詳細 ================= */
  function renderQuestion() {
    var qq = q(view.params.q);
    if (!qq) return renderHistory();
    var qb = bankOfQuestion(qq.id) || BANK;
    // 以前の試用版の問題IDで記録された回答も、同じ問題の回答として表示する
    var atts = state.attempts.filter(function (a) { return a.questionId === qq.id || (qb.aliases && qb.aliases[a.questionId] === qq.id); }).reverse();
    var backUnit = EA.banks[qb.unit.parent] || qb;
    return '<button type="button" class="btn-text back" data-act="back-history" data-unit="' + esc(backUnit.unit.id) + '" data-skill="' + qq.skill + '">← ' + esc(backUnit.unit.title) + 'の履歴・復習へ</button>' +
      '<p class="eyebrow">' + esc(skill(qq.skill).label) + ' ・ ' + esc(fmtLabel(qq)) + ' ・ ' + esc(qq.id) + '（版 ' + qq.version + '）</p>' +
      '<section class="sheet">' + questionPromptHtml(qq, null) +
      '<p class="muted">確認すること：' + esc(qq.checks) + '</p>' + explanationHtml(qq) +
      ((qq.changes || []).length ? '<details><summary>問題の修正履歴</summary><ul class="plain-list">' + qq.changes.map(function (c) { return '<li>版' + c.version + '：' + esc(c.what) + '。過去の記録：' + esc(c.oldRecords) + '</li>'; }).join('') + '</ul></details>' : '') +
      '</section>' +
      '<section class="panel"><div class="panel-head"><h2>過去の回答（' + atts.length + '回）</h2></div>' +
      (atts.length ? '<div class="table-wrap"><table class="att-table"><thead><tr><th>日時</th><th>種類</th><th>答え</th><th>結果</th></tr></thead><tbody>' + atts.map(function (a) {
        return '<tr><td class="num">' + U.fmtDateTime(a.answeredAt) + '<span class="muted">版' + a.questionVersion + '</span></td><td>' + esc(typeLabelOf(a)) + '</td><td lang="en">' + esc(a.responseText || '（わからない）') + '</td>' +
          '<td>' + resultBadge(a.result) + flagsHtml(a) + (M.isExcluded(a, qb) ? '<span class="flag">判定から除外</span>' : '') + '</td></tr>';
      }).join('') + '</tbody></table></div>' : '<p class="muted">まだ回答していません。</p>') + '</section>';
  }

      '<div class="actions-inline"><button type="button" class="btn-quiet" data-act="teacher-time">' + icon('clock') + '学習時間を確認する</button></div></details>';

    if (demo) {
      h += '<section class="panel dev"><div class="panel-head"><h2>デモモード：日付を進める</h2><p class="panel-note">後日の復習が出るかを確かめるための機能です。通常の記録には影響しません。</p></div>' +
        '<p>アプリ内の今日：<strong>' + U.fmtDate(now()) + '</strong>' + (state.demo.dayOffset ? '（実際より +' + state.demo.dayOffset + '日）' : '（実際の日付）') + '</p>' +
        '<div class="actions-inline">' + [1, 3, 7].map(function (d) { return '<button type="button" class="btn-quiet" data-act="dev-add" data-days="' + d + '">+' + d + '日</button>'; }).join('') + '</div>' +
        '<div class="actions-inline"><button type="button" class="btn-primary" data-act="demo-exit">デモを終えて通常の記録に戻る（デモの記録は消えます）</button></div></section>';
    } else {
      h += '<details class="panel dev"><summary>講師・開発者向け：動作確認用デモモード</summary>' +
        '<p>デモモードでは、通常とは別の保存領域を使い、日付を進めて復習の動きを確かめられます。通常の学習記録は変わりません。デモを終えると、デモの記録は消えます。</p>' +
        '<div class="actions-inline"><button type="button" class="btn-quiet" data-act="demo-enter">デモモードを始める</button></div></details>';
      h += '<section class="panel danger"><div class="panel-head"><h2>記録をすべて消す</h2></div>' +
        (p.confirmReset ? '<p><strong>本当に消しますか？</strong>回答・復習予定・途中の学習と、講師用の暗証番号がすべて消え、元に戻せません。</p><div class="actions-inline"><button type="button" class="btn-danger" data-act="reset-do">すべて消す</button><button type="button" class="btn-quiet" data-act="reset-cancel">やめる</button></div>'
          : '<div class="actions-inline"><button type="button" class="btn-quiet" data-act="reset-ask">記録を消す…</button></div>') +
        '</section>';
    }
    return h;
  }

  /* ================= 画面：講師向け 学習時間（設定 → 講師向け から開く。生徒向けのメニューには出さない） ================= */
  /*
   * 学習時間 ＝ 回答の activeMs（問題を開いて答えを確定するまで、画面が見えていた時間）。
   * 1問あたり maxCountedMsPerQuestion で切る（開いたまま放置した時間を除く。以前の「学習時間」画面と同じ数え方）。
   * 正誤・解説を読んでいる時間、「保存してホームへ」で離れていた時間は含まない。
   */
  var GOAL_OPTIONS = [5, 10, 15, 20, 30];
  function countedMs(a) { return Math.min(a.activeMs || 0, EA.config.maxCountedMsPerQuestion); }
  function dur(ms) { return ms > 0 ? U.fmtDuration(ms) : '0分'; }
  function pctOf(ms, goalMin) { return goalMin ? Math.min(100, Math.round(ms / 60000 / goalMin * 100)) : 0; }

  function renderTeacherTime() {
    var t = now(), today = U.startOfDay(t), cap = EA.config.maxCountedMsPerQuestion;
    var goal = state.settings.dailyGoalMinutes || EA.config.defaultDailyGoalMinutes;
    var atts = state.attempts;
    var byDay = {}, bySkill = {}, bySession = {}, total = 0, capped = 0;
    atts.forEach(function (a) {
      var ms = countedMs(a), d = U.startOfDay(a.answeredAt);
      if ((a.activeMs || 0) > cap) capped++;
      total += ms;
      var x = byDay[d] || (byDay[d] = { ms: 0, n: 0, sessions: {} });
      x.ms += ms; x.n++; x.sessions[a.sessionId] = true;
      var k = bySkill[a.skillId] || (bySkill[a.skillId] = { ms: 0, n: 0 });
      k.ms += ms; k.n++;
      var s = bySession[a.sessionId] || (bySession[a.sessionId] = { id: a.sessionId, type: a.sessionType, ms: 0, away: 0, n: 0, first: a.startedAt || a.answeredAt, last: a.answeredAt });
      s.ms += ms; s.away += a.awayMs || 0; s.n++;
      s.first = Math.min(s.first, a.startedAt || a.answeredAt); s.last = Math.max(s.last, a.answeredAt);
    });
    var dow = (new Date(today).getDay() + 6) % 7, monday = U.addDays(today, -dow);
    var weekMs = 0;
    for (var i = 0; i <= dow; i++) weekMs += (byDay[U.addDays(monday, i)] || { ms: 0 }).ms;
    var todayMs = (byDay[today] || { ms: 0 }).ms;
    var studyDays = Object.keys(byDay).length;

    var h = '<div class="tt-top"><button type="button" class="btn-text back" data-act="teacher-back">← 設定に戻る</button>' +
      '<button type="button" class="btn-quiet" data-act="teacher-lock">' + icon('lock') + '鍵をかけて閉じる</button></div>' +
      '<p class="eyebrow">講師向け</p><h1 class="page-title" tabindex="-1" id="tt-title">学習時間</h1>' +
      '<p class="lead">この端末・このブラウザに保存されている記録' + (state.mode === 'demo' ? '（デモモードの記録）' : '') + 'です。生徒向けの画面には表示していません。</p>';

    // 概要
    h += '<section class="tt-cards" aria-label="概要">' +
      ttCard('今日', dur(todayMs), '目標 ' + goal + '分・' + pctOf(todayMs, goal) + '%', pctOf(todayMs, goal)) +
      ttCard('今週（' + shortDate(monday) + '〜）', dur(weekMs), '目標 ' + goal * 7 + '分・' + pctOf(weekMs, goal * 7) + '%', pctOf(weekMs, goal * 7)) +
      ttCard('これまでの合計', dur(total), '学習した日 ' + studyDays + '日・回答 ' + atts.length + '問', null) +
      '</section>';

    h += pinPanelHtml();

    // 毎日の目標（保存値。変更はこの画面だけ）
    var editing = !!view.params.editGoal;
    h += '<section class="panel"><div class="panel-head"><h2>毎日の目標</h2>' +
      '<button type="button" class="btn-text" data-act="teacher-goal" aria-expanded="' + editing + '" aria-controls="tt-goal">' + (editing ? '閉じる' : '変更する') + '</button></div>' +
      '<p><strong class="num">' + goal + '分</strong>／日（生徒向けの画面には表示していません）</p>' +
      '<div id="tt-goal"' + (editing ? '' : ' hidden') + ' class="tt-goal"><div class="seg" role="radiogroup" aria-label="毎日の学習時間の目標">' +
        GOAL_OPTIONS.map(function (m) { return '<button type="button" role="radio" aria-checked="' + (goal === m) + '" class="seg-item' + (goal === m ? ' is-current' : '') + '" data-act="goal" data-min="' + m + '">' + m + '分</button>'; }).join('') +
      '</div></div></section>';

    // 日ごと（直近14日）
    var rows = '';
    for (var j = 0; j < 14; j++) {
      var d = U.addDays(today, -j), x = byDay[d];
      rows += '<tr' + (j === 0 ? ' class="is-today"' : '') + '><td>' + esc(shortDate(d)) + (j === 0 ? '<span class="muted">今日</span>' : '') + '</td>' +
        '<td class="num">' + (x ? dur(x.ms) : '—') + '</td>' +
        '<td class="num">' + (x ? pctOf(x.ms, goal) + '%' : '—') + '</td>' +
        '<td class="num">' + (x ? x.n + '問' : '—') + '</td>' +
        '<td class="num">' + (x ? Object.keys(x.sessions).length + '回' : '—') + '</td></tr>';
    }
    h += '<section class="panel"><div class="panel-head"><h2>日ごと（直近14日）</h2></div>' +
      '<div class="table-wrap"><table class="att-table"><thead><tr><th>日付</th><th>学習時間</th><th>目標比</th><th>回答</th><th>学習回</th></tr></thead><tbody>' + rows + '</tbody></table></div></section>';

    // 学習回ごと（新しい順）
    var recs = {};
    (state.sessions || []).forEach(function (r) { recs[r.id] = r; });
    var act = state.activeSession;
    var slist = Object.keys(bySession).map(function (k) { return bySession[k]; }).sort(function (a, b) { return b.first - a.first; });
    h += '<section class="panel"><div class="panel-head"><h2>学習回ごと</h2><p class="panel-note">離席 ＝ 問題を開いたまま、ほかのアプリやタブに切り替えていた時間（学習時間には含めません）。</p></div>' +
      (slist.length ? '<div class="table-wrap"><table class="att-table"><thead><tr><th>開始</th><th>種類</th><th>回答</th><th>学習時間</th><th>離席</th><th>状態</th></tr></thead><tbody>' +
        slist.map(function (s) {
          var r = recs[s.id], type = (r && r.type) || s.type;
          var setName = (r && r.practiceSet === 'lv1') || (act && act.id === s.id && act.practiceSet === 'lv1') ? '不定詞Lv1の練習' : null;
          var state_ = r ? (r.endedEarly ? '途中で終了' : '完了') : (act && act.id === s.id ? '途中（保存中）' : '—');
          return '<tr><td class="num">' + U.fmtDateTime(s.first) + '</td>' +
            '<td>' + esc(setName || SESSION_LABEL[type] || type || '—') + (r && r.rangeLabel ? '<span class="muted">' + esc(r.rangeLabel) + '</span>' : (act && act.id === s.id && act.rangeLabel ? '<span class="muted">' + esc(act.rangeLabel) + '</span>' : '')) + '</td>' +
            '<td class="num">' + s.n + '問</td><td class="num">' + dur(s.ms) + '</td>' +
            '<td class="num">' + (s.away > 1000 ? dur(s.away) : '—') + '</td><td>' + state_ + '</td></tr>';
        }).join('') + '</tbody></table></div>' : '<p class="muted">まだ回答がありません。</p>') + '</section>';

    // 項目ごと
    var skills = [];
    Object.keys(EA.banks).forEach(function (k) { EA.banks[k].skills.forEach(function (sk) { skills.push(sk); }); });
    h += '<section class="panel"><div class="panel-head"><h2>項目ごと</h2></div>' +
      '<div class="table-wrap"><table class="att-table"><thead><tr><th>項目</th><th>学習時間</th><th>回答</th><th>1問あたり</th></tr></thead><tbody>' +
      skills.map(function (sk) {
        var k = bySkill[sk.id];
        return '<tr><td>' + esc(sk.term) + '<span class="muted">' + esc(sk.label) + '</span></td>' +
          '<td class="num">' + (k ? dur(k.ms) : '—') + '</td><td class="num">' + (k ? k.n + '問' : '—') + '</td>' +
          '<td class="num">' + (k && k.n ? dur(Math.round(k.ms / k.n)) : '—') + '</td></tr>';
      }).join('') + '</tbody></table></div></section>';

    // 数え方
    h += '<section class="panel"><div class="panel-head"><h2>数え方</h2></div><ul class="plain-list">' +
      '<li>問題を開いてから答えを確定するまで、画面が表示されていた時間を数えます。</li>' +
      '<li>正誤・解説を読んでいる時間、「保存してホームへ」でホームに戻っていた時間、ほかのアプリに切り替えていた時間は含めません。</li>' +
      '<li>1問あたり ' + Math.round(cap / 60000) + '分を上限にしています（開いたまま放置した時間を除くため）。上限で切った回答：' + capped + '問。</li>' +
      '<li>「もう一度練習」・試作の問題の時間も含みます。答えた日の日付で数えます。</li>' +
      '<li>元のデータは、設定の「記録を書き出す」にも含まれています（回答ごとの activeMs・awayMs・elapsedMs）。</li></ul></section>';
    return h;
  }

  /* ---- 講師用の暗証番号 ---- */
  var PIN_MAX_FAILS = 5, PIN_WAIT_MS = 30 * 1000;
  function normPin(v) { var x = String(v || ''); if (x.normalize) x = x.normalize('NFKC'); return x.replace(/\s+/g, ''); }
  function validPin(v) { return /^\d{4,8}$/.test(v); }
  function pinField(id, label, ac) {
    return '<label class="field-label" for="' + id + '">' + label + '</label>' +
      '<input id="' + id + '" name="' + id + '" class="text-input pin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8"' +
      ' autocomplete="' + ac + '" autocorrect="off" autocapitalize="off" spellcheck="false">';
  }
  function pinMsgHtml() {
    var m = teacherMsg; teacherMsg = '';
    return m ? '<p class="toast toast-error pin-msg" role="alert">' + esc(m) + '</p>' : '';
  }
  function pinWaitLeft() { var l = EA.storage.getPinLock(); return Math.max(0, (l.until || 0) - Date.now()); }

  /** 鍵がかかっているとき：はじめては暗証番号の設定、2回目からは入力 */
  function renderTeacherLock() {
    var back = '<button type="button" class="btn-text back" data-act="teacher-back">← 設定に戻る</button><p class="eyebrow">講師向け</p>';
    if (!EA.storage.getTeacherPin()) {
      return back + '<h1 class="page-title">講師用の暗証番号を設定</h1>' +
        '<form class="panel pin-form" data-form="pin-setup" autocomplete="off" novalidate>' +
        '<p>講師向けの画面（学習時間・毎日の目標）を開くための暗証番号を決めてください。数字4〜8桁で、この端末にだけ保存します。</p>' +
        pinMsgHtml() + pinField('pin-new', '暗証番号（数字4〜8桁）', 'new-password') + pinField('pin-new2', 'もう一度入力', 'new-password') +
        '<div class="actions-inline"><button type="submit" class="btn-primary">設定して開く</button></div>' +
        '<p class="field-note">生徒に見られないように入力してください。忘れた場合は、設定の「記録をすべて消す」で学習記録といっしょに消すまで元に戻せません。</p></form>';
    }
    var wait = pinWaitLeft();
    if (wait && !pinLockTimer) pinLockTimer = setTimeout(function () { pinLockTimer = null; if (view.name === 'teacher-time' && !teacherUnlocked) render(); }, wait + 50);
    return back + '<h1 class="page-title">' + icon('lock') + ' 講師向けの画面</h1>' +
      '<form class="panel pin-form" data-form="pin-enter" autocomplete="off" novalidate>' +
      '<p>講師用の暗証番号を入力してください。</p>' + pinMsgHtml() +
      (wait ? '<p class="toast toast-error pin-msg" role="alert">' + PIN_MAX_FAILS + '回続けて間違えたため、' + Math.ceil(wait / 1000) + '秒後にもう一度試せます。</p>' : '') +
      pinField('pin-input', '暗証番号', 'off') +
      '<div class="actions-inline"><button type="submit" class="btn-primary"' + (wait ? ' disabled' : '') + '>開く</button></div>' +
      '<p class="field-note">忘れた場合は、設定の「記録をすべて消す」で学習記録といっしょに消すまで元に戻せません。</p></form>';
  }

  /** 開いている講師向けの画面の「暗証番号」欄（変更） */
  function pinPanelHtml() {
    var open = teacherForm === 'change';
    return '<section class="panel"><div class="panel-head"><h2>講師用の暗証番号</h2>' +
      '<button type="button" class="btn-text" data-act="pin-change-open" aria-expanded="' + open + '" aria-controls="pin-change">' + (open ? '閉じる' : '変更する') + '</button></div>' +
      '<p class="muted">この画面は、画面を離れる・ほかのアプリに切り替える・再読み込みすると鍵がかかります。</p>' +
      (open ? '<form class="pin-form pin-change" id="pin-change" data-form="pin-change" autocomplete="off" novalidate>' + pinMsgHtml() +
        pinField('pin-new', '新しい暗証番号（数字4〜8桁）', 'new-password') + pinField('pin-new2', 'もう一度入力', 'new-password') +
        '<div class="actions-inline"><button type="submit" class="btn-primary">変更する</button></div></form>' : '') +
      '</section>';
  }

  function focusPinField() {
    var f = appEl.querySelector('#pin-input:not([disabled]), .pin-form[data-form="pin-setup"] #pin-new');
    if (f && !teacherUnlocked) { try { f.focus({ preventScroll: true }); } catch (e) { /* 無視 */ } }
  }

  function onPinSubmit(ev) {
    var form = ev.target.closest('form[data-form]');
    if (!form) return;
    ev.preventDefault();
    var kind = form.getAttribute('data-form');
    function val(id) { var el = form.querySelector('#' + id); return el ? normPin(el.value) : ''; }
    if (kind === 'pin-enter') {
      if (pinWaitLeft()) { render(); return; }
      var pin = val('pin-input');
      if (pin && EA.storage.checkTeacherPin(pin)) {
        EA.storage.setPinLock(null);
        teacherUnlocked = true; teacherForm = null; render();
        var tt = document.getElementById('tt-title'); if (tt) tt.focus({ preventScroll: true });
        return;
      }
      var l = EA.storage.getPinLock();
      l.fails = (l.fails || 0) + 1;
      if (l.fails >= PIN_MAX_FAILS) { l = { fails: 0, until: Date.now() + PIN_WAIT_MS }; teacherMsg = ''; }
      else teacherMsg = pin ? '暗証番号が違います（あと' + (PIN_MAX_FAILS - l.fails) + '回で、しばらく入力できなくなります）。' : '暗証番号を入力してください。';
      EA.storage.setPinLock(l);
      render();
      return;
    }
    if (kind === 'pin-setup' || kind === 'pin-change') {
      if (kind === 'pin-setup' && EA.storage.getTeacherPin()) { render(); return; } // すでに設定済み（別の画面から設定された）
      if (kind === 'pin-change' && !teacherUnlocked) { render(); return; }
      var a = val('pin-new'), b = val('pin-new2');
      if (!validPin(a)) teacherMsg = '暗証番号は数字4〜8桁で入力してください。';
      else if (a !== b) teacherMsg = '2回の入力が一致しません。もう一度入力してください。';
      else if (!EA.storage.setTeacherPin(a)) teacherMsg = 'この端末では保存できない状態のため、暗証番号を設定できませんでした。';
      else {
        teacherUnlocked = true; teacherForm = null;
        notice = kind === 'pin-setup' ? '講師用の暗証番号を設定しました。次からはこの番号で開きます。' : '講師用の暗証番号を変更しました。';
        render();
        var t2 = document.getElementById('tt-title'); if (t2) t2.focus({ preventScroll: true });
        return;
      }
      render();
      var first = appEl.querySelector('#pin-new'); if (first) first.focus({ preventScroll: true });
    }
  }

  function ttCard(label, value, sub, pct) {
    return '<div class="tt-card"><p class="dash-label">' + esc(label) + '</p><p class="tt-value num">' + esc(value) + '</p>' +
      (pct != null ? '<div class="bar" role="progressbar" aria-label="' + esc(label + 'の目標に対する学習時間') + '" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><span style="width:' + pct + '%"></span></div>' : '') +
      '<p class="muted tt-sub">' + esc(sub) + '</p></div>';
  }

  /* ================= 描画と操作 ================= */
  function render() {
    var main;
    switch (view.name) {
      case 'units': main = renderUnits(); break;
      case 'session': main = renderSession(); break;
      case 'results': main = renderResults(); break;
      case 'summary': main = renderSummary(); break;
      case 'history': main = renderHistory(); break;
      case 'question': main = renderQuestion(); break;
      case 'settings': main = renderSettings(); break;
      case 'teacher-time': main = teacherUnlocked ? renderTeacherTime() : renderTeacherLock(); break;
      default: main = renderHome();
    }
    var n = !notice ? '' : typeof notice === 'string' ? '<div class="toast" role="status">' + esc(notice) + '</div>'
      : notice.temp ? '<div class="toast toast-temp" role="status">' + esc(notice.text) + '</div>'
      : '<div class="toast toast-' + notice.tone + '" role="alert">' + esc(notice.text) + '</div>';
    var tempToast = !!(notice && notice.temp);
    notice = null;
    appEl.innerHTML = topbar() + '<main class="main view-' + view.name + '" id="main">' + n + main + '</main>';
    appEl.setAttribute('data-view', view.name);
    shownDay = U.startOfDay(now());
    appEl.setAttribute('data-mode', state.mode);
    if (view.name === 'session') { mountSessionWidgets(); animateProgress(); }
    if (view.name === 'teacher-time') focusPinField();
    if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
    if (tempToast) {
      // 一時表示：数秒で消える（消えても操作には影響しない）
      toastTimer = setTimeout(function () {
        toastTimer = null;
        var el = appEl.querySelector('.toast-temp');
        if (!el) return;
        el.classList.add('is-leaving');
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 300);
      }, TOAST_MS);
    }
  }

  function reloadFrom(result) {
    state = result.state; readOnly = result.readOnly; loadMessage = result.message || '';
    syncClock(); saveOk = true;
  }

  var GUARDED = { submit: 1, giveup: 1, reason: 1, 'reason-choose': 1, next: 1 };

  /* ================= 効果音（採点結果を初めて表示したときだけ。表示・採点・保存には関係しない） ================= */
  /*
   * 鳴らすのは「回答を確定」「意味の問いの回答を確定」を押して、その場で正誤を表示したときだけ（クリック処理の中から呼ぶ）。
   * 描き直し・再開・再読み込み・選択・並び替え・「解説をみる」では呼ばない。初回診断は正誤を表示しないので鳴らさない。
   * 音はファイルを使わず Web Audio で作る。再生できない端末・ブラウザでは何もしない（例外は外へ出さない）。
   */
  var audioCtx = null;
  function soundOn() { return state.settings.soundEffects !== false; }
  /** 正解（意味の問いも合っている）→ correct、不正解・意味の問いが違う → incorrect、採点保留・指定の形と違う・「解説をみる」→ 鳴らさない */
  function soundKindFor(a) {
    if (!a || a.gaveUp) return null;
    if (G.isSkillCorrect(a.result)) return a.reason && a.reason.correct === false ? 'incorrect' : 'correct';
    if (G.isSkillWrong(a.result)) return 'incorrect';
    return null;
  }
  function playResultSound(kind) {
    if (!kind || !soundOn()) return;
    try {
      var AC = root.AudioContext || root.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === 'suspended' && audioCtx.resume) {
        var pr = audioCtx.resume();
        if (pr && pr.catch) pr.catch(function () { /* 無視 */ });
      }
      var t0 = audioCtx.currentTime + 0.01;
      var notes = kind === 'correct'
        // 正解：短く明るい2音（上がる）
        ? [{ f: 880, at: 0, d: 0.09, g: 0.12, type: 'sine' }, { f: 1318.5, at: 0.08, d: 0.16, g: 0.1, type: 'sine' }]
        // 不正解：小さく柔らかい1音（少し下がる）。責める感じにしない
        : [{ f: 330, to: 262, at: 0, d: 0.24, g: 0.07, type: 'triangle' }];
      notes.forEach(function (n) {
        var o = audioCtx.createOscillator(), g = audioCtx.createGain(), s = t0 + n.at;
        o.type = n.type;
        o.frequency.setValueAtTime(n.f, s);
        if (n.to) o.frequency.exponentialRampToValueAtTime(n.to, s + n.d);
        g.gain.setValueAtTime(0.0001, s);
        g.gain.exponentialRampToValueAtTime(n.g, s + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, s + n.d);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(s); o.stop(s + n.d + 0.02);
      });
    } catch (e) { /* 再生できなくても、採点と画面遷移はそのまま続ける */ }
  }
  /** 確定の直後、いまの問題の正誤を表示する段階になっていれば鳴らす */
  function soundIfResultShown(a) {
    var s = state.activeSession;
    if (!a || !s || !s.current || s.current.attemptId !== a.id || s.current.phase !== 'feedback') return;
    playResultSound(soundKindFor(a));
  }

  /* ================= 「解説をみる」（既存の「わからない」の処理で確定） ================= */
  function confirmExplainOn() { return state.settings.confirmBeforeExplain !== false; }
  /** 初回診断は解説をその場で出さず次の問題へ進むので、ボタンと確認画面の文言を変える（処理は同じ） */
  function giveUpLabel(s) { return s && s.type === 'diagnostic' ? 'わからない（次へ）' : '解説をみる'; }

  /** 既存の「わからない」と同じ処理で回答を確定し、正誤・解説の表示へ進む */
  function giveUpAndExplain(btn) {
    if (btn) btn.disabled = true;
    var res = S.submit(state, SB(), true, T());
    if (!res) { persist(); return; } // すでに確定済み（二重確定は記録しない）
    tapGuardUntil = Date.now() + TAP_GUARD_MS;
    afterProgress(res.finished);
  }

  /**
   * 確認画面。画面を描き直さずに重ねて開くので、入力・選択はそのまま残る。
   * 「問題に戻る」（Esc を含む）：確定も設定の保存もしない。
   * 「解説をみる」：チェックが入っているときだけ、次回から確認を省く設定を保存してから確定する。
   */
  function openExplainConfirm(trigger) {
    var old = document.getElementById('explain-confirm');
    if (old) old.remove();
    var dlg = document.createElement('dialog');
    dlg.id = 'explain-confirm';
    dlg.className = 'confirm-dialog';
    dlg.setAttribute('aria-labelledby', 'explain-confirm-title');
    dlg.setAttribute('aria-describedby', 'explain-confirm-body');
    var diag = !!(state.activeSession && state.activeSession.type === 'diagnostic');
    dlg.innerHTML = '<h2 id="explain-confirm-title">' + (diag ? '次の問題へ進みますか？' : '解説を開きますか？') + '</h2>' +
      '<p id="explain-confirm-body">この問題は『わからない』として記録され、正解には数えられません。' + (diag ? '解説は全問に答えたあとに表示されます。' : '') + '</p>' +
      '<label class="check-row"><input type="checkbox" id="explain-confirm-skip">次回からこの確認を表示しない</label>' +
      '<div class="confirm-actions">' +
        '<button type="button" class="btn-quiet" data-cx="back">問題に戻る</button>' +
        '<button type="button" class="btn-primary" data-cx="open">' + giveUpLabel(state.activeSession) + '</button>' +
      '</div>';
    document.body.appendChild(dlg);
    var done = false;
    function close() {
      if (done) return false;
      done = true;
      if (dlg.open) dlg.close();
      dlg.remove();
      return true;
    }
    function back() {
      if (!close()) return;
      var b = appEl.querySelector('[data-act="giveup"]') || trigger;
      if (b) b.focus({ preventScroll: true });
    }
    dlg.addEventListener('cancel', function (ev) { ev.preventDefault(); back(); });
    dlg.addEventListener('click', function (ev) {
      if (ev.target === dlg) { back(); return; } // 背景を押したときも戻る
      var b = ev.target.closest('[data-cx]');
      if (!b) return;
      if (b.getAttribute('data-cx') === 'back') { back(); return; }
      var skip = dlg.querySelector('#explain-confirm-skip').checked;
      if (!close()) return;
      if (skip) state.settings.confirmBeforeExplain = false; // 保存は確定の処理（persist）でまとめて行う
      giveUpAndExplain(appEl.querySelector('[data-act="giveup"]'));
    });
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
    dlg.querySelector('[data-cx="back"]').focus();
  }

  function onClick(ev) {
    var el = ev.target.closest('[data-go],[data-act]');
    if (!el || el.disabled) return;
    if (el.hasAttribute('data-go')) { go(el.getAttribute('data-go')); return; }
    var act = el.getAttribute('data-act');
    var s = state.activeSession;
    var t = T();
    // 画面が切り替わった直後の連続タップ（二重タップ）は無視する。
    // 前の画面へのタップが、新しく出たボタン（次へ・次の問題の選択肢など）に当たるのを防ぐ
    if (GUARDED[act]) {
      if (Date.now() < tapGuardUntil) return;
    }
    switch (act) {
      case 'task-resume': go('session'); break;
      case 'task-diagnostic': startSession(P.buildDiagnosticSession(BANK, t.app)); break;
      case 'task-practice': startSession(P.buildPracticeSession(state, BANK, t.app)); break;
      case 'task-review': {
        // ホームの課題からは不定詞、履歴・復習の単元の詳細からは選んだ単元（data-unit）の復習を始める
        var rb = EA.banks[el.getAttribute('data-unit')] || BANK;
        if (state.activeSession) { go('session'); break; }
        startSession(P.buildReviewSession(state, rb, t.app)); break;
      }
      case 'skip-practice-later': notice = '診断の結果は記録しました。解説と類題はホームから始められます。'; go('home'); break;
      case 'skip-practice': P.unitState(state, BANK.unit.id).practiceSkippedAt = t.app; persist(); go('home'); break;
      case 'save-home': saveAndGoHome(); break;
      case 'choose': selectChoice(el.getAttribute('data-choice')); break;
      case 'toggle-explain': toggleExplanation(el); break;
      case 'toggle-help': toggleHelp(el); break;
      case 'task-trial': startSession(P.buildTrialSession(EA.banks[el.getAttribute('data-unit')], t.app)); break;
      case 'sx-toggle': case 'sx-prev': case 'sx-next': case 'sx-restart': case 'sx-trans': structureAction(act); break;
      case 'unsure': s.current.unsure = !s.current.unsure; persist(); render(); break;
      case 'hint': s.current.hintUsed = true; persist(); render(); break;
      case 'giveup':
        if (!s || !s.current || s.current.phase !== 'answer' || s.current.attemptId) break;
        if (confirmExplainOn()) openExplainConfirm(el); else giveUpAndExplain(el);
        break;
      case 'self-open':
        view.params.selfOpen = !view.params.selfOpen; render();
        var so = appEl.querySelector('[data-act="self-open"]'); if (so) so.focus({ preventScroll: true });
        break;
      case 'self-range':
        view.params.selfRange = el.getAttribute('data-range'); render();
        var sr = appEl.querySelector('[data-act="self-range"][data-range="' + view.params.selfRange + '"]'); if (sr) sr.focus({ preventScroll: true });
        break;
      case 'lv1-start':
        // 保存中の途中の学習は上書きしない（再開へ案内する）
        if (state.activeSession) { notice = { tone: 'error', text: '途中の学習が保存されているため、Lv1の練習は始められません。「途中の学習を再開」から続きを進めてください。' }; render(); break; }
        startSession(P.buildFixedSetSession(LV1, 'lv1', '不定詞Lv1（' + lv1Count() + '問）', t.app)); break;
      case 'self-start':
        // 保存中の途中の学習は上書きしない
        if (state.activeSession) { notice = { tone: 'error', text: '途中の学習が保存されているため、もう一度練習は始められません。続きを最後まで進めてください。' }; render(); break; }
        startSession(P.buildSelfPracticeSession(state, BANK, view.params.selfRange || 'all', t.app)); break;
      case 'sound-toggle':
        state.settings.soundEffects = !soundOn(); persist(); render();
        var st_ = appEl.querySelector('[data-act="sound-toggle"]'); if (st_) st_.focus({ preventScroll: true });
        break;
      case 'confirm-explain':
        state.settings.confirmBeforeExplain = !confirmExplainOn(); persist(); render();
        var ce = appEl.querySelector('[data-act="confirm-explain"]'); if (ce) ce.focus({ preventScroll: true });
        break;
      case 'submit': {
        el.disabled = true;
        var res = S.submit(state, SB(), false, t);
        if (!res) break; // すでに確定済み（二重確定は記録しない）
        tapGuardUntil = Date.now() + TAP_GUARD_MS;
        soundIfResultShown(res.attempt); // 意味の問いへ進むとき・初回診断では、まだ正誤を出さないので鳴らない
        afterProgress(res.finished); break;
      }
      case 'reason-choose': selectReason(el.getAttribute('data-choice')); break;
      case 'reason':
        if (!s || !s.current || !s.current.reasonDraft) break;
        el.disabled = true;
        var ra = S.submitReason(state, SB(), s.current.reasonDraft);
        if (!ra) { render(); break; }
        tapGuardUntil = Date.now() + TAP_GUARD_MS;
        soundIfResultShown(ra);
        persist(); render(); break;
      case 'next': {
        var r = S.next(state, SB(), t);
        if (r === false) break;
        tapGuardUntil = Date.now() + TAP_GUARD_MS;
        afterProgress(r); break;
      }
      case 'skill': go('history', { unit: BANK.unit.id, skill: el.getAttribute('data-skill') }); scrollToSkill(el.getAttribute('data-skill')); break;
      case 'question': go('question', { q: el.getAttribute('data-q') }); break;
      case 'back-history': go('history', { unit: el.getAttribute('data-unit'), skill: el.getAttribute('data-skill') }); scrollToSkill(el.getAttribute('data-skill')); break;
      case 'history-unit': go('history', { unit: el.getAttribute('data-unit') }); break;
      case 'history-units': go('history'); break;
      case 'goal-edit': view.params.editGoal = !view.params.editGoal; render(); var ge = appEl.querySelector('[data-act="goal-edit"]'); if (ge) ge.focus({ preventScroll: true }); break;
      case 'dev-add':
        if (state.mode !== 'demo') break; // 通常の記録では日付を動かさない
        state.demo.dayOffset += (+el.getAttribute('data-days')); syncClock(); persist(); render(); break;
      case 'demo-enter': {
        var ds = EA.storage.enterDemo();
        if (!ds) { notice = 'デモモードを始められませんでした（保存できない状態です）。'; render(); break; }
        reloadFrom({ state: ds, readOnly: false }); notice = 'デモモードを始めました。通常の記録はそのまま残っています。'; go('home'); break;
      }
      case 'demo-exit': reloadFrom(EA.storage.exitDemo()); notice = 'デモモードを終えました。デモの記録は消え、通常の記録に戻りました。'; go('home'); break;
      case 'dismiss-load': loadMessage = ''; render(); break;
      case 'teacher-time': go('teacher-time'); break;
      case 'teacher-lock': teacherUnlocked = false; notice = '講師向けの画面に鍵をかけました。'; go('settings'); break;
      case 'pin-change-open': teacherForm = teacherForm === 'change' ? null : 'change'; render(); var pc = appEl.querySelector(teacherForm ? '#pin-new' : '[data-act="pin-change-open"]'); if (pc) pc.focus({ preventScroll: true }); break;
      case 'teacher-back': go('settings'); break;
      case 'teacher-goal': view.params.editGoal = !view.params.editGoal; render(); var tg = appEl.querySelector('[data-act="teacher-goal"]'); if (tg) tg.focus({ preventScroll: true }); break;
      case 'goal':
        if (view.name !== 'teacher-time' || !teacherUnlocked) break; // 目標の変更は、暗証番号で開いた講師向けの画面からだけ
        state.settings.dailyGoalMinutes = +el.getAttribute('data-min'); persist(); render();
        var gb = appEl.querySelector('[data-act="goal"][data-min="' + el.getAttribute('data-min') + '"]'); if (gb) gb.focus({ preventScroll: true });
        break;
      case 'export': view.params.exported = true; render(); break;
      case 'copy-export': copyExport(); break;
      case 'reset-ask': view.params.confirmReset = true; render(); break;
      case 'reset-cancel': view.params.confirmReset = false; render(); break;
      case 'reset-do':
        EA.storage.clearNormal(); EA.storage.clearTeacherPin(); state = EA.storage.defaultState('normal'); syncClock();
        notice = persist() ? '記録をすべて消しました。' : '記録を消しましたが、新しい記録を保存できない状態です。'; go('home'); break;
    }
  }

  function scrollToSkill(id) {
    var el = document.getElementById('skill-' + id);
    if (el && el.scrollIntoView) el.scrollIntoView({ block: 'start' });
  }

  function copyExport() {
    var box = document.getElementById('export-box'), msg = document.getElementById('copy-msg');
    function fallback() { box.focus(); box.select(); msg.textContent = '選択しました。「コピー」を押してください。'; }
    try {
      navigator.clipboard.writeText(box.value).then(function () { msg.textContent = 'コピーしました。'; }, fallback);
    } catch (e) { fallback(); }
  }

  function boot() {
    appEl = document.getElementById('app');
    appEl.addEventListener('click', onClick);
    appEl.addEventListener('submit', onPinSubmit);
    S.recover(state); // 前回、計時中のまま閉じていた場合も、閉じていた時間は学習時間に数えない
    if (loaded.status === 'migrated' || loaded.status === 'new' || loaded.status === 'ok') persist();
    if (loaded.status === 'migrated') loadMessage = '記録を新しい形式に引き継ぎました（' + loadMessage + '）。元のデータの控えも保存しています。';
    render();
  }

  // テストや開発用に中身を見られるようにしておく
  EA.app = { getState: function () { return state; }, go: go, isSaveOk: function () { return saveOk; },
    isTapGuarded: function () { return Date.now() < tapGuardUntil; } };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(typeof window !== 'undefined' ? window : globalThis);

</script>

</body></html>
