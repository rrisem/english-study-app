<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>英文法ドリル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="英文法ドリル">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/*
 * レイアウトの考え方：澄んだ空の色の上に、白いカードを浮かべる。ホームは「次にやること｜単元の進み具合」を
 * 1枚のカードにまとめ、その下に3つの使い方の確認状況、いちばん下に今週の学習。今日の学習時間は「学習時間」画面に分ける。
 * 問題画面は1列・中央寄せで、英文と回答操作だけに集中できる配置。
 * 色：空の青（押す場所・いまここ）＋ 蛍光ペンの黄色（解説で to＋動詞 の部分に引く線）。正誤・状態の色は別に持つ。
 */
:root {
  --bg: #edf3fa;
  --bg-top: #f7fafd;
  --surface: #ffffff;
  --surface-2: #f0f4fa;
  --ink: #17253b;
  --muted: #56647b;
  --line: #dde5f0;
  --accent: #1c5cc0;
  --accent-2: #3d8ee6;
  --accent-ink: #ffffff;
  --accent-soft: #e2ecfa;
  --track: #e3e9f2;
  --marker: #fff0a3;
  --marker-ink: #3b3100;
  --ok: #1f6b45;
  --ok-soft: #e1f1e8;
  --ng: #a3342c;
  --ng-soft: #f8e4e1;
  --hold: #7a5a00;
  --hold-soft: #f6efd8;
  --focus: #e0a100;
  --chip-1: #2f6fc4;
  --chip-2: #c25a3e;
  --chip-3: #55677e;
  --chip-ink: #ffffff;
  --hill-1: #c8daf1;
  --hill-2: #d9e6f6;
  --hill-3: #e6eef9;
  --flame: #e0663f;
  --shadow: 0 12px 32px rgba(28, 72, 140, 0.08), 0 1px 3px rgba(28, 72, 140, 0.06);
  --glow: 0 8px 20px rgba(28, 92, 192, 0.28);
  --cta: #154a9f;       /* その状態でいちばん優先する操作のボタン（ホームで最も濃い青） */
  --cta-ink: #ffffff;

  --font-ja: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --font-en: "Atkinson Hyperlegible", "Helvetica Neue", Arial, var(--font-ja);
  --font-mono: ui-monospace, "SFMono-Regular", Menlo, monospace;

  --fs-xs: 0.8125rem;
  --fs-s: 0.9375rem;
  --fs-m: 1.0625rem;
  --fs-l: 1.375rem;
  --fs-xl: 1.75rem;
  --fs-xxl: 2.25rem;

  --r: 18px;
  --r-s: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1520; --bg-top: #121c2b; --surface: #172131; --surface-2: #1e2a3d; --ink: #e6edf7; --muted: #a2b2c8; --line: #2b3b53;
    --accent: #86b6f5; --accent-2: #5f9dec; --accent-ink: #0b1626; --accent-soft: #1f3354; --track: #26354b;
    --marker: #5c4f12; --marker-ink: #fff3c4;
    --ok: #7fd1a3; --ok-soft: #173326; --ng: #f19a90; --ng-soft: #3a1d1b; --hold: #e6c56a; --hold-soft: #332a12; --focus: #ffcc4d;
    --chip-1: #3e78c8; --chip-2: #b85a40; --chip-3: #5a6c84; --chip-ink: #ffffff;
    --hill-1: #1c2b42; --hill-2: #172437; --hill-3: #131e2e; --flame: #f08a63;
    --shadow: 0 12px 32px rgba(0, 0, 0, 0.35), 0 1px 3px rgba(0, 0, 0, 0.3); --glow: 0 8px 20px rgba(0, 0, 0, 0.35);
    --cta: #8fbcf7; --cta-ink: #0b1626;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1520; --bg-top: #121c2b; --surface: #172131; --surface-2: #1e2a3d; --ink: #e6edf7; --muted: #a2b2c8; --line: #2b3b53;
  --accent: #86b6f5; --accent-2: #5f9dec; --accent-ink: #0b1626; --accent-soft: #1f3354; --track: #26354b;
  --marker: #5c4f12; --marker-ink: #fff3c4;
  --ok: #7fd1a3; --ok-soft: #173326; --ng: #f19a90; --ng-soft: #3a1d1b; --hold: #e6c56a; --hold-soft: #332a12; --focus: #ffcc4d;
  --chip-1: #3e78c8; --chip-2: #b85a40; --chip-3: #5a6c84; --chip-ink: #ffffff;
  --hill-1: #1c2b42; --hill-2: #172437; --hill-3: #131e2e; --flame: #f08a63;
  --shadow: 0 12px 32px rgba(0, 0, 0, 0.35), 0 1px 3px rgba(0, 0, 0, 0.3); --glow: 0 8px 20px rgba(0, 0, 0, 0.35);
  --cta: #8fbcf7; --cta-ink: #0b1626;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg) linear-gradient(180deg, var(--bg-top) 0, var(--bg) 480px) no-repeat;
  color: var(--ink);
  font-family: var(--font-ja);
  font-size: var(--fs-m);
  line-height: 1.7;
  -webkit-tap-highlight-color: transparent;
}
[lang="en"] { font-family: var(--font-en); }
button { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.35; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.label { display: inline-block; font-size: var(--fs-xs); color: var(--muted); letter-spacing: 0.06em; margin-right: 0.75em; font-weight: 700; }
[hidden] { display: none !important; }

/* ---------- 上部バー ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg-top); }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg-top); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.topbar-inner { max-width: 1160px; margin: 0 auto; min-height: 68px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 6px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; font-weight: 700; }
.brand-mark { font-family: var(--font-en); font-weight: 700; background: linear-gradient(160deg, var(--accent-2), var(--accent)); color: var(--accent-ink); padding: 2px 9px 3px; border-radius: 9px; font-size: 1.05rem; }
.brand-name { font-size: var(--fs-m); letter-spacing: 0.14em; }
.nav { display: flex; gap: 6px; flex-wrap: wrap; }
.nav-item { display: inline-flex; align-items: center; gap: 7px; background: none; border: 0; padding: 8px 18px; border-radius: 999px; color: var(--ink); font-size: var(--fs-s); cursor: pointer; min-height: 44px; }
.nav-item .icon { width: 18px; height: 18px; color: var(--muted); }
@media (hover: hover) { .nav-item:hover:not(.is-current) { background: var(--accent-soft); } }
.nav-item.is-current { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.nav-item.is-current .icon { color: var(--accent-ink); }
@media (max-width: 720px) {
  .topbar-inner { gap: 4px 12px; }
  .nav { width: 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding-bottom: 6px; }
  .nav-item { flex-direction: column; gap: 2px; padding: 6px 4px; border-radius: 12px; font-size: var(--fs-xs); min-height: 52px; white-space: nowrap; }
}
/* 4項目のナビを、320px 幅でも文字が切れずに1行で並べる */
@media (max-width: 360px) {
  .nav { gap: 2px; }
  .nav-item { padding-inline: 1px; font-size: 0.6875rem; letter-spacing: -0.02em; }
}
.devbar, .warnbar { font-size: var(--fs-s); padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
.devbar { background: var(--hold-soft); color: var(--hold); }
.warnbar { background: var(--ng-soft); color: var(--ng); }

/* ---------- 本体 ---------- */
.main {
  max-width: 1080px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
  display: flex; flex-direction: column; gap: 24px;
}
.view-session, .view-question, .view-results, .view-summary { max-width: 820px; }
.eyebrow { font-size: var(--fs-xs); color: var(--muted); letter-spacing: 0.08em; font-weight: 700; }
.eyebrow-note { font-weight: 400; letter-spacing: 0; margin-left: 0.75em; }
.page-title { font-size: var(--fs-xl); }
.lead { color: var(--muted); max-width: 40em; }
.toast { background: var(--accent-soft); color: var(--ink); border-radius: var(--r-s); padding: 12px 16px; font-size: var(--fs-s); }

/* ---------- ボタン ---------- */
.btn-primary, .btn-quiet, .btn-danger, .btn-toggle {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 10px 20px; border-radius: var(--r-s); cursor: pointer;
  font-weight: 700; font-size: var(--fs-s); border: 1px solid transparent; touch-action: manipulation;
}
.btn-primary { background: linear-gradient(135deg, var(--accent-2), var(--accent)); color: var(--accent-ink); border-radius: 12px; }
@media (hover: hover) { .btn-primary:hover:not(:disabled) { filter: brightness(1.08); } }
.btn-primary:disabled { background: var(--surface-2); box-shadow: none; color: var(--muted); cursor: not-allowed; filter: none; }
.btn-lg { min-height: 56px; padding: 12px 28px; font-size: var(--fs-m); }
.btn-quiet { background: var(--surface); border-color: var(--line); color: var(--ink); font-weight: 400; }
@media (hover: hover) { .btn-quiet:hover:not(:disabled) { border-color: var(--accent); } }
.btn-quiet:disabled { color: var(--muted); opacity: 0.6; cursor: not-allowed; }
.btn-danger { background: var(--ng); color: var(--surface); }
.btn-text { background: none; border: 0; padding: 8px 4px; color: var(--accent); cursor: pointer; font-size: var(--fs-s); text-decoration: underline; text-underline-offset: 3px; min-height: 40px; }
.btn-text:disabled { color: var(--muted); text-decoration: none; cursor: default; }
.btn-toggle { background: var(--surface); border-color: var(--line); font-weight: 400; }
.btn-toggle[aria-pressed="true"] { background: var(--hold-soft); border-color: var(--hold); color: var(--hold); font-weight: 700; }
.toggle-box { width: 20px; height: 20px; border: 2px solid currentColor; border-radius: 4px; display: inline-grid; place-items: center; font-size: 0.8rem; line-height: 1; }
.actions { display: flex; justify-content: flex-end; }
.actions-split { justify-content: flex-start; gap: 12px; flex-wrap: wrap; }
.actions-inline { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }

/* ---------- ホーム ----------
 * 優先順位：① 次にやること（唯一の濃いボタン）② 単元の進み具合 ③ 項目ごとの確認状況 ④ 今週の学習
 * 今日の学習時間・目標は、上部ナビの「学習時間」画面にまとめる。
 * カードは「今日の学習」と「今週の学習」の2枚。項目ごとの確認状況はカードにせず、細い縦線で3列に分ける。
 */
.view-home { max-width: 1160px; padding-block: 8px 72px; gap: 28px; }
.icon { width: 1.15em; height: 1.15em; flex: none; vertical-align: -0.2em; }
.home { display: grid; gap: clamp(24px, 4vw, 40px); min-width: 0; }
.home h1, .home h2 { font-feature-settings: "palt"; }

/* あいさつ＋背景の丘（飾り） */
.greet-line { color: var(--muted); font-size: var(--fs-s); letter-spacing: 0.08em; margin: 0 0 -8px; }

/* 共通の小物 */
.bar { height: 8px; border-radius: 99px; background: var(--track); overflow: hidden; }
.bar span { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent-2), var(--accent)); }
.dash-head { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: var(--fs-m); }
.dash-icon { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); }
.dash-icon .icon { width: 19px; height: 19px; }
.dash-label { font-size: var(--fs-xs); color: var(--muted); font-weight: 700; letter-spacing: 0.06em; display: flex; align-items: center; gap: 6px; }
.btn-link { background: none; border: 0; padding: 8px 0; min-height: 40px; color: var(--accent); font-weight: 700; font-size: var(--fs-s); display: inline-flex; align-items: center; gap: 2px; cursor: pointer; letter-spacing: 0.04em; }
.btn-link .icon { width: 16px; height: 16px; }

/* 1. 今日の学習（1枚のカード）：広い幅（iPad横向きなど）は「次にやること｜単元の進み具合」の2列。
 *    狭い幅では「次にやること」を先にして縦に並べる */
.dash { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0, 1fr); background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: clamp(20px, 3vw, 32px); gap: 24px; }
.dash-col { display: grid; gap: 12px; align-content: start; min-width: 0; }
@media (min-width: 900px) {
  .dash { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 0; }
  .dash-col { padding-inline: clamp(20px, 2.6vw, 36px); }
  .dash-col:first-child { padding-left: 0; }
  .dash-col:last-child { padding-right: 0; }
  .dash-col + .dash-col { border-left: 1px solid var(--line); }
}
@media (max-width: 899px) {
  .dash .hero { padding-bottom: 20px; border-bottom: 1px solid var(--line); }
}
.hero-title { font-size: clamp(1.5rem, 1.1rem + 1.4vw, 1.875rem); line-height: 1.3; overflow-wrap: anywhere; }
.hero-detail { font-size: var(--fs-s); color: var(--muted); overflow-wrap: anywhere; }
.hero-why { font-size: var(--fs-s); color: var(--muted); }
.hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 4px; }
.hero .btn-primary { border-radius: 16px; min-height: 58px; padding-inline: 28px; justify-content: space-between; min-width: min(100%, 300px); box-shadow: var(--glow); }
.hero .btn-primary .icon { width: 20px; height: 20px; }
.hero .btn-quiet .icon { color: var(--accent); }
.hero-due { display: flex; align-items: flex-start; gap: 8px; margin: 0; padding: 12px 14px; border-radius: var(--r-s); background: var(--hold-soft); color: var(--ink); font-size: var(--fs-s); }
.hero-due .icon { color: var(--hold); margin-top: 0.2em; }
.hero-due .num { font-family: var(--font-en); font-size: 1.125rem; margin: 0 2px; }

.unit-col { grid-template-columns: 96px minmax(0, 1fr); column-gap: 18px; align-items: center; }
.unit-col > .path, .unit-col > .dash-fact { grid-column: 1 / -1; }
.unit-tile { width: 96px; height: 96px; border-radius: 16px; display: grid; place-content: center; text-align: center; line-height: 1.1;
  background: linear-gradient(160deg, var(--accent-2), var(--accent)); color: var(--accent-ink); box-shadow: var(--glow); }
.unit-tile [lang="en"] { font-family: var(--font-en); font-weight: 700; font-size: 2.125rem; letter-spacing: -0.02em; }
.unit-tile-plus { font-size: var(--fs-xs); font-weight: 700; opacity: 0.9; }
.unit-info { display: grid; gap: 4px; min-width: 0; }
.unit-name { font-size: var(--fs-l); font-weight: 700; line-height: 1.3; }
.unit-sub { font-size: var(--fs-s); color: var(--muted); }
.unit-info .bar { margin-top: 6px; }
.dash-fact { display: flex; align-items: center; gap: 8px; font-size: var(--fs-s); color: var(--muted); padding-top: 12px; border-top: 1px solid var(--line); }
.dash-fact strong { color: var(--ink); }
.dash-fact .num { font-family: var(--font-en); font-size: 1.125rem; }
.path { list-style: none; margin: 4px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); font-size: var(--fs-xs); color: var(--muted); text-align: center; }
.path-step { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.path-step + .path-step::before { content: ""; position: absolute; top: 11px; right: calc(50% + 17px); width: calc(100% - 34px); height: 1px; background: var(--line); }
.path-mark { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); font-family: var(--font-en); font-size: 0.75rem; font-weight: 700; line-height: 1; }
.path-mark .icon { width: 13px; height: 13px; }
.path-step.is-done .path-mark { background: var(--accent-soft); border-color: var(--accent-soft); color: var(--accent); }
.path-step.is-now { color: var(--accent); font-weight: 700; }
.path-step.is-now .path-mark { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* 学習時間画面：今日の実績と目標・進捗バー・目標を変更 を1枚にまとめる */

/* 2. 項目ごとの確認状況（3列） */
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; margin-bottom: 14px; }
.section-head h2 { font-size: var(--fs-l); letter-spacing: 0.04em; margin-right: auto; }
.tag { justify-self: start; display: inline-block; padding: 3px 12px; border-radius: 8px; font-size: var(--fs-xs); font-weight: 700; letter-spacing: 0.04em; color: var(--chip-ink); }
.tag-1 { background: var(--chip-1); } .tag-2 { background: var(--chip-2); } .tag-3 { background: var(--chip-3); } .tag-4 { background: var(--accent); color: var(--accent-ink); }
.ach-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.ach-list li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: var(--fs-s); }
.ach-dot { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--muted); flex: none; }
.ach-list li.is-on .ach-dot { background: var(--accent-2); border-color: var(--accent-2); color: var(--accent-ink); }
.ach-dot .icon { width: 14px; height: 14px; }
.skill-due { color: var(--muted); white-space: nowrap; }
.skills-note { margin-top: 12px; }

/* 4. 今週の学習 */
.home .hero-detail, .home .hero-why { text-wrap: pretty; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 20px clamp(16px, 3vw, 28px); min-width: 0; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; margin-bottom: 12px; }
.panel-head h2 { font-size: var(--fs-l); }
.panel-note { font-size: var(--fs-xs); color: var(--muted); }
.att-list, .plan-list, .q-list, .result-list, .plain-list, .evidence, .sched-history { list-style: none; margin: 0; padding: 0; }
.skill-label { font-weight: 700; }
.skill-term { font-size: var(--fs-xs); color: var(--muted); margin-left: 0; font-weight: 400; }
h2 .skill-term { margin-left: 10px; }
.meter { display: inline-flex; gap: 3px; flex: none; }
.meter-seg { width: 14px; height: 14px; border-radius: 3px; border: 2px solid var(--accent); background: transparent; }
.meter-seg.on { background: var(--accent); }

/* ---------- 単元 ---------- */
.unit-head { display: flex; gap: 16px; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
.unit-head h2 { font-size: var(--fs-xl); margin: 4px 0; }
.steps { list-style: none; padding: 0; margin: 20px 0 12px; display: flex; gap: 8px; flex-wrap: wrap; }
.steps li { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 99px; background: var(--surface-2); font-size: var(--fs-s); }
.steps li.done { background: var(--ok-soft); color: var(--ok); font-weight: 700; }
.step-mark { width: 20px; height: 20px; border-radius: 50%; border: 2px solid currentColor; display: inline-grid; place-items: center; font-size: 0.75rem; }
.unit-scope { font-size: var(--fs-s); color: var(--muted); }
/* 履歴・復習：単元一覧（単元名のボタン）と単元の詳細 */
.view-history { max-width: 820px; }
.unit-picks { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.unit-pick { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 14px 20px; text-align: left; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); touch-action: manipulation; }
@media (hover: hover) { .unit-pick:hover { border-color: var(--accent); } }
.unit-pick-name { font-size: var(--fs-l); font-weight: 700; margin-right: auto; min-width: 0; overflow-wrap: anywhere; }
.unit-pick-due { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; background: var(--hold-soft); color: var(--hold); font-size: var(--fs-s); font-weight: 700; white-space: nowrap; }
.unit-pick > .icon { color: var(--muted); }
.review-panel { display: grid; gap: 12px; }
.review-panel .panel-head { margin-bottom: 0; }
.review-now { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; }
.review-count { font-weight: 700; }
.review-count .num { font-family: var(--font-en); font-size: 2rem; margin-right: 4px; }
.review-next { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.review-next .icon { color: var(--accent); align-self: center; }
.review-next strong { font-size: var(--fs-l); }
.review-skills { display: grid; gap: 12px; }
.review-skills > .skill-panel { margin-top: 12px; box-shadow: none; }
.skill-panel-head h3 { font-size: var(--fs-l); }
.section-title { font-size: var(--fs-l); margin-bottom: 12px; }
@media (max-width: 520px) { .review-now .btn-primary { width: 100%; } }
/* 単元で扱う範囲：既存の用法ラベル（タグ）だけで示す */
.unit-range { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0; }
.unit-range .label { margin-right: 4px; }
.later { color: var(--muted); padding: 0 4px; }
.later h2 { font-size: var(--fs-m); margin-bottom: 4px; }

/* ---------- 問題画面 ---------- */
.q-progress { display: grid; grid-template-columns: auto auto 1fr; align-items: center; gap: 12px; }
.q-type { font-weight: 700; color: var(--accent); }
.q-count { font-family: var(--font-en); font-variant-numeric: tabular-nums; color: var(--muted); }
.q-bar { height: 8px; background: var(--track); border-radius: 99px; overflow: hidden; }
.q-bar .q-bar-fill { display: block; height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); border-radius: 99px; transition: width 0.45s ease-out; }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: clamp(20px, 4vw, 40px); display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.q-instruction { color: var(--muted); font-size: var(--fs-s); }
.q-ja { font-size: var(--fs-l); font-weight: 700; }
.q-question { font-size: var(--fs-l); }
.q-sentence { font-size: clamp(1.5rem, 3.4vw, 2rem); line-height: 1.6; overflow-wrap: anywhere; }
.blank { display: inline-block; min-width: 5.5em; border-bottom: 3px solid var(--accent); margin: 0 0.25em; text-align: center; color: var(--accent); font-weight: 700; }
.blank.filled { background: var(--accent-soft); border-radius: 4px 4px 0 0; padding: 0 0.3em; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.choice {
  display: flex; align-items: center; gap: 12px; text-align: left;
  min-height: 60px; padding: 12px 16px; border-radius: var(--r-s);
  background: var(--surface); border: 2px solid var(--line); cursor: pointer; font-size: var(--fs-m); touch-action: manipulation;
}
.choice[lang="en"] { font-size: 1.25rem; }
@media (hover: hover) { .choice:hover:not(.choice-result) { border-color: var(--accent); } }
.choice.is-selected { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.choice-dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--muted); flex: none; }
.choice.is-selected .choice-dot { border-color: var(--accent); background: radial-gradient(circle, var(--accent) 0 45%, transparent 50%); }
.answer-area { min-width: 0; }
.field-label { display: block; font-size: var(--fs-s); font-weight: 700; margin-bottom: 6px; }
.text-input { width: 100%; font-size: 1.375rem; padding: 14px 16px; border-radius: var(--r-s); border: 2px solid var(--line); background: var(--surface); color: var(--ink); resize: vertical; font-family: var(--font-en); }
.text-input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.text-input.mono { font-family: var(--font-mono); font-size: var(--fs-xs); }
.field-note { font-size: var(--fs-xs); color: var(--muted); margin-top: 6px; }

/* 並び替え */
.order-answer {
  min-height: 84px; padding: 12px; border-radius: var(--r-s); border: 2px dashed var(--accent);
  background: var(--accent-soft); display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
}
.order-placeholder { color: var(--muted); font-size: var(--fs-s); font-family: var(--font-ja); }
.order-pool { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; min-height: 56px; }
.chip {
  font-family: var(--font-en); font-size: 1.25rem; min-height: 52px; padding: 8px 16px; border-radius: var(--r-s);
  background: var(--surface); border: 2px solid var(--line); cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none;
}
.order-answer .chip { border-color: var(--accent); }
.chip-ghost { opacity: 0.25; border-style: dashed; cursor: default; display: inline-flex; align-items: center; }
.chip-lifted { opacity: 0.35; }
.chip-drag { position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none; box-shadow: 0 8px 24px rgba(0,0,0,0.2); border-color: var(--accent); }
.order-tools { margin-top: 6px; }

.hint { background: var(--hold-soft); color: var(--ink); border-left: 4px solid var(--hold); padding: 12px 16px; border-radius: 0 var(--r-s) var(--r-s) 0; }
.helpers { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-top: 16px; border-top: 1px solid var(--line); }
.helpers-note { font-size: var(--fs-xs); color: var(--muted); flex-basis: 100%; }

.your-answer { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: var(--fs-l); }
.verdict { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.verdict .badge { font-size: var(--fs-m); padding: 6px 14px; }
.feedback-note { background: var(--surface-2); padding: 12px 16px; border-radius: var(--r-s); }
.reason { display: grid; gap: 12px; border-top: 1px solid var(--line); padding-top: 16px; }
.reason .choices { grid-template-columns: 1fr; }
.reason-q { font-size: var(--fs-l); font-weight: 700; }
.reason-result { background: var(--surface-2); padding: 12px 16px; border-radius: var(--r-s); display: grid; gap: 4px; }
.reason-correct { color: var(--muted); font-size: var(--fs-s); }

/* 正誤表示（色＋記号＋文字） */
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: var(--fs-xs); font-weight: 700; border: 1.5px solid currentColor; white-space: nowrap; }
.badge-mark { font-size: 1.1em; line-height: 1; }
.tone-ok { color: var(--ok); background: var(--ok-soft); }
.tone-ng { color: var(--ng); background: var(--ng-soft); }
.tone-hold { color: var(--hold); background: var(--hold-soft); }
.flag { display: inline-block; font-size: var(--fs-xs); padding: 2px 8px; border-radius: 4px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.flag-warn { color: var(--ng); }

/* 解説 */
.explain { border-top: 1px solid var(--line); padding-top: 20px; display: grid; gap: 12px; }
.ex-answer { font-size: clamp(1.375rem, 3vw, 1.75rem); line-height: 1.6; overflow-wrap: anywhere; }
mark { background: linear-gradient(transparent 45%, var(--marker) 45%); color: inherit; padding: 0 2px; }
.ex-translation { font-size: var(--fs-l); }
.ex-also { font-size: var(--fs-s); color: var(--muted); }
.ex-others ul { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 6px; }
.ex-others li { padding: 10px 14px; border-radius: var(--r-s); background: var(--surface-2); display: grid; gap: 2px; }
.ex-other-choice { font-weight: 700; }
.ex-other-why { font-size: var(--fs-s); color: var(--muted); }
.ex-map { list-style: none; margin: 4px 0; padding: 0; display: grid; gap: 6px; }
.ex-map li { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px 14px; border-radius: var(--r-s); background: var(--surface-2); }
.ex-map li.is-mark { background: var(--marker); color: var(--marker-ink); font-weight: 700; }
.ex-en { font-size: 1.125rem; overflow-wrap: anywhere; }
.ex-arrow { color: var(--muted); }
.ex-map li.is-mark .ex-arrow { color: inherit; }
.ex-point { border-left: 4px solid var(--accent); padding-left: 14px; }
.ex-term { font-size: var(--fs-s); color: var(--muted); }

/* 結果・まとめ */
.result-list { display: grid; gap: 12px; }
.result-row { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px 20px; }
.result-main { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; }
.result-no { font-family: var(--font-en); font-weight: 700; color: var(--muted); font-size: var(--fs-l); width: 1.5em; }
.result-body { display: grid; gap: 4px; min-width: 0; }
.result-q { font-weight: 700; }
.result-format { font-size: var(--fs-xs); color: var(--muted); margin-left: 10px; font-weight: 400; }
.result-ans { font-size: var(--fs-l); overflow-wrap: anywhere; }
.result-tags, .att-tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.result-detail { margin-top: 10px; }
summary { cursor: pointer; color: var(--accent); font-size: var(--fs-s); min-height: 40px; display: flex; align-items: center; }

.att-row {
  width: 100%; display: grid; grid-template-columns: 8.5em minmax(0, 1fr) auto; gap: 12px; align-items: center;
  background: none; border: 0; border-top: 1px solid var(--line); padding: 12px 4px; text-align: left; cursor: pointer; min-height: 56px;
}
.att-list > li:first-child .att-row, .q-list > li:first-child .att-row { border-top: 0; }
.att-row:hover { background: var(--surface-2); }
.att-type { font-size: var(--fs-xs); font-weight: 700; color: var(--accent); display: grid; }
.att-type .muted { font-weight: 400; }
.att-q { min-width: 0; display: grid; }
.att-ans { font-size: var(--fs-s); overflow-wrap: anywhere; }
ul.att-list.panel { padding-block: 8px; }

.plan-list li { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) minmax(0, 1.2fr); gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); align-items: center; }
.plan-list li:first-child { border-top: 0; }
.plan-name { display: grid; }
.plan-status { display: flex; gap: 10px; align-items: center; font-size: var(--fs-s); }
.plan-due { display: grid; font-size: var(--fs-s); }
.plan-why { color: var(--muted); font-size: var(--fs-xs); }

/* 履歴 */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; padding: 12px 18px; cursor: pointer; color: var(--muted); min-height: 48px; }
.tab.is-current { color: var(--accent); font-weight: 700; box-shadow: inset 0 -3px 0 var(--accent); }
.skill-panel { display: grid; gap: 12px; }
.skill-panel-head { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.skill-panel-head h2 { font-size: var(--fs-l); }
.skill-panel-due { display: grid; text-align: right; }
.evidence li::before, .plain-list li::before { content: "・"; }
.sched-history li { font-size: var(--fs-s); padding: 4px 0; }
.back { align-self: flex-start; }
.table-wrap { overflow-x: auto; }
.att-table { width: 100%; border-collapse: collapse; font-size: var(--fs-s); }
.att-table th, .att-table td { text-align: left; padding: 10px 8px; border-top: 1px solid var(--line); vertical-align: top; }
.att-table th { font-size: var(--fs-xs); color: var(--muted); border-top: 0; }
.att-table td .muted { display: block; font-size: var(--fs-xs); }

/* 設定 */
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.seg-item { min-height: 48px; min-width: 64px; padding: 8px 16px; border-radius: var(--r-s); border: 2px solid var(--line); background: var(--surface); cursor: pointer; }
.seg-item.is-current { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; color: var(--accent); }
.plain-list { display: grid; gap: 4px; font-size: var(--fs-s); }
.panel.dev { border-style: dashed; }
.panel.danger h2 { color: var(--ng); }

/* ---------- 画面幅による調整 ---------- */
@media (max-width: 760px) {
  .plan-list li { grid-template-columns: 1fr; gap: 4px; }
  .att-row { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .skill-panel-due { text-align: left; }
}
@media (max-width: 520px) {
  .choices { grid-template-columns: 1fr; }
  .ex-map li { grid-template-columns: 1fr; gap: 2px; }
  .ex-arrow { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* ---------- 確認状況（実績＋いまの状態）・確認問題の案内 ---------- */
.status-inline { display: flex; align-items: center; gap: 10px; font-size: var(--fs-s); min-width: 0; }
.status-text { overflow-wrap: anywhere; }
.tone-text-recheck { color: var(--ng); font-weight: 700; }
.tone-text-note { color: var(--hold); font-weight: 700; }
.tone-text-ok { color: var(--ok); }
.tone-text-none { color: var(--muted); }
.status-grid { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 0; background: var(--surface-2); border-radius: var(--r-s); padding: 14px 16px; align-items: center; }
.status-grid dt { font-size: var(--fs-xs); color: var(--muted); font-weight: 700; }
.status-grid dd { margin: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.issue-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: var(--fs-s); }
.issue-list li { border-left: 4px solid var(--ng); padding: 6px 12px; display: grid; }
.next-note { background: var(--accent-soft); border-radius: var(--r-s); padding: 12px 16px; }
.basics { border: 2px solid var(--accent); border-radius: var(--r-s); padding: 14px 16px; display: grid; gap: 8px; }
.session-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.verdict .label { margin-right: 0; }
details.panel > summary { font-size: var(--fs-s); }
details.panel > p { margin-top: 8px; }
@media (max-width: 760px) {
  .status-inline { grid-column: 1 / -1; grid-row: 2; }
  .status-grid { grid-template-columns: 1fr; }
}

/* ---------- 問題画面の操作への反応（表示だけ。採点・保存には関係しない） ---------- */
/* 押した瞬間の手ごたえ（タップ・クリック共通） */
.choice, .btn-primary, .btn-quiet, .btn-toggle, .chip { transition: transform 0.08s ease-out, background-color 0.15s ease-out, border-color 0.15s ease-out; }
.choice:active:not(.choice-result), .btn-primary:active:not(:disabled), .btn-quiet:active:not(:disabled), .btn-toggle:active, .chip:active { transform: scale(0.98); }
/* 選択中：枠と背景の色＋丸の中が埋まる（採点結果とは別の見た目） */
.choice-dot { transition: border-color 0.15s ease-out; position: relative; }
.choice-dot::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--accent); transform: scale(0); transition: transform 0.15s ease-out; }
.choice.is-selected .choice-dot { background: none; }
.choice.is-selected .choice-dot::after { transform: scale(1); }
.blank.filled { transition: background-color 0.15s ease-out; }

/* 採点後：記号・文字・色で示す。押せない */
.choices-result { list-style: none; margin: 0; padding: 0; }
.choice-result { cursor: default; flex-wrap: wrap; animation: result-in 0.2s ease-out both; }
.choice-result .result-icon { width: 24px; height: 24px; flex: none; display: inline-grid; place-items: center; font-weight: 700; border-radius: 50%; font-family: var(--font-ja); }
.choice-result .choice-text { flex: 1 1 auto; min-width: 0; }
.choice-result .result-tag { font-size: var(--fs-xs); font-weight: 700; font-family: var(--font-ja); white-space: nowrap; }
.choice-result.is-correct { border-color: var(--ok); background: var(--ok-soft); }
.choice-result.is-correct .result-icon { background: var(--ok); color: var(--surface); }
.choice-result.is-correct .result-tag { color: var(--ok); }
.choice-result.is-wrong { border-color: var(--ng); background: var(--ng-soft); border-style: dashed; }
.choice-result.is-wrong .result-icon { background: var(--ng); color: var(--surface); }
.choice-result.is-wrong .result-tag { color: var(--ng); }
.choice-result.is-other { opacity: 0.6; }
.choice-result.is-other .result-icon { border: 2px solid var(--line); }
.verdict, .reason-result, .next-note { animation: result-in 0.2s ease-out both; }
@keyframes result-in { from { opacity: 0.35; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* 解説の開閉：高さの上限なし（長い解説も欠けない）。動きの途中も読める・押せる */
.explain-block { border-top: 1px solid var(--line); padding-top: 8px; }
.explain-toggle {
  width: 100%; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 8px 4px;
  background: none; border: 0; cursor: pointer; text-align: left; touch-action: manipulation;
}
.explain-toggle-label { font-weight: 700; font-size: var(--fs-m); }
.explain-toggle-state { margin-left: auto; color: var(--accent); font-size: var(--fs-s); }
.explain-chevron { width: 10px; height: 10px; border-right: 2px solid var(--accent); border-bottom: 2px solid var(--accent); transform: rotate(45deg); transition: transform 0.24s ease-out; margin: 0 6px 4px 0; }
.explain-toggle[aria-expanded="false"] .explain-chevron { transform: rotate(-45deg); margin-bottom: 0; }
.collapse { display: grid; grid-template-rows: 0fr; visibility: hidden; transition: grid-template-rows 0.24s ease-out, visibility 0s linear 0.24s; }
.collapse.is-open { grid-template-rows: 1fr; visibility: visible; transition: grid-template-rows 0.24s ease-out, visibility 0s linear 0s; }
.collapse-inner { min-height: 0; overflow: hidden; }
.explain.explain-bare { border-top: 0; padding-top: 4px; }

/* ---------- 英文構造の段階解説（回答後に開く） ----------
 * 色だけに頼らない：主語＝下線＋ラベル、動詞＝二重下線＋ラベル、説明のまとまり＝（ ）＋破線の枠＋ラベル、
 * 骨格からはずす部分＝（ ）＋薄い文字＋ラベル、補語＝点線の下線＋ラベル
 */
.sx { display: grid; gap: 12px; border-top: 1px solid var(--line); padding-top: 16px; }
.sx-open { justify-self: start; }
.sx-panel { display: grid; gap: 14px; background: var(--surface-2); border-radius: var(--r-s); padding: 16px clamp(12px, 3vw, 20px); min-width: 0; }
.sx-progress { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; font-weight: 700; }
.sx-count { font-size: var(--fs-xs); color: var(--muted); font-weight: 700; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
.sx-steps { list-style: none; margin: 0; padding: 0; display: flex; gap: 6px; }
.sx-steps li { width: 28px; height: 6px; border-radius: 3px; background: var(--line); }
.sx-steps li.is-done { background: var(--accent-soft); outline: 1px solid var(--accent); }
.sx-steps li.is-current { background: var(--accent); }
/* 英文：まとまりごとに「語句の上・ラベルの下」で並べ、狭い画面ではまとまり単位で折り返す（重ならない） */
.sx-sentence { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 14px 10px; font-family: var(--font-en); font-size: clamp(1.25rem, 3.6vw, 1.625rem); line-height: 1.5; margin: 0; }
.sx-sentence-sm { font-size: clamp(1.125rem, 3vw, 1.375rem); }
.sx-plain { padding-top: 2px; }
.sx-seg { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 4px; max-width: 100%; min-width: 0; }
.sx-words { padding: 2px 4px 3px; border-radius: 4px; overflow-wrap: anywhere; }
.sx-label { font-family: var(--font-ja); font-size: var(--fs-xs); font-weight: 700; line-height: 1.35; padding-left: 4px; overflow-wrap: anywhere; }
.sx-bracket { font-family: var(--font-ja); font-weight: 700; color: var(--muted); }
.sx-subject .sx-words { border-bottom: 3px solid var(--accent); background: var(--accent-soft); }
.sx-subject .sx-label { color: var(--accent); }
.sx-verb .sx-words { border-bottom: 6px double var(--ok); }
.sx-verb .sx-label { color: var(--ok); }
.sx-modifier .sx-words { border: 2px dashed var(--hold); background: var(--hold-soft); }
.sx-modifier .sx-label { color: var(--hold); }
.sx-omit .sx-words { border: 2px dashed var(--line); color: var(--muted); }
.sx-omit .sx-label { color: var(--muted); }
.sx-complement .sx-words { border-bottom: 3px dotted var(--ink); }
.sx-skel .sx-words { border-bottom: 3px solid var(--accent); background: var(--surface); }
.sx-skeleton { display: grid; gap: 6px; border-left: 4px solid var(--accent); padding-left: 12px; }
.sx-text { max-width: 40em; }
.sx-controls { display: flex; flex-wrap: wrap; gap: 8px; }
.sx-controls .btn-quiet { min-width: 88px; }
.sx-trans-text { font-size: var(--fs-l); margin-top: 4px; }
/* 新しく強調した部分だけ、控えめに現れる（動きを減らす設定では止まり、内容は同じ） */
.sx-seg.is-new .sx-words, .sx-seg.is-new .sx-label { animation: sx-in 0.28s ease-out both; }
@keyframes sx-in { from { opacity: 0.3; transform: translateY(3px); } to { opacity: 1; transform: none; } }

/* ---------- 保存してホームへ・意味の問い（英文に即した3択） ---------- */
.toast-temp { transition: opacity 0.3s ease-out; }
.toast-temp.is-leaving { opacity: 0; }
.toast-error { background: var(--ng-soft); color: var(--ng); border-left: 4px solid var(--ng); font-weight: 700; }
.hero-due { display: flex; align-items: flex-start; gap: 8px; margin: 0; padding: 12px 14px; border-radius: var(--r-s); background: var(--hold-soft); color: var(--ink); font-size: var(--fs-s); }
.hero-due .icon { color: var(--hold); margin-top: 0.2em; }
.hero-due .num { font-family: var(--font-en); font-size: 1.125rem; margin: 0 2px; }
/* 聞いている部分：太字＋下線＋薄い蛍光（色だけに頼らない） */
.reason-target { font-weight: 700; text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 0.18em; text-decoration-color: var(--accent); background: linear-gradient(transparent 55%, var(--marker) 55%); color: inherit; padding: 0 2px; }
.reason-sentence { margin: 0; }
.reason .choice { font-size: var(--fs-m); line-height: 1.5; }
.reason-answer { font-weight: 700; }
.reason-link { display: grid; gap: 6px; border-left: 4px solid var(--accent); padding-left: 12px; margin-top: 4px; }
.reason-link-map { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font-size: 1.125rem; font-family: var(--font-en); }
.reason-link-head { border-bottom: 2px solid var(--muted); }
.reason-link-arrow { color: var(--muted); font-family: var(--font-ja); }

/* ---------- ホーム：次にやること（短く）・初回診断とは？・次の復習 ---------- */
.hero-title-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.hero-title-row .hero-title { margin-right: auto; }
/* 補助ボタン：開始ボタンより控えめ（枠なし・小さめの文字）。押せる範囲は 44px 以上 */
.btn-help { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 6px 12px 6px 8px; border: 0; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent); font-size: var(--fs-s); font-weight: 700; cursor: pointer; touch-action: manipulation; }
.help-mark { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid currentColor; font-family: var(--font-en); font-size: 0.8125rem; line-height: 1; }
.btn-help[aria-expanded="true"] { box-shadow: inset 0 0 0 1.5px var(--accent); }
.hero-help-text { background: var(--surface-2); border-left: 4px solid var(--accent); border-radius: 0 var(--r-s) var(--r-s) 0; padding: 12px 14px; font-size: var(--fs-s); }
.hero .collapse.is-open { margin-top: -2px; }
.hero-size { display: inline-flex; align-items: center; gap: 8px; font-size: var(--fs-l); font-weight: 700; color: var(--ink); }
.hero-size .icon { color: var(--accent); width: 22px; height: 22px; }
.hero-size span { font-feature-settings: "palt"; }
.first-note { display: flex; align-items: center; gap: 8px; margin: -6px 0 0; padding: 10px 14px; border-radius: var(--r-s); background: var(--accent-soft); color: var(--ink); font-size: var(--fs-s); }
.first-note .icon { color: var(--accent); }
.dash-fact { flex-wrap: wrap; }
.dash-fact > span:first-of-type { display: inline-flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; }
.fact-date { color: var(--ink); font-size: var(--fs-m); }
.fact-sub { color: var(--muted); }
.fact-note { flex-basis: 100%; color: var(--muted); font-size: var(--fs-xs); padding-left: 26px; }
.dash-fact.is-due .fact-date { color: var(--accent); }

/* ---------- ホーム：視線の順番（課題名 → 必要な情報 → 開始ボタン → 単元の現在地 → 項目 → 今週） ----------
 * 面積：次にやること 約6割 ｜ 単元 約4割（十分な幅のとき）。狭い幅は課題名と開始ボタンが先の縦並び。
 * 色の濃さ：最も濃い青（--cta）は、その状態で優先する操作のボタンだけ。補助の操作は枠・文字色で控えめに。
 */
@media (min-width: 900px) {
  .dash { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
}
.hero { gap: 14px; }
.hero .dash-head { font-size: var(--fs-s); color: var(--muted); }
.hero .dash-icon { width: 30px; height: 30px; }
.hero-title { font-size: clamp(1.75rem, 1.15rem + 2.2vw, 2.625rem); font-weight: 700; line-height: 1.25; letter-spacing: 0.01em; }
.hero-size { font-size: var(--fs-l); }
.hero .btn-primary { background: var(--cta); color: var(--cta-ink); }
@media (hover: hover) { .hero .btn-primary:hover:not(:disabled) { filter: brightness(1.12); } }
.btn-help { background: transparent; border: 1px solid var(--line); color: var(--accent); font-weight: 400; padding: 6px 14px 6px 10px; }
@media (hover: hover) { .btn-help:hover { border-color: var(--accent); } }
.btn-help[aria-expanded="true"] { box-shadow: none; border-color: var(--accent); background: var(--accent-soft); }
.help-mark { width: 20px; height: 20px; font-size: 0.75rem; }
.hero-due { background: var(--surface-2); }
.hero-due .icon { color: var(--accent); }
.home .btn-link { font-weight: 400; text-decoration: underline; text-underline-offset: 3px; }
.home .section-head h2 { font-size: var(--fs-m); letter-spacing: 0.04em; }
/* 単元：タイルは淡く、現在地は3段階の表示1つで示す */
.unit-col { grid-template-columns: 64px minmax(0, 1fr); }
.unit-tile { width: 64px; height: 64px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); box-shadow: none; }
.unit-tile [lang="en"] { font-size: 1.5rem; }
.unit-tile-plus { font-size: 0.6875rem; }
.unit-name { font-size: 1.1875rem; }
.path { font-size: var(--fs-s); margin-top: 8px; }
.path-step { gap: 6px; }
.path-step + .path-step::before { top: 15px; right: calc(50% + 22px); width: calc(100% - 44px); height: 2px; }
.path-step.is-done + .path-step::before, .path-step.is-skipped + .path-step::before { background: var(--accent-2); }
.path-mark { width: 30px; height: 30px; border-width: 2px; font-size: 0.875rem; }
.path-mark .icon { width: 16px; height: 16px; }
.path-label { color: var(--ink); line-height: 1.35; }
.path-state { font-size: var(--fs-xs); color: var(--muted); line-height: 1.2; }
.path-step.is-done .path-mark { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.path-step.is-skipped .path-mark { background: var(--surface-2); border: 2px dashed var(--muted); color: var(--muted); }
.path-step.is-now .path-label { color: var(--accent); font-weight: 700; }
.path-step.is-now .path-state { color: var(--accent); font-weight: 700; }
.path-step.is-now .path-mark { box-shadow: 0 0 0 4px var(--accent-soft); }
.path-step.is-todo .path-mark { color: var(--muted); }
/* 項目ごとの確認状況：1項目1行（狭い幅では自然に折り返す） */
.skill-lines { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.skill-lines li + li { border-top: 1px solid var(--line); }
.skill-line { width: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; min-height: 56px; padding: 12px 16px; background: none; border: 0; text-align: left; cursor: pointer; touch-action: manipulation; font-size: var(--fs-s); }
@media (hover: hover) { .skill-line:hover { background: var(--surface-2); } }
.skill-lines li:first-child .skill-line { border-radius: var(--r) var(--r) 0 0; }
.skill-lines li:last-child .skill-line { border-radius: 0 0 var(--r) var(--r); }
.skill-line-term { flex: 1 1 11em; font-weight: 700; font-size: var(--fs-m); min-width: 0; }
.skill-line-status { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; white-space: nowrap; }
.skill-line-status.st-recheck { color: var(--ng); }
.skill-line-status.st-unsure { color: var(--hold); }
.skill-line-status.st-ok { color: var(--ok); }
.skill-line-status.st-none, .skill-line-status.st-wip { color: var(--muted); }
.skill-line-ach { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; }
.skill-line-ach .meter-seg { width: 10px; height: 10px; border-width: 1.5px; }
.skill-line-due { color: var(--muted); white-space: nowrap; min-width: 7em; }
.skill-line-due.is-today { color: var(--ink); font-weight: 700; }
.skill-line > .icon { color: var(--muted); margin-left: auto; }
.skills-note { margin-top: 8px; }
/* 今週：ホームでは1行。押すと「学習時間」 */
/* 「解説をみる」の確認画面（表示だけ。チェックを入れて解説を開いたときだけ設定を保存） */
.confirm-dialog { width: min(440px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); overflow: auto; padding: 24px clamp(18px, 4vw, 28px); border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--ink); box-shadow: var(--shadow); font-family: var(--font-ja); }
.confirm-dialog::backdrop { background: rgba(10, 20, 35, 0.45); }
.confirm-dialog h2 { font-size: var(--fs-l); margin-bottom: 10px; }
.confirm-dialog p { color: var(--ink); line-height: 1.7; }
.check-row { display: flex; align-items: center; gap: 10px; min-height: 48px; margin-top: 14px; cursor: pointer; font-size: var(--fs-s); }
.check-row input { width: 22px; height: 22px; margin: 0; flex: none; accent-color: var(--accent); cursor: pointer; }
.confirm-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; margin-top: 18px; }
@media (max-width: 420px) { .confirm-actions > * { flex: 1 1 100%; } }
/* 講師向け：学習時間・暗証番号 */
.tt-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.tt-top .btn-quiet .icon { color: var(--accent); }
.pin-form { display: grid; gap: 10px; max-width: 460px; }
.pin-form.pin-change { margin-top: 12px; }
.pin-form .field-label { margin: 6px 0 0; }
.pin-input { font-family: var(--font-en); letter-spacing: 0.3em; max-width: 16rem; }
.pin-msg { margin: 0; }
.view-teacher-time .page-title .icon { color: var(--accent); }
.view-teacher-time { max-width: 900px; }
.tt-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 12px; }
.tt-card { display: grid; gap: 6px; align-content: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px 18px; min-width: 0; }
.tt-value { font-family: var(--font-en); font-size: 1.75rem; font-weight: 700; line-height: 1.2; }
.tt-sub { font-size: var(--fs-s); }
.tt-goal { margin-top: 12px; }
.view-teacher-time .att-table td .muted { display: block; }
.view-teacher-time .att-table tr.is-today td { font-weight: 700; }
.view-teacher-time .att-table td, .view-teacher-time .att-table th { white-space: nowrap; }
/* 文・日本語の選択肢は1列（1つの選択肢に1行） */
.choices.choices-1col { grid-template-columns: minmax(0, 1fr); }
/* 不定詞 Lv1：太字の強調・基準文・固定の語 */
.q-em { font-weight: 700; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 0.18em; text-decoration-color: var(--accent); }
.q-base { display: grid; gap: 4px; border-left: 4px solid var(--accent); padding-left: 14px; }
.q-base .label { margin: 0; }
.choice .choice-text { min-width: 0; overflow-wrap: anywhere; }
.chip-fixed { cursor: default; display: inline-flex; align-items: center; background: var(--surface-2); border-style: solid; border-color: var(--line); color: var(--muted); font-weight: 700; }
.lv1-busy { margin-top: 12px; }
/* 単元：もう一度練習する（範囲を選んで始める） */
.unit-btns { display: flex; flex-wrap: wrap; gap: 10px; }
.unit-btns .btn-quiet .icon { color: var(--accent); }
.self-practice { display: grid; gap: 10px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
.self-practice .field-label, .self-practice .field-note { margin: 0; }
.self-practice .actions-inline { margin-top: 2px; }
@media (max-width: 520px) { .unit-btns > *, .self-practice .actions-inline .btn-primary { flex: 1 1 100%; } }
/* 不定詞 Lv2：並べ替え（余分な語・不足語）・○×判断 */
.q-rule { display: inline-flex; align-items: center; gap: 8px; margin: 0; padding: 8px 14px; border-radius: var(--r-s); background: var(--hold-soft); color: var(--ink); font-size: var(--fs-s); font-weight: 700; }
.q-rule::before { content: "！"; color: var(--hold); }
.chip-added { border-style: dashed; border-width: 2px; border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.order-answer .chip-added { border-style: dashed; }
.add-word { display: grid; gap: 8px; margin-bottom: 14px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--surface-2); }
.add-word .field-label, .add-word .field-note { margin: 0; }
.add-word-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.add-word-row .text-input { flex: 1 1 10rem; max-width: 16rem; min-height: 48px; font-family: var(--font-en); }
.add-word-msg { margin: 0; }
.order-info { display: grid; gap: 4px; margin: 0; font-size: var(--fs-s); }
.tf-sentence { display: grid; gap: 6px; border-left: 4px solid var(--accent); padding-left: 14px; }
.tf-sentence .q-ja { font-size: var(--fs-m, 1rem); font-weight: 400; }
.choices-tf .choice { justify-content: center; font-size: 1.5rem; font-weight: 700; }
.choices-tf .choice .choice-text { flex: none; }
.tf-correction { display: grid; gap: 6px; padding: 12px 16px; border-radius: var(--r-s); background: var(--surface-2); border-left: 4px solid var(--hold); }
.tf-correction p { margin: 0; }
.tf-correction .label { margin: 0; }
.lv2-practice .seg-item { min-width: 0; }
/* 学習時間画面の今週 */
@media (max-width: 600px) {
  .view-home { gap: 16px; }
  .unit-col { grid-template-columns: 56px minmax(0, 1fr); }
  .unit-tile { width: 56px; height: 56px; }
  .unit-tile [lang="en"] { font-size: 1.3rem; }
  .path { font-size: var(--fs-xs); }
}
/* ---------- 今日の学習（ホーム上部）・今日の記録・講師の日別確認 ---------- */
.today-card { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 22px; box-shadow: var(--shadow); padding: clamp(16px, 2.6vw, 24px) clamp(18px, 3vw, 32px); min-width: 0; }
.today-main { display: grid; gap: 4px; min-width: 0; }
.today-card .dash-label .icon { color: var(--accent); }
.today-big { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 6px; font-weight: 700; font-size: var(--fs-l); line-height: 1.25; margin: 0; }
.today-big .num { font-family: var(--font-en); font-size: 2.5rem; letter-spacing: -0.02em; color: var(--accent); }
.today-sep { color: var(--muted); padding: 0 6px; }
.today-time { font-family: var(--font-en); }
.today-recovered { display: inline-flex; align-items: center; gap: 6px; color: var(--ok); font-weight: 700; font-size: var(--fs-m); margin: 0; }
.today-recovered .num { font-family: var(--font-en); font-size: 1.375rem; }
.today-empty { font-size: var(--fs-m); color: var(--muted); margin: 0; }
.today-open { min-height: 52px; padding-inline: 20px; font-weight: 700; }
.today-open .icon { color: var(--accent); }
@media (max-width: 600px) { .today-open { width: 100%; justify-content: space-between; } .today-big .num { font-size: 2.125rem; } }
.rec-summary { display: grid; gap: 12px; }
.rec-counts { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px 22px; font-size: var(--fs-m); }
.rec-counts li { display: inline-flex; align-items: baseline; gap: 8px; }
.rec-counts .num { font-family: var(--font-en); font-size: 1.5rem; font-weight: 700; }
.rec-row .att-tags .icon { color: var(--muted); margin-left: 4px; }
.rec-arrow { color: var(--muted); font-size: var(--fs-s); }
.rec-tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0; }
.rec-title { overflow-wrap: anywhere; }
.rec-attempt { gap: 14px; }
.rec-grid { grid-template-columns: max-content minmax(0, 1fr); }
.rec-grid dd { overflow-wrap: anywhere; font-size: var(--fs-m); }
.rec-version { background: var(--hold-soft); color: var(--ink); border-left: 4px solid var(--hold); border-radius: 0 var(--r-s) var(--r-s) 0; padding: 10px 14px; font-size: var(--fs-s); margin: 0; }
.rec-explain > summary { font-weight: 700; }
.send-panel { display: grid; gap: 8px; }
.send-panel .field-label { margin: 6px 0 0; }
.send-name { font-family: var(--font-ja); font-size: var(--fs-m); max-width: 22rem; }
.view-teacher-time .tabs { margin: 4px 0 8px; }
.tr-days { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.tr-date input { font-family: var(--font-en); font-size: var(--fs-m); min-height: 48px; padding: 8px 12px; width: auto; }
.tr-daylabel { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; font-size: var(--fs-l); font-weight: 700; margin: 0; }
.tr-daylabel .muted { font-size: var(--fs-xs); font-weight: 400; }
.tr-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.tr-card { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px 16px; min-height: 72px; padding: 16px 20px; text-align: left; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); touch-action: manipulation; }
@media (hover: hover) { .tr-card:hover { border-color: var(--accent); } }
.tr-card > .icon { grid-column: 2; grid-row: 1; color: var(--muted); }
.tr-name { grid-column: 1; display: grid; font-size: var(--fs-l); font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.tr-name .muted { font-size: var(--fs-xs); font-weight: 400; }
.tr-stats, .tr-none, .tr-sub { grid-column: 1 / -1; }
.tr-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tr-stat { display: grid; gap: 2px; background: var(--surface-2); border-radius: var(--r-s); padding: 8px 12px; }
.tr-num { font-family: var(--font-en); font-size: 1.75rem; font-weight: 700; line-height: 1.1; }
.tr-lbl { font-size: var(--fs-xs); color: var(--muted); font-weight: 700; }
.tr-ng .tr-num { color: var(--ng); }
.tr-hold .tr-num { color: var(--hold); }
.tr-none { font-weight: 700; color: var(--muted); font-size: var(--fs-m); background: var(--surface-2); border: 1.5px dashed var(--line); border-radius: var(--r-s); padding: 10px 14px; }
.tr-sub { font-size: var(--fs-s); color: var(--muted); }
.tr-items { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.tr-item > summary { min-height: 56px; color: var(--ink); font-size: var(--fs-m); }
.tr-item-head { display: grid; gap: 4px; min-width: 0; }
.tr-item-head .muted { font-size: var(--fs-xs); }
.tr-item-q { font-weight: 700; overflow-wrap: anywhere; }
.tr-item[open] { display: grid; gap: 12px; }
.tr-item .rec-attempt { box-shadow: none; padding: 16px; }
@media (max-width: 520px) { .tr-stats { grid-template-columns: 1fr; } .tr-num { font-size: 1.5rem; } }
/* ---------- 短文読解・日付別の学習記録 ---------- */

<script>
/* ---- js/core.js ---- */
/*
 * core.js — 共通の小さな道具（名前空間・日付・時計・HTMLエスケープ）
 * すべてのファイルは window.EA（English App）にまとめて登録します。
 * ビルド不要の普通の <script> として読み込めるように、import/export は使っていません。
 */
(function (root) {
  'use strict';
  var EA = root.EA = root.EA || {};
  EA.banks = EA.banks || {};

  var DAY_MS = 24 * 60 * 60 * 1000;

  EA.util = {
    DAY_MS: DAY_MS,

    uid: function (prefix) {
      return (prefix || 'id') + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
    },

    /** 文中の **…** を外した文字（一覧・履歴の表示用） */
    plain: function (s) { return String(s == null ? '' : s).replace(/\*\*/g, ''); },
    /** HTMLエスケープしたうえで、**…** を太字にする（問題・選択肢・採点後の表示用） */
    rich: function (s) { return EA.util.esc(s).replace(/\*\*([\s\S]+?)\*\*/g, '<strong class="q-em">$1</strong>'); },

    esc: function (s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    },

    /** その日の 0:00（端末の時刻帯）を返す */
    startOfDay: function (ms) {
      var d = new Date(ms);
      d.setHours(0, 0, 0, 0);
      return d.getTime();
    },

    /** 日付だけを比べた差（b − a の日数） */
    dayDiff: function (a, b) {
      return Math.round((EA.util.startOfDay(b) - EA.util.startOfDay(a)) / DAY_MS);
    },

    addDays: function (ms, days) {
      var d = new Date(EA.util.startOfDay(ms));
      d.setDate(d.getDate() + days);
      return d.getTime();
    },

    fmtDate: function (ms) {
      var d = new Date(ms);
      var w = '日月火水木金土'.charAt(d.getDay());
      return (d.getMonth() + 1) + '月' + d.getDate() + '日（' + w + '）';
    },

    fmtDateTime: function (ms) {
      var d = new Date(ms);
      var mm = String(d.getMinutes()).padStart(2, '0');
      return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + d.getHours() + ':' + mm;
    },

    fmtDuration: function (ms) {
      var s = Math.round((ms || 0) / 1000);
      if (s < 60) return s + '秒';
      var m = Math.floor(s / 60);
      return m + '分' + (s % 60 ? (s % 60) + '秒' : '');
    },

    /** 「今日」「明日」「3日後」「2日前」など */
    relDay: function (target, now) {
      var diff = EA.util.dayDiff(now, target);
      if (diff === 0) return '今日';
      if (diff === 1) return '明日';
      if (diff > 1) return diff + '日後';
      return (-diff) + '日前';
    }
  };

  /*
   * 時計。開発・確認用に「日付を進める」設定（devDayOffset）があり、
   * アプリ内のすべての日時はこの EA.clock.now() から取得します。
   */
  EA.clock = {
    offsetDays: 0,
    now: function () {
      return Date.now() + (EA.clock.offsetDays || 0) * DAY_MS;
    }
  };

  /** 問題集（data/*.js）がここに自分を登録します */
  EA.registerBank = function (bank) {
    EA.banks[bank.unit.id] = bank;
  };

  /** 問題IDから問題を探す */
  EA.findQuestion = function (bank, id) {
    if (bank.aliases && bank.aliases[id]) id = bank.aliases[id]; // 以前の試用版の問題ID → この版の問題ID
    for (var i = 0; i < bank.questions.length; i++) {
      if (bank.questions[i].id === id) return bank.questions[i];
    }
    return null;
  };

  EA.findSkill = function (bank, id) {
    for (var i = 0; i < bank.skills.length; i++) {
      if (bank.skills[i].id === id) return bank.skills[i];
    }
    return null;
  };

    return s.current;

  function sameIds(order, choices) {
    if (!order || !choices || order.length !== choices.length) return false;
    var ids = choices.map(function (c) { return c.id; });
    return order.every(function (id) { return ids.indexOf(id) >= 0; });
  }
  /**
   * 問題データの更新前に保存された途中状態を、今の版の選択肢に合わせる。
   * （例：意味の問いの選択肢IDが inf-noun などから a/b/c に変わった。古いIDの並びと新しい選択肢を混ぜない）
   */
  function repairOrders(cur, qq) {
    if (qq.choices && !sameIds(cur.choiceOrder, qq.choices)) {
      cur.choiceOrder = shuffle(qq.choices.map(function (c) { return c.id; }));
      if (cur.phase === 'answer' && (qq.format === 'fill' || qq.format === 'meaning') && cur.draft &&
          !qq.choices.some(function (c) { return c.id === cur.draft; })) cur.draft = null;
    }
    if (qq.reason && !sameIds(cur.reasonOrder, qq.reason.choices)) {
      cur.reasonOrder = shuffle(qq.reason.choices.map(function (c) { return c.id; }));
      if (cur.reasonDraft) cur.reasonDraft = null;
    }
    if (cur.reasonDraft && !(qq.reason && qq.reason.choices.some(function (c) { return c.id === cur.reasonDraft; }))) cur.reasonDraft = null;
  }

  /** 「保存してホームへ」：計時を止める（離れている間は学習時間に数えない）。学習回は終えない */
  function suspend(state, real) {
    var s = state.activeSession;
    if (!s) return;
    if (s.current) { pause(s.current, real); s.current.lastSeenAt = null; }
    s.suspendedAt = real;
  }

  /**
   * ページを開き直したとき：前回、計時中のまま閉じていたら（pagehide が届かなかったなど）、
   * 最後に保存した時刻までを学習時間に数え、そこで止める（閉じていた時間は数えない）
   */
  function recover(state) {
    var s = state.activeSession;
    if (!s) return;
    if (!s.unresolved) s.unresolved = [];
    if (!s.explained) s.explained = {};
    var cur = s.current;
    // 更新前に、意味の問いの回答前で離れていた学習：その回答は意味の問いに答えるまで判定に使わない
    if (cur && cur.phase === 'reason' && cur.attemptId) {
      var pa = attemptById(state, cur.attemptId);
      if (pa && !pa.reason) pa.reasonPending = true;
    }
    if (cur && cur.visibleSince) {
      var end = cur.lastSeenAt && cur.lastSeenAt > cur.visibleSince ? cur.lastSeenAt : cur.visibleSince;
      cur.activeMs += end - cur.visibleSince;
      cur.visibleSince = null; cur.hiddenSince = end; cur.lastSeenAt = null;
    }
  }

  /** 保存の直前に呼ぶ：計時中なら、いつまで画面を見ていたかを残す（recover で使う） */
  function touch(state, real) {
    var s = state.activeSession;
    if (s && s.current && s.current.visibleSince) s.current.lastSeenAt = real;
  }

  function reasonApplicable(qq, it, a) {
    return !!qq.reason && qq.format !== 'meaning' &&
      (it.attemptType === 'similar' || it.attemptType === 'review' || it.attemptType === 'followup') &&
      G.isSkillCorrect(a.result) && !a.hintUsed && !a.gaveUp;
  }

  /** 理由を聞くかどうかと、その理由。a はまだ state.attempts に入れる前の回答 */
  function reasonDecision(state, bank, s, qq, it, a) {
    if (!reasonApplicable(qq, it, a)) return { ask: false, why: 'not-applicable' };
    var cap = (EA.config && EA.config.maxReasonQuestionsPerSession) || 3;
    if ((s.reasonsAsked || 0) >= cap) return { ask: false, why: 'cap' };
    var st = EA.mastery.analyze(qq.skill, state.attempts, bank);
    var types = st.issues.map(function (i) { return i.type; });
    if (types.indexOf('meaning') >= 0) return { ask: true, why: 'meaning-recheck' };
    if (a.confidence === 'unsure') return { ask: true, why: 'unsure' };
    var err = st.issues.filter(function (i) { return i.type === 'error'; })[0];
    if (err && err.count >= 2) return { ask: true, why: 'repeated-errors' };
    if (a.translationShown) return { ask: false, why: 'translation-shown' };
    if (types.indexOf('unsure') >= 0 || types.indexOf('hint') >= 0) return { ask: true, why: 'recheck-pending' };
    if (st.meaning !== 'confirmed') return { ask: true, why: 'first-check' };
    if (st.achievement < 2) return { ask: true, why: 'insufficient' };
    return { ask: false, why: 'stable' };
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  /**
   * 回答を確定する。戻り値 { attempt, finished }（診断は自動で次へ進む）。
   * 二重確定の防止：回答を受け付ける段階（phase: answer）で、まだ記録していないときだけ処理し、それ以外は null を返す。
   */
  function submit(state, bank, gaveUp, t) {
    var s = state.activeSession;
    if (!s || !s.current || s.current.phase !== 'answer' || s.current.attemptId) return null;
    var cur = s.current, it = item(state), qq = q(bank, it.questionId);
    pause(cur, t.real);
    var response = gaveUp ? null : cur.draft;
    var orderInfo = null;
    if (qq.format === 'order' && response) {
      // 補った語は語句の番号 tokens.length で置いている（不足語を補う並べ替え）
      orderInfo = orderDetail(qq, response, cur);
      response = response.map(function (i) { return i === qq.tokens.length ? G.cleanWord(cur.added) : qq.tokens[i]; });
    }
    var g = gaveUp ? { result: 'gaveup', feedback: '' } : G.grade(qq, response);
    var a = {
      id: EA.util.uid('a'),
      questionId: qq.id, questionVersion: qq.version, unitId: bank.unit.id,
      skillId: qq.skill, format: qq.format, checks: qq.checks,
      attemptType: it.attemptType, sessionId: s.id, sessionType: s.type,
      response: response, responseText: gaveUp ? '' : G.responseText(qq, response),
      result: g.result, feedback: g.feedback,
      confidence: cur.unsure ? 'unsure' : 'none',          // 押さなかった場合は「申告なし」（自信ありとは扱わない）
      hintUsed: !!cur.hintUsed, gaveUp: !!gaveUp,
      // 不定詞 Lv1（初回）は、8問を1問ずつ自力の回答として数える（同じ回でほかの問題の解説を見ていても「解説後」にしない）。
      // 間違えたあとの解き直し（別の問題）は「解説後」として数える
      afterExplanation: it.attemptType === 'retry' || (s.type === 'diagnostic' ? !!it.retryOf : !!s.explained[qq.skill]),
      // 答える前にこの英文の日本語訳を見ていたか（日本語が問題文の形式・解き直し）
      translationShown: qq.format === 'ja2en' || qq.format === 'order' || qq.format === 'judge' || !!qq.jaShown || (qq.format === 'fill' && qq.showJa !== 'after') || it.attemptType === 'retry',
      choiceOrder: cur.choiceOrder || null,
      // 復習でこの問題を選んだ理由（planner.reviewPicks の why）。復習以外は null
      pickWhy: it.pickWhy || null,
      reason: null,                                         // null ＝ 理由は聞いていない
      reasonDecision: null,
      followUp: null,
      startedAt: cur.startedAt, answeredAt: t.app,
      activeMs: cur.activeMs, awayMs: cur.awayMs, elapsedMs: t.app - cur.startedAt
    };
    if (state.mode === 'demo') a.demo = true;
    if (orderInfo) a.orderInfo = orderInfo;            // 余分な語として残した語句・補った語とその位置
    if (s.practiceSet) a.practiceSet = s.practiceSet; // 決まった問題の練習（例：lv1, lv2）
    if (it.retryOf) a.retryOf = it.retryOf;            // 間違えた問題の解き直し（別の問題）
    // 回答した時点の問題文と正答（問題集があとで更新されても、当時の内容を振り返れるように）
    if (EA.daily) a.snapshot = EA.daily.snapshotOf(qq);
    // 短文読解：文法問題とは区別して記録する（readingPurpose：sameDay / check / recheck / summary / basic）
    if (qq.reading) { a.reading = true; a.readingPurpose = it.readingPurpose || 'check'; a.glossUsed = !!cur.hintUsed; if (qq.passage) a.passage = qq.passage; }
    if (s.type !== 'diagnostic') a.reasonDecision = reasonDecision(state, bank, s, qq, it, a);
    state.attempts.push(a);
    s.attemptIds.push(a.id);
    cur.attemptId = a.id;
    cur.hiddenSince = null;

    // 初回診断も、答えるたびに正誤と解説を表示する（類題は診断のあとの学習回で出す）
    if (a.reasonDecision && a.reasonDecision.ask) {
      s.reasonsAsked = (s.reasonsAsked || 0) + 1;
      a.reasonPending = true; // 意味の問いに答えるまで、確認状況の根拠にしない
      cur.phase = 'reason';
      return { attempt: a, finished: null };
    }
    conclude(state, bank, a);
    return { attempt: a, finished: null };
  }

  /**
   * 並べ替えの回答の補足：使わなかった語句（余分な語がある問題）と、補った語とその位置（不足語を補う問題）。
   * 位置は「固定部分を除いた、動かせる部分の何番目（1から）」。
   */
  function orderDetail(qq, placed, cur) {
    var info = {};
    if (qq.orderKind === 'extra') {
      info.unused = qq.tokens.filter(function (_, i) { return placed.indexOf(i) < 0; });
    }
    if (qq.orderKind === 'missing') {
      info.added = G.cleanWord(cur.added);
      info.addedPos = placed.indexOf(qq.tokens.length) + 1;
    }
    return Object.keys(info).length ? info : null;
  }

  function submitReason(state, bank, choiceId) {
    var s = state.activeSession;
    if (!s || !s.current || s.current.phase !== 'reason') return null; // 二重送信の防止
    var qq = q(bank, item(state).questionId);
    var a = attemptById(state, s.current.attemptId);
    var chosen = null, right = null;
    qq.reason.choices.forEach(function (c) { if (c.id === choiceId) chosen = c; if (c.id === qq.reason.answer) right = c; });
    if (!chosen) return null; // 今の版にない選択肢ID（古い画面からの操作など）は受け付けない
    a.reason = {
      asked: true, kind: qq.reason.kind || 'reason', prompt: qq.reason.prompt, target: qq.reason.target || null,
      // 正誤は表示順ではなく選択肢IDで判定する。どの版の設問に答えたか（reasonVersion）と、当時の文言も残す
      choiceId: choiceId, correct: choiceId === qq.reason.answer, answerId: qq.reason.answer,
      choiceText: chosen.text, answerText: right ? right.text : null, reasonVersion: qq.version,
      choiceOrder: s.current.reasonOrder || null,
      // 日本語訳・解説・ヒントを見ずに答えた理由か（false は考え方の参考として記録）
      independent: !a.translationShown && !a.afterExplanation && !a.hintUsed,
      why: a.reasonDecision ? a.reasonDecision.why : null
    };
    delete a.reasonPending;
    s.current.reasonDraft = null;
    conclude(state, bank, a);
    return a;
  }

  /** 正誤と解説を表示する段階へ。必要なら確認問題を追加する */
  function conclude(state, bank, a) {
    var s = state.activeSession;
    s.current.phase = 'feedback';
    s.explained[a.skillId] = true; // 解説を表示するので、このあとの同じ項目の回答は「解説後」
    var qq = q(bank, a.questionId);
    if (qq && qq.reading) return concludeReading(state, s, a, qq);
    planFollowUp(state, bank, s, a);
  }

  /**
   * 短文読解の回答を確定したとき：定着・復習予定日に反映し（reading.js）、間違えたときの流れを決める。
   *   1回目の誤答（単語の意味を見ていない）… 正答を見せずに止める（readingHold）。「単語の意味を見て答え直す」か「答えと解説を見る」
   *   単語の意味を見ても誤答 … 基本語で書いた別の短文を、この学習回で最大1問だけ追加する
   */
  function concludeReading(state, s, a, qq) {
    var it = s.items[s.index];
    EA.reading.apply(state, a, qq, it);
    var wrong = EA.grading.isSkillWrong(a.result);
    if (!wrong) return;
    // 根拠をタップ（試験導入）：選んだ答えが違ったとき、正答は見せずに本文の根拠を1回タップしてもらう（「解説を見る」で飛ばせる）。
    // 単語の意味を見ての答え直しの代わりに出す
    var ev = qq.evidence && !a.gaveUp && it.attemptType !== 'reread' && it.readingPurpose !== 'basic';
    if (ev) s.current.evidenceHold = { tapped: null };
    if (!a.gaveUp && !a.hintUsed && it.attemptType !== 'reread' && it.readingPurpose !== 'basic') { if (!ev) s.current.readingHold = true; return; }
    if (a.gaveUp && it.attemptType !== 'reread' && it.readingPurpose !== 'basic') { EA.reading.unclear(state, a); return; }
    if ((a.hintUsed || it.attemptType === 'reread') && it.readingPurpose !== 'basic' && !s.basicAdded) {
      var used = {}; s.items.forEach(function (x) { used[x.questionId] = true; });
      var b = EA.reading.pickSingle(state, qq.skill, used);
      if (b && b.q.readingUse === 'basic' && !used[b.q.id]) {
        s.items.splice(s.index + 1, 0, { kind: 'question', questionId: b.q.id, attemptType: 'reading', readingPurpose: 'basic' });
        s.basicAdded = true;
        a.followUp = { added: b.q.id, kind: 'basic' };
      } else {
        // 基本語の短文がないときは、次の復習で基本語の短文から
        EA.reading.unclear(state, a);
      }
    }
  }

  /**
   * 根拠をタップ：本文の区切り seg を1回だけ受け付け、最初の回答（attempt）とは別に state.reading.evidence に記録する。
   * 答え合わせ中の練習なので、短文読解の定着・復習予定・確認状況には反映しない。
   */
  function evidenceRecord(state, a, qq, s, t, seg) {
    if (!state.reading.evidence) state.reading.evidence = [];
    var chosen = null;
    (qq.choices || []).forEach(function (c) { if (c.id === a.response) chosen = c; });
    var ev = qq.evidence, skipped = seg == null;
    var rec = {
      id: EA.util.uid('ev'), practice: true,
      attemptId: a.id, questionId: qq.id, questionVersion: qq.version, skillId: qq.skill, sessionId: s.id,
      readingPurpose: a.readingPurpose || null,
      firstChoice: a.response, firstChoiceText: chosen ? chosen.text : null, mixSeg: chosen && chosen.mix ? chosen.mix.seg : null,
      skipped: skipped, tapped: skipped ? null : seg, tappedText: skipped ? null : ev.segs[seg],
      answerSeg: ev.answer, correct: skipped ? null : seg === ev.answer,
      at: t.app
    };
    if (state.mode === 'demo') rec.demo = true;
    state.reading.evidence.push(rec);
    return rec;
  }
  function tapEvidence(state, bank, seg, t) {
    var s = state.activeSession;
    if (!s || !s.current || s.current.phase !== 'feedback' || !s.current.evidenceHold) return null;
    var h = s.current.evidenceHold;
    if (h.tapped != null) return null; // 1回だけ
    var a = attemptById(state, s.current.attemptId), qq = q(bank, a.questionId);
    seg = Number(seg);
    if (!qq || !qq.evidence || !(seg >= 0 && seg < qq.evidence.segs.length)) return null;
    var rec = evidenceRecord(state, a, qq, s, t, seg);
    h.tapped = seg;
    return rec;
  }
  /** 根拠をタップから答え合わせ（正誤・解説）へ。タップせずに進んだときは「飛ばした」として記録する */
  function leaveEvidence(state, bank, t) {
    var s = state.activeSession;
    if (!s || !s.current || !s.current.evidenceHold) return null;
    var h = s.current.evidenceHold;
    var a = attemptById(state, s.current.attemptId), qq = q(bank, a.questionId);
    if (h.tapped == null && qq) evidenceRecord(state, a, qq, s, t, null);
    s.current.evidenceDone = { tapped: h.tapped };
    s.current.evidenceHold = null;
    // 単語の意味を見ずに解説へ進む（これまでの「答えと解説を見る」と同じ扱い）→ 次は基本語の短文
    if (!a.hintUsed) EA.reading.unclear(state, a);
    return a;
  }

  /** 短文で誤答したあと「単語の意味を見て答え直す」：同じ問いを、単語の意味を見た状態でもう一度（ヒントありとして記録） */
  function reread(state, bank, t) {
    var s = state.activeSession;
    if (!s || !s.current || s.current.phase !== 'feedback' || !s.current.readingHold) return false;
    var it = s.items[s.index];
    s.items.splice(s.index + 1, 0, { kind: 'question', questionId: it.questionId, attemptType: 'reread', readingPurpose: it.readingPurpose, glossed: true });
    s.current.readingHold = false;
    return next(state, bank, t, { internal: true });
  }
  /** 短文で誤答したあと「答えと解説を見る」（単語の意味を見ずに進む＝原因がはっきりしない → 次は基本語の短文） */
  function reveal(state) {
    var s = state.activeSession;
    if (!s || !s.current || !s.current.readingHold) return null;
    s.current.readingHold = false;
    var a = attemptById(state, s.current.attemptId);
    EA.reading.unclear(state, a);
    return a;
  }

  /**
   * 決まった問題の練習（不定詞 Lv1 など）で間違えた（「解説をみる」を含む）とき、
   * 同じ型の解き直し用の問題（retryFor が同じ）から、この練習でまだ出していない1問をすぐ次に出す。
   * しばらく解いていない問題を優先する。解き直しでもつまずいたときは、それ以上追加しない。
   */
  function planSetRetry(state, bank, s, a) {
    var it = s.items[s.index];
    if (!G.isSkillWrong(a.result)) return;
    if (it.retryOf) {
      a.followUp = { added: null, trigger: 'error', kind: 'retry', basics: false,
        why: '解き直しの問題でもつまずいたため、ここでは追加しません。解説をもう一度読んでから次へ進みましょう。' };
      return;
    }
    var used = {};
    s.items.forEach(function (x) { used[x.questionId] = true; });
    var last = {};
    state.attempts.forEach(function (x) { if (!(last[x.questionId] >= x.answeredAt)) last[x.questionId] = x.answeredAt; });
    var cands = bank.questions.filter(function (x) { return x.status !== 'excluded' && !x.retired && x.retryFor === a.questionId && !used[x.id]; });
    if (!cands.length) {
      a.followUp = { added: null, trigger: 'error', kind: 'retry', basics: false, why: 'この問題の解き直し用の問題は、この練習ですべて出しました。解説をもう一度読んでから次へ進みましょう。' };
      return;
    }
    var fq = shuffle(cands).sort(function (x, y) { return (last[x.id] || 0) - (last[y.id] || 0); })[0];
    // Lv1（初回）の解き直しは「類題（解説後）」として記録し、確認状況・復習予定の根拠にする。自分で始めた練習では self のまま
    s.items.splice(s.index + 1, 0, { kind: 'question', questionId: fq.id, attemptType: s.type === 'diagnostic' ? 'similar' : 'self', retryOf: a.questionId });
    a.followUp = { added: fq.id, trigger: 'error', kind: 'retry' };
  }

  function planFollowUp(state, bank, s, a) {
    if (s.noRetry) return; // 解き直しを追加しない練習（不定詞 Lv2）
    if (s.practiceSet && a.attemptType === 'self') return planSetRetry(state, bank, s, a);
    if (s.type === 'diagnostic') return planSetRetry(state, bank, s, a); // 不定詞 Lv1（初回）：間違えたら同じ型の別の問題ですぐ解き直す
    if (['similar', 'review', 'followup'].indexOf(a.attemptType) < 0) return;
    var wrong = G.isSkillWrong(a.result);
    var meaningNg = !!(a.reason && a.reason.correct === false);
    if (!wrong && !meaningNg) return;
    var trigger = wrong ? 'error' : 'meaning';
    var cap = (EA.config && EA.config.maxFollowUpsPerSession) || 3;
    function unresolved(why, basics) {
      a.followUp = { added: null, trigger: trigger, why: why, basics: !!basics };
      s.unresolved.push({ skillId: a.skillId, questionId: a.questionId, trigger: trigger, why: why, attemptId: a.id });
    }
    if (a.attemptType === 'followup') return unresolved('確認問題でもつまずいたため、基本の説明を表示しました。この内容は次回の復習でもう一度確認します。', true);
    if (s.followUps >= cap) return unresolved('今回追加できる確認問題の上限（' + cap + '問）に達したため、次回の復習で確認します。');
    var fq = EA.planner.pickFollowUp(state, bank, s, a, trigger);
    if (!fq) return unresolved('別の確認問題が用意されていないため、次回の復習で確認します（確認済みにはしません）。');
    s.items.splice(s.index + 1, 0, { kind: 'question', questionId: fq.id, attemptType: 'followup', forSkill: a.skillId, trigger: trigger });
    s.followUps++;
    a.followUp = { added: fq.id, trigger: trigger };
  }

  /**
   * 次へ。最後まで進んだら学習回を終えて記録を返す（続くときは null）。
   * 解説の項目か、正誤を表示している段階でだけ進める。それ以外（二重タップなど）は false を返して何もしない。
   */
  function next(state, bank, t, opts) {
    var s = state.activeSession;
    if (!s) return false;
    var it = s.items[s.index];
    var allowed = (opts && opts.internal) || (it && it.kind === 'explain') || (s.current && s.current.index === s.index && s.current.phase === 'feedback' && !s.current.evidenceHold);
    if (!allowed) return false;
    s.index++;
    s.current = null;

    return '<header class="topbar"><div class="topbar-inner">' +
      '<div class="brand"><span class="brand-mark" aria-hidden="true">to</span><span class="brand-name">英文法ドリル</span></div>' +

  /* ================= 画面：ホーム ================= */

    repeat: '<path d="M4.5 11a7.5 7.5 0 0 1 13-4.5L19.5 8"/><path d="M19.5 4v4h-4"/><path d="M19.5 13a7.5 7.5 0 0 1-13 4.5L4.5 16"/><path d="M4.5 20v-4h4"/>',
