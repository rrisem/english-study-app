  function icon(name) {
    return '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + ICON_PATH[name] + '</svg>';
  }

  /** 単元の流れ（初回診断 → 類題 → 後日の復習）。記録された事実だけから作る */
  function unitSteps(task) {
    var u = P.unitState(state, BANK.unit.id);
    var s = state.activeSession;
    var reviewed = (state.sessions || []).some(function (x) { return x.type === 'review'; });
    var cur = { diagnostic: 0, review: 1 }[task.kind];
    if (task.kind === 'resume') { cur = s ? { diagnostic: 0, review: 1 }[s.type] : -1; if (cur === undefined) cur = -1; }
    var steps = [
      { label: '不定詞 Lv1', done: !!u.diagnosticDoneAt },
      { label: '後日の復習', done: reviewed }
    ];
    return { steps: steps, cur: cur, done: steps.filter(function (x) { return x.done; }).length };
  }
  /**
   * 単元の現在地（3段階を1つの表示で）。色だけでなく、記号と文字でも見分けられる：
   *   いまここ … 番号＋太字＋「いまここ」／ 済み … ✓＋「済み」／ 見送り … －（破線の丸）＋「見送り」／ まだ … 番号＋「まだ」
   */
  function unitPath(us) {
    return '<ol class="path" aria-label="この単元の流れ" style="grid-template-columns: repeat(' + us.steps.length + ', minmax(0, 1fr))">' + us.steps.map(function (st, i) {
      var now_ = i === us.cur;
      var kind = now_ ? 'now' : st.done ? 'done' : st.skipped ? 'skipped' : 'todo';
      var label = { now: 'いまここ', done: '済み', skipped: '見送り', todo: 'まだ' }[kind];
      var mark = kind === 'done' ? icon('check') : kind === 'skipped' ? '－' : '<span class="num">' + (i + 1) + '</span>';
      return '<li class="path-step is-' + kind + '"' + (now_ ? ' aria-current="step"' : '') + '>' +
        '<span class="path-mark" aria-hidden="true">' + mark + '</span>' +
        '<span class="path-label">' + st.label + '</span><span class="path-state">' + label + '</span></li>';
    }).join('') + '</ol>';
  }

  /** ホームの項目の一行：いまの状態（既存の判定 mastery.analyze から短いことばに） */
  function skillLineStatus(st) {
    if (!st.attemptCount) return { cls: 'none', text: '未回答', mark: '—' };
    if (st.needsRecheck) return { cls: 'recheck', text: '要確認', mark: '！' };
    if (st.unsure) return { cls: 'unsure', text: '自信なし', mark: '△' };
    if (st.achievement > 0) return { cls: 'ok', text: '順調', mark: '✓' };
    return { cls: 'wip', text: '確認中', mark: '…' };
  }

  function monthDay(ms) { var d = new Date(ms); return (d.getMonth() + 1) + '月' + d.getDate() + '日'; }
  function shortDate(ms) { var d = new Date(ms); return (d.getMonth() + 1) + '/' + d.getDate() + '（' + '日月火水木金土'.charAt(d.getDay()) + '）'; }

  /** 確認実績の3段階（mastery.js の ACHIEVEMENTS と同じ定義を、短いことばで） */
  var ACH_SHORT = ['自力で1問正解', '別の問題でも自力で正解', '後日の復習でも正解'];

  function renderHome() {
    var t = now();
    var task = P.homeTask(state, BANK, t);
    var due = P.dueReviews(state, BANK, t);
    var next = P.nextReviewDate(state, BANK);
    var statuses = BANK.skills.map(function (sk) { return M.analyze(sk.id, state.attempts, BANK); });
    var recheckN = statuses.filter(function (s) { return s.needsRecheck; }).length;
    var isTrialResume = task.kind === 'resume' && state.activeSession && state.activeSession.type === 'trial';
    var unit = isTrialResume ? (EA.banks[state.activeSession.unitId] || BANK).unit : BANK.unit;
    var us = unitSteps(task);

    var h = '<div class="home">';

    // あいさつは小さな一行だけ（課題名がホームで最も大きい見出し）
    h += '<p class="greet-line">' + (state.attempts.length ? 'おかえりなさい' : 'ようこそ') + '</p>';

    // 0. 今日の学習（取り組んだ量と解き直しの成果。誤答の内訳は「今日の記録」で見る）
    h += todayCardHtml();

    // 1. 次にやること ｜ 単元の進み具合（1枚のカード）
    // 復習の予定は、日付が決まってから出す（予定がない間は行ごと省く）。期限を迎えたら件数と、復習を始められるときは「次にやること」のボタン
    var reviewFact = '';
    if (due.length && task.kind === 'resume') {
      reviewFact = ''; // 「続きから再開」の下の案内（期限を迎えた復習が◯件）と重ねない
    } else if (due.length) {
      reviewFact = '<div class="dash-fact is-due">' + icon('calendar') + '<span>次の復習<strong class="fact-date">今日</strong><span class="fact-sub">' + due.length + '件</span></span>' +
        (task.kind === 'review' ? '' : '<span class="fact-note">いまの学習のあとに始められます</span>') + '</div>';
    } else if (next) {
      reviewFact = '<p class="dash-fact">' + icon('calendar') + '<span>次の復習<strong class="fact-date">' + esc(monthDay(next)) + '</strong></span></p>';
    }

    h += '<section class="dash" aria-label="今日の学習">';
    h += '<div class="dash-col hero hero-' + task.kind + '">' +
      '<p class="dash-head"><span class="dash-icon">' + icon(task.kind === 'done' ? 'check' : task.kind === 'review' ? 'repeat' : 'play') + '</span>' +
        (task.kind === 'done' ? '今日の課題' : '次にやること') + '</p>' +
      '<div class="hero-title-row"><h1 class="hero-title" id="hero-title">' + esc(task.title) + '</h1>' +
        (task.help ? '<button type="button" class="btn-help" data-act="toggle-help" aria-expanded="false" aria-controls="hero-help">' +
          '<span class="help-mark" aria-hidden="true">?</span>' + esc(task.help.label) + '</button>' : '') + '</div>' +
      (task.help ? '<div class="collapse" id="hero-help"><div class="collapse-inner"><p class="hero-help-text">' + esc(task.help.text) + '</p></div></div>' : '') +
      (task.detail ? (task.detailKind === 'size'
        ? '<p class="hero-size">' + icon(task.detailIcon || 'clock') + '<span>' + esc(task.detail) + '</span></p>'
        : '<p class="hero-detail">' + esc(task.detail) + '</p>') : '') +
      (task.why ? '<p class="hero-why">' + esc(task.why) + '</p>' : '') +

      (task.cta ? '<button type="button" class="btn-primary btn-lg hero-cta" data-act="task-' + task.kind + '">' + esc(task.cta) + icon('chevron') + '</button>'
        : '<button type="button" class="btn-quiet hero-cta" data-go="history">' + icon('book') + '解説と回答を見返す</button>') +
      (task.moreReading ? '<button type="button" class="btn-quiet hero-cta" data-act="reading-more">' + icon('book') + '短文読解をもう１本</button>' : '') +
      '</div>' +
      (task.kind === 'resume' && task.dueWaiting ? '<p class="hero-due" role="note">' + icon('calendar') +
        '<span>復習 <strong class="num">' + task.dueWaiting + '</strong>件が待っています（この学習のあとに始められます）</span></p>' : '') +
      '</div>';

    h += '<div class="dash-col unit-col">' +
      '<div class="unit-tile" aria-hidden="true"><span lang="en">to</span><span class="unit-tile-plus">＋動詞</span></div>' +
      '<div class="unit-info"><p class="dash-label">単元</p><p class="unit-name">' + esc(unit.title) + '</p>' +
      (isTrialResume ? '<p class="unit-sub">試作（確認状況・復習予定には反映しません）</p>' : '') +
      '</div>' +
      (isTrialResume ? '' : unitPath(us)) +

      '</div>';

    h += '</section>';

    // 2. 項目ごとの確認状況：1項目1行（用法名｜いまの状態｜これまでの実績｜次の復習）。押すと「履歴・復習」の項目へ
    var today0 = U.startOfDay(t);
    h += '<section class="skills-panel" aria-labelledby="skills-title"><div class="section-head"><h2 id="skills-title">項目ごとの確認状況</h2>' +
      '<button type="button" class="btn-link" data-go="history">履歴・復習を見る' + icon('chevron') + '</button></div>' +
      '<ul class="skill-lines">' + BANK.skills.map(function (sk, i) {
        var st = statuses[i], sch = state.schedule[sk.id], ls = skillLineStatus(st);
        var dueToday = sch && sch.dueAt <= today0;
        var dueText = !sch ? '復習は未定' : dueToday ? '復習は今日' : '復習は' + U.relDay(sch.dueAt, t);
        return '<li><button type="button" class="skill-line" data-act="skill" data-skill="' + sk.id + '" aria-label="' + esc(sk.term + '：' + ls.text + '・これまでの実績 ' + st.achievement + ' / 3・' + dueText + '（詳しく見る）') + '">' +
          '<span class="skill-line-term">' + esc(sk.term) + '</span>' +

          '<span class="skill-line-read rs-' + EA.reading.status(state, sk.id).kind + '">' + esc(EA.reading.status(state, sk.id).short) + '</span>' +

    return h + '</div>';
  }

  /* ================= 今日の学習（ホーム）・今日の記録（振り返り） ================= */
  var D = EA.daily;
  function todayKey() { return D.dayKey(now()); }

  /** ホーム上部の「今日の学習」：取り組んだ問題数・学習時間・解き直しで正解した数（集計は daily.js） */
  function todayCardHtml() {
    var sum = D.summarize(D.dayGroups(state.attempts, todayKey()));
    if (!sum.problems) {
      return '<section class="today-card is-empty" aria-labelledby="today-title"><div class="today-main">' +
        '<p class="dash-label" id="today-title">' + icon('clock') + '今日の学習</p>' +
        '<p class="today-empty">今日の学習記録はまだありません</p></div></section>';
    }
    return '<section class="today-card" aria-labelledby="today-title"><div class="today-main">' +
      '<p class="dash-label" id="today-title">' + icon('clock') + '今日の学習</p>' +
      '<p class="today-big"><span class="num">' + sum.problems + '</span>問取り組んだ<span class="today-sep" aria-hidden="true">·</span>' +
        '<span class="today-time">' + esc(D.minutesText(sum.ms)) + '</span></p>' +
      (sum.recovered ? '<p class="today-recovered">' + icon('check') + '<span>解き直しで <strong class="num">' + sum.recovered + '</strong>問 正解</span></p>' : '') +
      '</div><button type="button" class="btn-quiet today-open" data-act="today-open">今日の記録を見る' + icon('chevron') + '</button></section>';
  }

  function tagsHtml(g) {
    return g.tags.map(function (t, i) {
      return (i ? '<span class="rec-arrow" aria-hidden="true">→</span>' : '') + '<span class="badge tone-' + t.tone + '">' + esc(t.label) + '</span>';
    }).join('');
  }
  /** 問題の一覧に出す文（もとの問題。問題集にない場合は回答時の控え） */
  function groupPrompt(g) {
    var qq = D.findQ(g.key);
    if (qq) return promptTextOf(qq);
    var snap = g.first.retryOf ? null : g.first.snapshot;
    return snap ? snap.prompt : '（問題データが見つかりません：' + g.key + '）';
  }

  /** 生徒：今日の記録（その日に取り組んだ問題の一覧。閲覧用） */
  function renderToday() {
    var key = view.params.day || todayKey();
    var groups = D.dayGroups(state.attempts, key), sum = D.summarize(groups);
    var isToday = key === todayKey();
    var n = { correct: 0, wrong: 0, explained: 0, hold: 0 };
    groups.forEach(function (g) { if (!g.recovered) n[g.firstKind]++; });
    var h = '<button type="button" class="btn-text back" data-go="home">← ホームに戻る</button>' +
      '<p class="eyebrow">' + (isToday ? '今日の記録' : '学習の記録') + '</p><h1 class="page-title">' + esc(D.labelOfKey(key)) + '</h1>';
    if (!groups.length) {
      return h + '<p class="lead">' + (isToday ? '今日の学習記録はまだありません。' : 'この日の学習記録はありません。') + '</p>' +
        '<div class="actions actions-split"><button type="button" class="btn-primary btn-lg" data-go="home">ホームへ</button></div>';
    }
    h += '<section class="panel rec-summary"><p class="today-big"><span class="num">' + sum.problems + '</span>問取り組んだ<span class="today-sep" aria-hidden="true">·</span>' +
      '<span class="today-time">' + esc(D.minutesText(sum.ms)) + '</span></p>' +
      '<ul class="rec-counts" aria-label="内訳">' +
        '<li><span class="badge tone-ok">正解</span><span class="num">' + n.correct + '</span>問</li>' +
        '<li><span class="badge tone-ok">解き直しで正解</span><span class="num">' + sum.recovered + '</span>問</li>' +
        '<li><span class="badge tone-ng">初回は誤答</span><span class="num">' + n.wrong + '</span>問</li>' +
        '<li><span class="badge tone-hold">解説を読んだ</span><span class="num">' + n.explained + '</span>問</li>' +
        (n.hold ? '<li><span class="badge tone-hold">採点保留</span><span class="num">' + n.hold + '</span>問</li>' : '') +
      '</ul><p class="panel-note">同じ日に同じ問題を何回解いても1問と数えます。間違えたあとの解き直し（同じ形の別の問題）は、もとの問題にまとめています。</p></section>';
    h += '<section aria-labelledby="rec-list-title"><h2 id="rec-list-title" class="section-title">問題ごとの結果</h2><ul class="att-list panel rec-list">' +
      groups.map(function (g) {
        return '<li><button type="button" class="att-row rec-row" data-act="record-open" data-day="' + esc(key) + '" data-key="' + esc(g.key) + '">' +
          '<span class="att-type">' + esc(D.timeOf(g.firstAt)) + (g.attempts.length > 1 ? '<span class="muted">回答 ' + g.attempts.length + '回</span>' : '') + '</span>' +
          '<span class="att-q">' + esc(groupPrompt(g)) + '</span>' +
          '<span class="att-tags">' + tagsHtml(g) + icon('chevron') + '</span></button></li>';
      }).join('') + '</ul></section>' +
      '<p class="panel-note">この画面は振り返り用です。次の学習は、ホームの「次にやること」や単元から始められます。</p>' +
      '<div class="actions actions-split"><button type="button" class="btn-primary btn-lg" data-go="home">ホームへ</button></div>';
    return h;
  }

  /** 生徒：問題1つの振り返り（英文・設問・自分の回答・正答・解説。最初の回答と解き直しの両方） */
  function renderRecord() {
    var key = view.params.day || todayKey();
    var g = D.dayGroups(state.attempts, key).filter(function (x) { return x.key === view.params.key; })[0];
    if (!g) { view = { name: 'today', params: { day: key } }; return renderToday(); }
    return '<button type="button" class="btn-text back" data-act="today-open" data-day="' + esc(key) + '">← ' + esc(D.labelOfKey(key)) + 'の記録に戻る</button>' +
      '<p class="eyebrow">' + esc(D.labelOfKey(key)) + 'の記録</p><h1 class="page-title rec-title">' + esc(groupPrompt(g)) + '</h1>' +
      '<p class="rec-tags">' + tagsHtml(g) + '</p>' +
      g.attempts.map(function (a, i) { return attemptDetailHtml(a, i, g); }).join('') +
      '<div class="actions actions-split"><button type="button" class="btn-primary btn-lg" data-act="today-open" data-day="' + esc(key) + '">一覧に戻る</button>' +
      '<button type="button" class="btn-quiet" data-go="home">ホームへ</button></div>';
  }

  /**
   * 回答1つの詳細（生徒の振り返り・講師の確認で共通）。
   * 正答は、回答したときに保存した控え（snapshot）を優先する。控えがなく、問題の版が変わっている場合はその旨を書く。
   */
  function attemptDetailHtml(a, i, g, opts) {
    opts = opts || {};
    var qq = D.findQ(a.questionId);
    var known = typeof a.questionVersion === 'number';
    var same = !!qq && known && a.questionVersion === qq.version;
    var snap = a.snapshot;
    var head = i === 0 ? (g.attempts.length > 1 ? '1回目（最初の回答）' : '回答') :
      a.retryOf ? '解き直し（同じ形の別の問題）' : a.attemptType === 'retry' ? '解説のあとに同じ問題を解き直し' : (i + 1) + '回目';
    var h = '<section class="sheet rec-attempt"><p class="eyebrow">' + esc(head) +
      '<span class="eyebrow-note">' + esc(D.timeOf(a.answeredAt)) + ' ・ ' + esc(typeLabelOf(a)) + (qq ? ' ・ ' + esc(fmtLabel(qq)) : '') + '</span></p>';
    var showChoices = false;
    if (qq) {
      h += questionPromptHtml(qq, qq.format === 'fill' && same ? a.response : null, { noInstruction: qq.format !== 'meaning' && qq.format !== 'judge' });
      showChoices = same && !!qq.choices && (qq.format === 'fill' || qq.format === 'meaning' || qq.format === 'judge');
      if (showChoices) h += resultChoicesHtml(qq, a, { choiceOrder: a.choiceOrder || null });
    } else {
      h += '<p class="q-sentence">' + esc(snap ? snap.prompt : '（問題データが見つかりません：' + a.questionId + '）') + '</p>';
    }
    var correct = snap && snap.correct ? snap.correct : (qq ? D.correctTextOf(qq) : '');
    h += '<dl class="status-grid rec-grid">';
    if (!showChoices) h += '<dt>自分の回答</dt><dd lang="en">' + (a.gaveUp ? '<span lang="ja">（解説をみる で進んだ）</span>' : esc(a.responseText || '（なし）')) + '</dd>';
    h += '<dt>正答</dt><dd lang="en">' + (correct ? esc(correct) : '<span lang="ja" class="muted">確認できません</span>') + '</dd>' +
      '<dt>結果</dt><dd>' + resultBadge(a.result) + flagsHtml(a) + (a.reasonPending ? '<span class="flag">意味の問い 未回答</span>' : '') + '</dd>';
    if (opts.teacher) {
      h += '<dt>自信</dt><dd>' + (a.confidence === 'unsure' ? '「自信がない」を押した' : '申告なし') + '</dd>' +
        '<dt>ヒント</dt><dd>' + (a.hintUsed ? '使った' : '使っていない') + '</dd>';
    }
    if (a.reason) h += '<dt>意味の問い</dt><dd>' + (a.reason.correct ? '○' : '×') + (a.reason.choiceText ? ' 選んだもの：' + esc(a.reason.choiceText) : '') +
      (!a.reason.correct && a.reason.answerText ? '（この文では：' + esc(a.reason.answerText) + '）' : '') + '</dd>';
    h += '</dl>';
    // 当時の内容を確認できるか
    var notes = [];
    if (!qq) notes.push('この問題は、いまの問題集にありません。' + (snap ? '問題文と正答は、回答したときに保存した内容です。解説は表示できません。' : '当時の問題文・正答・解説を確認できません。'));
    else if (!known) notes.push('回答したときの問題の版が記録されていないため、表示している問題・解説が当時と同じか確認できません（いまの版 ' + qq.version + ' を表示しています）。');
    else if (!same) notes.push('回答したのは版 ' + a.questionVersion + ' の問題です。' + (snap ? '正答は回答したときに保存した内容です。' : '当時の正答・選択肢は保存されていないため、') +
      '問題文・解説はいまの版（版 ' + qq.version + '）のものです。');
    if (notes.length) h += '<p class="rec-version" role="note">' + esc(notes.join(' ')) + '</p>';
    if (qq) h += '<details class="rec-explain"><summary>解説を見る</summary>' + explanationHtml(qq, { bare: true }) + '</details>';
    return h + '</section>';
  }


  /* ================= 画面：単元一覧 ================= */

      '<ol class="steps">' + steps.map(function (s) { return '<li class="' + (s[1] ? 'done' : '') + '"><span class="step-mark" aria-hidden="true">' + (s[1] ? '✓' : '') + '</span>' + s[0] + '<span class="sr">' + (s[1] ? '（済み）' : '（まだ）') + '</span></li>'; }).join('') + '</ol>' +
      // 扱う範囲は既存の用法ラベルで示す（詳しい範囲の説明 scopeNote は問題集に残し、出題範囲は変えない）
      '<p class="unit-range"><span class="label">扱う範囲</span>' + BANK.skills.map(function (sk, i) {
        return '<span class="tag tag-' + (i + 1) + '">' + esc(sk.term) + '</span>';

      trialUnitsHtml() +
      '<section class="later"><h2>今後追加する予定の単元</h2><p>動名詞・比較・関係代名詞などを予定しています。まだ利用できません。</p></section>';

  /**
   * 「もう一度練習する」：範囲を選んで、復習予定日を待たずに練習を始める。

        return '<button type="button" role="radio" aria-checked="' + on + '" class="seg-item' + (on ? ' is-current' : '') + '" data-act="self-range" data-range="' + esc(r.id) + '">' + esc(r.label) + '</button>';
      }).join('') + '</div>' +
      '<p class="field-note">' + n + '問。しばらく解いていない問題から選びます。自分で始めた練習として履歴に残し、確認状況・復習予定は変えません。</p>' +
      (busy ? '<p class="toast toast-error" role="note">途中の学習が保存されているため、いまは始められません（途中の学習を上書きしないため）。続きを最後まで進めてから始めてください。</p>' +

  /**
   * 「Lv2を練習する」「Lv3を練習する」：範囲（全範囲＋項目）を選んで始める。問題数は既存の自主練習の設定で、始める前に実際の出題数を示す。
   * 途中の学習が保存されているときは、上書きしないよう始められない（再開へ案内する）。

  function levelPracticeHtml(k) {
    var B = LEVELS[k], name = LEVEL_NAME[k];

    return '<div class="self-practice lv2-practice" id="' + k + '-practice">' +
      '<p class="field-label" id="' + k + '-range-label">' + name + '：練習する範囲</p>' +
      '<div class="seg" role="radiogroup" aria-labelledby="' + k + '-range-label">' + ranges.map(function (r) {
        var on = r.id === sel;
        return '<button type="button" role="radio" aria-checked="' + on + '" class="seg-item' + (on ? ' is-current' : '') + '" data-act="' + k + '-range" data-range="' + esc(r.id) + '">' + esc(r.label) + '</button>';
      }).join('') + '</div>' +
      '<p class="field-note" id="' + k + '-count">' + esc(label) + '：<strong class="num">' + n + '</strong>問を出題します。' +
        (sel === 'all' ? '各項目から1問ずつ選び、残りをしばらく解いていない問題から選びます。' : 'この項目の形式を混ぜて、しばらく解いていない問題から選びます。') +
        '自分で始めた練習として履歴に残し、確認状況・復習予定は変えません。</p>' +
      (busy ? '<p class="toast toast-error" role="note">途中の学習が保存されているため、いまは始められません（途中の学習を上書きしないため）。続きを最後まで進めてから始めてください。</p>' +
        '<div class="actions-inline"><button type="button" class="btn-primary" data-act="task-resume">途中の学習を再開</button></div>'
        : '<div class="actions-inline"><button type="button" class="btn-primary" data-act="' + k + '-start"' + (n ? '' : ' disabled') + '>' + name + 'の練習をはじめる（' + n + '問）' + icon('chevron') + '</button></div>') +
      '</div>';
  }

  function lv1Count() { return LV1 ? LV1.questions.filter(function (x) { return x.set === 'lv1' && x.status !== 'excluded' && !x.retryFor; }).length : 0; }

  function selfSummaryHtml(rec, atts) {
    var main = atts.filter(function (a) { return !a.retryOf; }), re = atts.filter(function (a) { return a.retryOf; });
    var ok = main.filter(function (a) { return G.isSkillCorrect(a.result); }).length;
    var reOk = re.filter(function (a) { return G.isSkillCorrect(a.result); }).length;
    var isLv2 = isLevelSet(rec.practiceSet); // Lv2・Lv3
    // Lv2：学習項目ごとの正解数（回答前には項目名を出さないので、結果で確かめられるようにする）
    var byItem = '';
    if (isLv2) {
      var tally = {}, order_ = [];
      main.forEach(function (a) { var k = a.skillId; if (!tally[k]) { tally[k] = { n: 0, ok: 0 }; order_.push(k); } tally[k].n++; if (G.isSkillCorrect(a.result)) tally[k].ok++; });
      byItem = '<section class="panel"><div class="panel-head"><h2>学習項目ごとの結果</h2></div><ul class="plain-list">' + LEVELS[rec.practiceSet].skills.filter(function (sk) { return tally[sk.id]; }).map(function (sk) {
        return '<li><strong>' + esc(sk.label) + '</strong>：' + tally[sk.id].n + '問中 ' + tally[sk.id].ok + '問正解</li>';
      }).join('') + '</ul></section>';
    }
    return '<p class="lead">範囲：' + esc(rec.rangeLabel || '全範囲') + ' ・ ' + main.length + '問中 ' + ok + '問正解' +
      (re.length ? '（解き直し ' + re.length + '問中 ' + reOk + '問正解）' : '') + '。自分で始めた練習として履歴に残しました。確認状況と復習予定は変わりません。</p>' +
      byItem +
      '<section class="panel"><div class="panel-head"><h2>今回の回答</h2></div><ul class="att-list">' + atts.map(function (a) {
        var qq = q(a.questionId);
        return '<li><button type="button" class="att-row" data-act="question" data-q="' + qq.id + '">' +
          '<span class="att-type">' + esc(isLv2 ? skill(qq.skill).label : skill(qq.skill).term) + (a.retryOf ? '<span class="muted">解き直し</span>' : '') + (isLv2 ? '<span class="muted">' + esc(fmtLabel(qq)) + '</span>' : '') + '</span>' +
          '<span class="att-q">' + esc(promptTextOf(qq)) + '<span class="muted att-ans" lang="en">' + esc(a.responseText || '（わからない）') + '</span></span>' +
          '<span class="att-tags">' + resultBadge(a.result) + '</span></button></li>';
      }).join('') + '</ul></section>' +
      '<div class="actions actions-split"><button type="button" class="btn-primary btn-lg" data-go="home">ホームへ</button>' +
      '<button type="button" class="btn-quiet" data-go="units">' + (rec.practiceSet ? '単元へ' : '単元へ（もう一度練習する）') + '</button></div>';
  }

  /* ================= 画面：問題 ================= */
  function renderSession() {
    var s = state.activeSession;
    if (!s) return renderHome();
    var item = s.items[s.index];
    var total = s.items.length;
    // 進捗＝この学習回で終えた項目の数 ÷ 全項目（既存の定義）。答えを確定して正誤を表示した時点で、その項目を「終えた」に数える
    var done = s.index + (s.current && s.current.index === s.index && s.current.phase === 'feedback' ? 1 : 0);
    var pct = Math.round(done / total * 100);
    var fromPct = progressShown.sessionId === s.id ? progressShown.pct : pct;
    progressShown = { sessionId: s.id, pct: pct };
    var progress = '<div class="q-progress"><span class="q-type">' + esc(sessionLabelOf(s)) + '</span>' +
      '<span class="q-count">' + (s.index + 1) + ' / ' + total + '</span>' +
      '<span class="q-bar" role="progressbar" aria-label="この学習の進み具合（終えた項目）" aria-valuemin="0" aria-valuemax="' + total + '" aria-valuenow="' + done + '">' +
      '<span class="q-bar-fill" data-to="' + pct + '" style="width:' + fromPct + '%"></span></span></div>';

    if (item.kind === 'explain') {
      var qq = q(item.questionId), src = attemptById(item.sourceAttemptId);
      var nextIt = s.items[s.index + 1];
      return progress + '<section class="sheet">' +
        '<p class="eyebrow">診断の問題（' + esc(fmtLabel(qq)) + '）の解説</p>' +
        questionPromptHtml(qq, null) +
        (src ? '<div class="your-answer"><span class="label">あなたの答え</span><span lang="en">' + (src.responseText ? esc(src.responseText) : '（なし）') + '</span>' + resultBadge(src.result) + flagsHtml(src) + '</div>' : '') +
        (src && src.feedback ? '<p class="feedback-note">' + esc(src.feedback) + '</p>' : '') +
        explanationHtml(qq) +
        '<div class="actions"><button type="button" class="btn-primary btn-lg" data-act="next">' +
        (nextIt && nextIt.attemptType === 'retry' ? '答えを隠して解き直す' : nextIt ? '次へ（別の問題で確かめる）' : '次へ') + '</button></div>' +
        '</section>';
    }

    var qq2 = q(item.questionId);
    var cur = S.ensureCurrent(state, SB(), T());
    // 見出しの補足（定型文）。初回診断・確認問題は出さない（診断の案内は1問目の first-note だけ）
    var typeNote = {
      retry: '解説を読んだ直後の解き直しです（類題とは別に記録します）。',
      similar: '単語や場面を変えた類題です。',
      review: '復習です。答えを見ずに思い出してみましょう。',
      trial: '試作の問題です（確認状況・復習予定には反映しません）。',
      // Lv2 は回答前に学習項目名（範囲）を出さない（範囲は単元タブと学習結果で確かめる）
      self: item.retryOf ? '間違えた問題と同じ形式・同じ用法の、別の問題です。' : isLevelSet(s.practiceSet) ? '自分で始めた練習です。確認状況・復習予定には反映しません。' : '自分で始めた練習です（範囲：' + (s.rangeLabel || '全範囲') + '）。確認状況・復習予定には反映しません。'
    }[item.attemptType] || '';
    if (item.retryOf) typeNote = '間違えた問題と同じ形式・同じ用法の、別の問題です。';
    if (qq2.reading) typeNote = item.attemptType === 'reread' ? '単語の意味を見て、同じ問いにもう一度答えます。' :
      item.readingPurpose === 'basic' ? '基本の単語で書いた別の短文です。同じ文法での読み取りを確かめます。' :
      item.readingPurpose === 'sameDay' ? '学んだ文法を手がかりに、初めて読む英文の内容を読み取ります。' : '初めて読む英文です。';
    // 確認問題は、問題画面の見出しでは「類題」と短く示す（記録・履歴の種類は「確認問題」のまま）
    var typeLabel = qq2.reading ? (s.type === 'diagnostic' ? 'Lv1・' : '') + (item.readingPurpose === 'summary' ? 'まとめ復習' : '短文読解') + (item.attemptType === 'reread' ? '・答え直し' : '') :
      s.type === 'diagnostic' ? (item.retryOf ? 'Lv1・解き直し' : 'Lv1') : SET_SHORT[s.practiceSet] ? SET_SHORT[s.practiceSet] + (item.retryOf ? '・解き直し' : '') : item.attemptType === 'followup' ? '類題' : TYPE_LABEL[item.attemptType];

    // 初回診断の1問目を初めて開いたときだけ、結果と解説がいつ出るかを短く案内する（そのまま答えられる位置）。
    // 診断を始めた直後だけ firstNoteFor が立つ。途中から再開したとき・再読み込みしたとき・2問目以降では出さない
    var firstDiag = firstNoteFor === s.id && s.type === 'diagnostic' && s.index === 0 && cur.phase === 'answer';
    var body = '<section class="sheet" aria-live="polite">' +
      '<p class="eyebrow">' + esc(typeLabel) + (qq2.reading ? '' : ' ・ ' + esc(fmtLabel(qq2))) + (typeNote ? '<span class="eyebrow-note">' + esc(typeNote) + '</span>' : '') + '</p>' +
      (firstDiag ? '<p class="first-note" role="note">' + icon('clock') + '<span>答えるたびに、正誤と解説を表示します</span></p>' : '');

    if (cur.phase === 'answer') {
      body += questionPromptHtml(qq2, cur.draft, { hideJa: qq2.showJa === 'after' }) + '<div class="answer-area" id="answer-area">' + answerControlHtml(qq2, cur) + '</div>';
      if (cur.hintUsed) body += qq2.gloss ? glossHtml(qq2) : '<div class="hint" role="note"><span class="label">ヒント</span>' + esc(qq2.hint) + '</div>';
      body += '<div class="helpers">' +
        '<button type="button" class="btn-toggle" data-act="unsure" aria-pressed="' + (cur.unsure ? 'true' : 'false') + '">' +
          '<span class="toggle-box" aria-hidden="true">' + (cur.unsure ? '✓' : '') + '</span>自信がない</button>' +
        (qq2.hint ? '<button type="button" class="btn-quiet" data-act="hint"' + (cur.hintUsed ? ' disabled' : '') + '>' + (qq2.gloss ? '単語の意味を見る' : 'ヒントを見る') + '</button>' : '') +
        '<button type="button" class="btn-quiet" data-act="giveup">' + giveUpLabel(s) + '</button>' +
        '<span class="helpers-note">' + (qq2.hint ? '「自信がない」「ヒントを見る」は押さなくてかまいません。押しても減点はありません（ヒントを見た場合は「ヒントあり」と記録します）。' : '「自信がない」は押さなくてかまいません。押しても減点はありません。') + '「' + giveUpLabel(s) + '」を押すと、この問題は「わからない」として記録され、正解には数えられません。' +
          '' + '</span>' +
        '</div>' +
        '<div class="actions"><button type="button" class="btn-primary btn-lg" data-act="submit" id="submit-btn"' + (hasDraft(qq2, cur) ? '' : ' disabled') + '>' + (qq2.evidence ? '答えを確認' : '回答を確定') + '</button></div>';
    } else {
      var a = attemptById(cur.attemptId);
      if (cur.phase === 'reason') {
        // 意味の問いに答えるまでは、日本語訳・正答・正誤・解説を出さない。英文と、聞いている部分（太字）だけを示す
        body += reasonAskHtml(qq2, cur);
      } else if (qq2.reading && cur.evidenceHold && qq2.evidence) {
        body += evidenceHoldHtml(qq2, a, cur);
      } else if (qq2.reading && cur.readingHold) {
        body += readingHoldHtml(qq2, a, cur);
      } else {
        // 根拠をタップの問題は、答え合わせで根拠の語句を強調する（正解したときは、その場で理由を一言）
        body += questionPromptHtml(qq2, qq2.format === 'fill' ? a.response : null, qq2.evidence ? { ev: { mode: 'show', tapped: cur.evidenceDone ? cur.evidenceDone.tapped : null } } : null);
        if (qq2.evidence && EA.grading.isSkillCorrect(a.result) && !a.gaveUp) body += '<p class="ev-why" role="status"><strong>✓ 根拠</strong>　' + esc(qq2.evidence.why) + '</p>';
        if (qq2.reading && a.hintUsed) body += glossHtml(qq2);
        if (qq2.choices) body += resultChoicesHtml(qq2, a, cur);
        else body += '<div class="your-answer"><span class="label">あなたの答え</span><span lang="en">' + (a.responseText ? esc(a.responseText) : '（わからない）') + '</span></div>';
        body += '<div class="verdict"><span class="label">答え</span>' + resultBadge(a.result) + flagsHtml(a) + '</div>';
        if (a.feedback) body += '<p class="feedback-note">' + esc(a.feedback) + '</p>';
        body += orderInfoHtml(qq2, a) + tfCorrectionHtml(qq2);
        if (a.reason) body += reasonResultHtml(qq2, a);
        if (qq2.reading) body += readingResultHtml(a);
        if (a.followUp && a.followUp.kind === 'basic') body += '<div class="next-note" role="note"><strong>このあと、基本の単語で書いた別の短文で、同じ文法での読み取りを確かめます。</strong></div>';
        else if (a.followUp) {
          body += '<div class="next-note" role="note">' + (a.followUp.added
            ? '<strong>' + (a.followUp.kind === 'retry' ? 'このあと、同じ形式・同じ用法の別の問題で解き直します。' : 'このあと、単語や場面を変えた問題でもう一度確かめます。') + '</strong>'
            : esc(a.followUp.why)) + '</div>';
          if (a.followUp.basics) body += basicsHtml(skill(a.skillId));
        }
        // 構造の段階解説がある問題は、それを解説とする（日本語訳も解説の中で任意に開く）
        body += qq2.structure ? structureHtml(qq2, cur) : collapsibleExplanationHtml(qq2);
        body += '<div class="actions"><button type="button" class="btn-primary btn-lg" data-act="next">' + (s.index + 1 >= total ? '結果を見る' : '次へ') + '</button></div>';
      }
    }
    return progress + body + '</section>';
  }

  /**
   * 根拠をタップ（試験導入）の英文。答える前から同じ区切りで描くので、タップ待ちに変わっても英文の位置・折り返しは同じ。
   * ev.mode … 'tap'（タップ待ち）／ 'show'（根拠を強調）／ なし（ふつうの英文）。ev.tapped … タップした区切り
   */
  function evidencePassageHtml(qq, ev) {
    ev = ev || {};
    var E = qq.evidence, tap = ev.mode === 'tap', show = ev.mode === 'show';
    return '<p class="q-passage' + (tap ? ' ev-tap' : '') + '" lang="en"' + (tap ? ' aria-describedby="ev-prompt"' : '') + '>' + E.segs.map(function (t, i) {
      var cls = 'ev-seg' + (show && i === E.answer ? ' is-evidence' : '') + (ev.tapped === i ? ' is-tapped' : '');
      if (tap) return '<span class="' + cls + '" role="button" tabindex="0" data-act="ev-tap" data-seg="' + i + '">' + esc(t) + '</span>';
      return '<span class="' + cls + '">' + (show && i === E.answer ? '<span class="sr">（根拠）</span>' : '') + esc(t) + '</span>';
    }).join(' ') + '</p>';
  }
  /** 根拠をタップ：タップ待ち → 1回タップしたら根拠を強調し、最初の答えが本文のどの情報と混ざったかを一言 */
  function evidenceHoldHtml(qq, a, cur) {
    var h = cur.evidenceHold, E = qq.evidence, tapped = h.tapped != null;
    var mine = null;
    (qq.choices || []).forEach(function (c) { if (c.id === a.response) mine = c; });
    // 選んだ答え（読み違え）だけを示す。正答はまだ見せない（指示がスマホの1画面に収まるよう、枠の中に1行で）
    var body = questionPromptHtml(qq, null, { ev: { mode: tapped ? 'show' : 'tap', tapped: h.tapped } });
    var mineHtml = '<p class="ev-mine"><span class="label">× あなたの答え</span>' + (mine ? rich(mine.text) : '') + '</p>';
    if (!tapped) {
      return body + '<div class="ev-box" role="note">' + mineHtml + '<p class="ev-prompt" id="ev-prompt">' + esc(E.prompt) + '</p>' +
        '<p class="ev-note">上の英文で、1か所だけタップします（答え合わせ中の練習です。定着の回数には数えません）。</p>' +
        '<div class="actions-inline"><button type="button" class="btn-quiet" data-act="ev-leave">解説を見る</button></div></div>';
    }
    var hit = h.tapped === E.answer;
    return body + '<div class="ev-box" role="status">' + mineHtml + '<p class="ev-tapres">' +
      (hit ? '○ その部分です。' : '△ タップしたのは「<span lang="en">' + esc(E.segs[h.tapped]) + '</span>」。根拠は黄色の部分です。') + '</p>' +
      '<p>' + esc(mine && mine.mix ? mine.mix.text : E.why) + '</p>' +
      '<div class="actions-inline"><button type="button" class="btn-primary btn-lg" data-act="ev-leave">解説を見る</button></div></div>';
  }

  /** 短文読解：必要な単語の意味（語注） */
  function glossHtml(qq) {
    return '<div class="hint gloss" role="note"><span class="label">単語の意味</span><dl class="gloss-list">' + (qq.gloss || []).map(function (g) {
      return '<dt lang="en">' + esc(g[0]) + '</dt><dd>' + esc(g[1]) + '</dd>';
    }).join('') + '</dl></div>';
  }
  /** 短文読解の1回目の誤答：正答は見せずに、答え直すか、答えと解説を見るかを選ぶ */
  function readingHoldHtml(qq, a, cur) {
    var mine = a.response;
    return questionPromptHtml(qq, null) +
      '<ul class="choices choices-result choices-1col" aria-label="あなたの答え">' + ordered(qq.choices, cur.choiceOrder).map(function (c) {
        var isMine = c.id === mine;
        return '<li class="choice choice-result ' + (isMine ? 'is-wrong' : 'is-other') + '"><span class="result-icon" aria-hidden="true">' + (isMine ? '×' : '') + '</span>' +
          '<span class="choice-text">' + rich(c.text) + '</span>' + (isMine ? '<span class="result-tag">× あなたの答え</span>' : '') + '</li>';
      }).join('') + '</ul>' +
      '<div class="verdict"><span class="label">答え</span>' + resultBadge(a.result) + '</div>' +
      readingResultHtml(a, true) +
      '<div class="reread-box"><p>必要な単語の意味だけを見て、同じ問いにもう一度答えられます（正解は「ヒントあり」として記録します）。</p>' +
      '<div class="actions-inline"><button type="button" class="btn-primary btn-lg" data-act="reading-reread">単語の意味を見て、もう一度答える</button>' +
      '<button type="button" class="btn-quiet" data-act="reading-reveal">答えと解説を見る</button></div></div>';
  }
  /** 短文読解の結果の補足：定着の回数・次に何をするか */
  function readingResultHtml(a, holding) {
    var r = a.readingResult;
    if (!r) return '';
    // 答え直すかどうかを選ぶ前は、次にすること（次は別の短文で…）はまだ出さない
    var nxt = !holding && (r.next && EA.grading.isSkillWrong(a.result) || (r.next && a.hintUsed)) ? r.next : '';
    if (!r.msg && !nxt) return '';
    return '<div class="next-note reading-note" role="note">' + (r.msg ? '<p>' + esc(r.msg) + '</p>' : '') +
      (nxt ? '<p><strong>' + icon('arrow') + ' ' + esc(nxt) + '</strong></p>' : '') + '</div>';
  }

  /** 並べ替え（余分な語・不足語）の回答の補足：使わなかった語句・補った語と、原本の余分な語・不足語 */
  function orderInfoHtml(qq, a) {
    if (qq.format !== 'order' || !qq.orderKind || qq.orderKind === 'normal') return '';
    var i = a.orderInfo || {}, rows = [];
    if (qq.orderKind === 'extra') {
      if (!a.gaveUp) rows.push('使わなかった語句：<span lang="en">' + esc((i.unused || []).join(', ') || '（なし）') + '</span>');
      rows.push('余分な語：<strong lang="en">' + esc(qq.extraToken) + '</strong>');
    } else {
      if (!a.gaveUp) rows.push('補った語：<span lang="en">' + esc(i.added || '（なし）') + '</span>' + (i.addedPos ? '（' + i.addedPos + '番目に置いた）' : ''));
      rows.push('不足していた語：<strong lang="en">' + esc(qq.missingWord) + '</strong>');
    }
    return '<p class="order-info">' + rows.map(function (r) { return '<span>' + r + '</span>'; }).join('') + '</p>';
  }
  /** ○×判断で答えが×の問題：訂正例と、文法と意味のどちらが違ったか（採点後に表示） */
  function tfCorrectionHtml(qq) {
    if (qq.format !== 'judge' || qq.answer !== 'x') return '';
    return '<div class="tf-correction"><span class="label">訂正例</span><p class="q-sentence" lang="en">' + rich(qq.correction) + '</p>' +
      '<p>この英文は×：<strong>' + esc(qq.wrongLabel) + '</strong>が違っていました。</p></div>';
  }

  /** 英文の中で、意味の問いが聞いている部分を太字＋下線にする（to が複数あっても対象がわかるように） */
  function targetSentenceHtml(sentence, target) {
    var i = target ? sentence.indexOf(target) : -1;
    if (i < 0) return esc(sentence);
    return esc(sentence.slice(0, i)) + '<strong class="reason-target">' + esc(target) + '</strong>' + esc(sentence.slice(i + target.length));
  }

  /** 意味の問い（回答前）：英文＋太字の部分＋短い質問＋3択。選んでから「回答を確定」 */
  function reasonAskHtml(qq, cur) {
    var r = qq.reason;
    return '<div class="reason">' +
      '<p class="eyebrow">意味の問い<span class="eyebrow-note">日本語訳・正誤・解説は、この問いに答えたあとに表示します。</span></p>' +
      '<p class="q-sentence reason-sentence" lang="en">' + targetSentenceHtml(r.sentence, r.target) + '</p>' +
      '<p class="reason-q">' + esc(r.prompt) + '</p>' +
      '<div class="choices" role="radiogroup" aria-label="意味の問いの選択肢">' +
      ordered(r.choices, cur.reasonOrder).map(function (c) {
        var on = cur.reasonDraft === c.id;
        return '<button type="button" role="radio" aria-checked="' + on + '" class="choice' + (on ? ' is-selected' : '') + '" data-act="reason-choose" data-choice="' + c.id + '">' +
          '<span class="choice-dot" aria-hidden="true"></span>' + esc(c.text) + '</button>';
      }).join('') + '</div>' +
      '<div class="actions"><button type="button" class="btn-primary btn-lg" data-act="reason" id="reason-submit"' + (cur.reasonDraft ? '' : ' disabled') + '>回答を確定</button></div>' +
      '</div>';
  }

  /**
   * 意味の問い（回答後）：○×、選んだもの・この文での意味、どの語句とどの語句がどうつながるか、文法用語。
   * 答えたときの文言（a.reason に保存）を使う。問題データの更新前の回答でも、当時の選択肢で表示する。
   */
  function reasonResultHtml(qq, a) {
    var r = a.reason, cur = qq.reason || {};
    var sameVersion = r.reasonVersion && r.reasonVersion === qq.version;
    var answerText = r.answerText, choiceText = r.choiceText;
    if (!answerText || !choiceText) {
      // 古い記録（文言を保存していない）：今の設問か、以前の共通の選択肢から探す
      var pool = (cur.choices || []).concat((EA.banks[a.unitId] && EA.banks[a.unitId].legacyReasonChoices) || []);
      pool.forEach(function (c) { if (!answerText && c.id === (r.answerId || (r.kind === 'role' ? a.skillId : cur.answer))) answerText = c.text; if (!choiceText && c.id === r.choiceId) choiceText = c.text; });
    }
    var chosen = null;
    if (sameVersion) (cur.choices || []).forEach(function (c) { if (c.id === r.choiceId) chosen = c; });
    var h = '<div class="reason-result"><span class="label">意味の問い</span>' +
      '<span>' + (r.correct ? '○ 選んだ意味は合っています。' : '× 選んだ意味とは違います。答えは正解なので、意味をもう一度確かめましょう。') + '</span>';
    if (!r.correct && choiceText) h += '<span class="reason-correct">あなたが選んだもの：' + esc(choiceText) + '</span>';
    if (!r.correct && chosen && chosen.feedback) h += '<span class="reason-correct">' + esc(chosen.feedback) + '</span>';
    if (answerText) h += '<span class="reason-answer">この文では：' + esc(answerText) + '</span>';
    if (sameVersion && cur.link) {
      h += '<div class="reason-link"><p class="reason-link-map" lang="en"><span class="reason-link-head">' + esc(cur.link.head) + '</span>' +
        '<span class="reason-link-arrow" aria-hidden="true">←</span><strong class="reason-target">' + esc(cur.target) + '</strong></p>' +
        '<p>' + esc(cur.link.text) + '</p>' +
        (cur.link.term ? '<p class="ex-term"><span class="label">文法の名前</span>' + esc(cur.link.term) + '</p>' : '') + '</div>';
    }
    if (r.independent === false) h += '<span class="reason-correct">日本語訳や解説を見たあとの回答なので、考え方の参考として記録します。</span>';
    if (!sameVersion) h += '<span class="reason-correct">この回答は以前の版の設問への回答です（確認状況の判定には使いません）。</span>';
    return h + '</div>';
  }

  /** 意味の問いの選択：画面全体を描き直さず、選択状態だけを変える */
  function selectReason(id) {
    var s = state.activeSession;
    if (!s || !s.current || s.current.phase !== 'reason') return;
    s.current.reasonDraft = id;
    var btns = appEl.querySelectorAll('[data-act="reason-choose"]');
    for (var i = 0; i < btns.length; i++) {
      var on = btns[i].getAttribute('data-choice') === id;
      btns[i].classList.toggle('is-selected', on);
      btns[i].setAttribute('aria-checked', on ? 'true' : 'false');
    }
    var b = document.getElementById('reason-submit');
    if (b) b.disabled = false;
    schedulePersist();
  }

  /**
   * 採点後の選択肢：色だけでなく記号と文字で示す。
   *   正答 …「✓ 正解」／ 選んだ誤答 …「× あなたの答え」／ 選んで正解 …「✓ 正解・あなたの答え」
   * 採点後は押せない（選び直しはできない）。
   */
  function resultChoicesHtml(qq, a, cur) {
    var chosen = a.gaveUp ? null : a.response;
    return '<ul class="choices choices-result' + choiceCols(qq) + '" aria-label="採点結果">' + ordered(qq.choices, cur.choiceOrder).map(function (c) {
      var isAns = c.id === qq.answer, isMine = c.id === chosen;
      var cls = isAns ? 'is-correct' : (isMine ? 'is-wrong' : 'is-other');
      var tag = isAns && isMine ? '✓ 正解・あなたの答え' : isAns ? '✓ 正解' : isMine ? '× あなたの答え' : '';
      return '<li class="choice choice-result ' + cls + '"' + (qq.format === 'fill' || qq.choicesLang === 'en' ? ' lang="en"' : '') + '>' +
        '<span class="result-icon" aria-hidden="true">' + (isAns ? '✓' : isMine ? '×' : '') + '</span>' +
        '<span class="choice-text">' + rich(c.text) + '</span>' +
        (tag ? '<span class="result-tag" lang="ja">' + tag + '</span>' : '') + '</li>';
    }).join('') + '</ul>' + (a.gaveUp ? '<p class="your-answer"><span class="label">あなたの答え</span>（わからない）</p>' : '');
  }

  /**
   * 開閉できる解説。最初は開いた状態。高さの上限を設けないので長い解説も欠けない。
   * 開閉の動きの途中でも中身は読める・押せる（visibility は閉じ終わったときだけ hidden になる）。
   */
  function collapsibleExplanationHtml(qq) {
    return '<section class="explain-block">' +
      '<button type="button" class="explain-toggle" data-act="toggle-explain" aria-expanded="true" aria-controls="ex-body">' +
      '<span class="explain-toggle-label">解説</span><span class="explain-toggle-state">とじる</span>' +
      '<span class="explain-chevron" aria-hidden="true"></span></button>' +
      '<div class="collapse is-open" id="ex-body"><div class="collapse-inner">' + explanationHtml(qq, { bare: true }) + '</div></div>' +
      '</section>';
  }

  /* ================= 英文構造の段階解説（回答を確定したあとだけ表示） ================= */
  var SX_BRACKETS = { modifier: ['（', '）'], omit: ['（', '）'] };

  function sxState(cur) { return cur.structure || (cur.structure = { open: false, step: 0, translation: false }); }

  function structureHtml(qq, cur) {
    var sv = sxState(cur);
    return '<section class="sx" aria-label="英文構造の段階解説">' +
      '<button type="button" class="btn-quiet sx-open" data-act="sx-toggle" aria-expanded="' + sv.open + '" aria-controls="sx-panel">' +
      (sv.open ? '構造をとじる' : '構造を見る') + '</button>' +
      '<div class="sx-panel" id="sx-panel"' + (sv.open ? '' : ' hidden') + '>' + (sv.open ? structurePanelInner(qq, sv) : '') + '</div></section>';
  }

  function segHtml(sg) {
    if (!sg.role) return '<span class="sx-plain">' + esc(sg.text) + '</span>';
    var b = SX_BRACKETS[sg.role] || ['', ''];
    return '<span class="sx-seg sx-' + sg.role + (sg.isNew ? ' is-new' : '') + '">' +
      '<span class="sx-words" lang="en">' + (b[0] ? '<span class="sx-bracket" aria-hidden="true">' + b[0] + '</span>' : '') + esc(sg.text) +
      (b[1] ? '<span class="sx-bracket" aria-hidden="true">' + b[1] + '</span>' : '') + '</span>' +
      '<span class="sx-label">' + esc(sg.label) + '</span></span>';
  }

  function structurePanelInner(qq, sv) {
    var m = EA.structure.stepModel(qq.structure, sv.step);
    var last = m.index === m.total - 1;
    return '<p class="sx-progress" aria-live="polite"><span class="sx-count">段階 ' + (m.index + 1) + ' / ' + m.total + '</span>' + esc(m.title) + '</p>' +
      '<ol class="sx-steps" aria-hidden="true">' + qq.structure.steps.map(function (s, i) {
        return '<li class="' + (i === m.index ? 'is-current' : i < m.index ? 'is-done' : '') + '"></li>';
      }).join('') + '</ol>' +
      '<p class="sx-sentence">' + m.segments.map(segHtml).join(' ') + '</p>' +
      (m.skeleton ? '<div class="sx-skeleton"><span class="label">骨格</span><p class="sx-sentence sx-sentence-sm">' +
        m.skeleton.map(function (p) { return segHtml({ text: p.text, role: 'skel', label: p.label, isNew: true }); }).join(' ') + '</p></div>' : '') +
      '<p class="sx-text">' + esc(m.text) + '</p>' +
      '<div class="sx-controls">' +
        '<button type="button" class="btn-quiet" data-act="sx-prev" aria-label="前の段階へ"' + (m.index === 0 ? ' disabled' : '') + '>← 前へ</button>' +
        '<button type="button" class="btn-quiet" data-act="sx-next" aria-label="次の段階へ"' + (last ? ' disabled' : '') + '>次へ →</button>' +
        '<button type="button" class="btn-quiet" data-act="sx-restart"' + (m.index === 0 ? ' disabled' : '') + '>最初から</button>' +
      '</div>' +
      '<div class="sx-trans"><button type="button" class="btn-text" data-act="sx-trans" aria-expanded="' + sv.translation + '" aria-controls="sx-trans-text">' +
        (sv.translation ? '日本語訳をかくす' : '日本語訳を見る') + '</button>' +
        '<p id="sx-trans-text" class="sx-trans-text"' + (sv.translation ? '' : ' hidden') + '>' + esc(qq.structure.translation) + '</p></div>';
  }

  /** 構造解説の操作：段階の状態を保存し、解説の部分だけを描き直す（読んでいる位置を動かさない） */
  function structureAction(act) {
    var s = state.activeSession;
    if (!s || !s.current || s.current.phase !== 'feedback') return;
    var qq = q(s.items[s.index].questionId);
    if (!qq || !qq.structure) return;
    var sv = sxState(s.current), total = qq.structure.steps.length;
    var a = attemptById(s.current.attemptId), at = now();
    if (act === 'sx-toggle') { sv.open = !sv.open; if (sv.open) EA.structure.recordView(a, 'open', sv.step, total, at); }
    if (act === 'sx-prev' && sv.step > 0) sv.step--;
    if (act === 'sx-next' && sv.step < total - 1) { sv.step++; EA.structure.recordView(a, 'step', sv.step, total, at); }
    if (act === 'sx-restart') sv.step = 0;
    if (act === 'sx-trans') { sv.translation = !sv.translation; if (sv.translation) EA.structure.recordView(a, 'translation', null, total, at); }
    var section = appEl.querySelector('.sx');
    var tmp = document.createElement('div');
    tmp.innerHTML = structureHtml(qq, s.current);
    section.replaceWith(tmp.firstChild);
    // 押したボタンにフォーカスを戻す（押せなくなったときは、となりの操作へ）
    var focusAct = act;
    if (act === 'sx-next' && sv.step === total - 1) focusAct = 'sx-prev';
    if ((act === 'sx-prev' || act === 'sx-restart') && sv.step === 0) focusAct = 'sx-next';
    var f = appEl.querySelector('[data-act="' + focusAct + '"]');
    if (f && act !== 'sx-toggle') f.focus({ preventScroll: true });
    if (act === 'sx-toggle') appEl.querySelector('[data-act="sx-toggle"]').focus({ preventScroll: true });
    schedulePersist();
  }

  /** 単元一覧の試作の単元 */
  function trialUnitsHtml() {
    return Object.keys(EA.banks).filter(function (k) { return EA.banks[k].unit.trial; }).map(function (k) {
      var b = EA.banks[k];
      return '<section class="panel unit-card"><div class="unit-head"><div><p class="eyebrow">試作（確認状況・復習予定には反映しません）</p><h2>' + esc(b.unit.title) + '</h2>' +
        '<p>' + esc(b.unit.description) + '</p></div>' +
        '<button type="button" class="btn-quiet" data-act="task-trial" data-unit="' + k + '"' + (state.activeSession ? ' disabled' : '') + '>試す（' + b.questions.length + '問）</button></div>' +
        (state.activeSession ? '<p class="unit-scope">途中の学習があるため、ホームで再開するか終えてから試せます。</p>' : '') + '</section>';
    }).join('');
  }

  function trialSummaryHtml(atts) {
    return '<section class="panel"><div class="panel-head"><h2>今回の回答</h2><p class="panel-note">試作の問題です。確認状況・復習予定には反映しません。構造の解説を見たことも、正解や理解の根拠にはしていません。</p></div><ul class="att-list">' +
      atts.map(function (a) {
        var qq = q(a.questionId), v = a.structureView;
        return '<li><button type="button" class="att-row" data-act="question" data-q="' + qq.id + '"><span class="att-type">試作</span>' +
          '<span class="att-q" lang="en">' + esc(qq.sentence) + '<span class="muted">構造の解説：' + (v ? '開いた（' + v.maxStepSeen + ' / ' + v.totalSteps + ' 段階まで' + (v.translationOpened ? '・訳を見た' : '') + '）' : '開いていない') + '</span></span>' +
          '<span class="att-tags">' + resultBadge(a.result) + '</span></button></li>';
      }).join('') + '</ul></section><div class="actions"><button type="button" class="btn-primary btn-lg" data-go="home">ホームへ</button></div>';
  }

  /** 選択肢を、学習回の中で決めた順番（正答の位置が毎回変わる）に並べる */
  function ordered(choices, order) {
    if (!order) return choices;
    var byId = {};
    choices.forEach(function (c) { byId[c.id] = c; });
    var out = order.map(function (id) { return byId[id]; }).filter(Boolean);
    return out.length === choices.length ? out : choices;
  }

  /**
   * 選択肢の並べ方。空所補充（to play などの短い語句）は2列。
   * 文や日本語の選択肢は、狭い列に詰めて2行に折り返さないよう、1つの選択肢に1行を使う（1列）。
   */
  function choiceCols(qq) { return qq.format === 'fill' ? '' : qq.format === 'judge' ? ' choices-tf' : ' choices-1col'; }

  function hasDraft(qq, cur) {
    if (qq.format === 'order') {
      var d = cur.draft || [];
      if (qq.orderKind === 'extra') return d.length === qq.tokens.length - 1;                       // 1語句を使わずに確定
      if (qq.orderKind === 'missing') return !!cur.added && d.length === qq.tokens.length + 1 && d.indexOf(qq.tokens.length) >= 0; // 補った語も置く
      return d.length === qq.tokens.length;
    }
    if (qq.format === 'ja2en') return !!(cur.draft && cur.draft.trim());
    return !!cur.draft;
  }

  function answerControlHtml(qq, cur) {
    if (qq.format === 'fill' || qq.format === 'meaning' || qq.format === 'judge') {
      return '<div class="choices' + choiceCols(qq) + '" role="radiogroup" aria-label="選択肢">' + ordered(qq.choices, cur.choiceOrder).map(function (c) {
        var on = cur.draft === c.id;
        return '<button type="button" role="radio" aria-checked="' + on + '" class="choice' + (on ? ' is-selected' : '') + '" data-act="choose" data-choice="' + c.id + '"' + (qq.format === 'fill' || qq.choicesLang === 'en' ? ' lang="en"' : '') + '>' +
          '<span class="choice-dot" aria-hidden="true"></span><span class="choice-text">' + rich(c.text) + '</span></button>';
      }).join('') + '</div>';
    }
    if (qq.format === 'order') {
      var pre = '', post = '';
      if (qq.orderKind === 'missing') {
        var msg = addWordMsg; addWordMsg = '';
        pre = '<div class="add-word"><label class="field-label" for="add-word-input">補う語（1語）</label>' +
          '<div class="add-word-row"><input id="add-word-input" class="text-input" type="text" lang="en" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="ここに入力" value="' +
            esc(cur.addedInput != null && cur.addedInput !== '' ? cur.addedInput : (cur.added || '')) + '">' +
          '<button type="button" class="btn-quiet" data-act="add-word-set">' + (cur.added ? '補う語を直す' : '語句に加える') + '</button>' +
          (cur.added ? '<button type="button" class="btn-text" data-act="add-word-del">補った語を消す</button>' : '') + '</div>' +
          (msg ? '<p class="toast toast-error add-word-msg" role="alert">' + esc(msg) + '</p>' : '') +
          '<p class="field-note">' + (cur.added ? '補った語「<span lang="en">' + esc(cur.added) + '</span>」は、下の語句に点線の枠で入っています。タップして好きな位置に置けます。' : '入力して「語句に加える」を押すと、下の語句に点線の枠で加わります。') +
          '確定する前なら、直したり消したりできます。</p></div>';
      }
      if (qq.orderKind === 'extra') post = '<p class="field-note">使わない語句を1つ残したまま「回答を確定」を押します。</p>';
      return pre + '<div id="order-mount" lang="en"></div>' + post;
    }
    if (qq.format === 'ja2en') {
      return '<label class="field-label" for="ja2en-input">英文を入力</label>' +
        '<textarea id="ja2en-input" class="text-input" rows="2" lang="en" autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false" placeholder="ここに英文を書きます">' + esc(cur.draft || '') + '</textarea>' +
        '<p class="field-note">大文字・小文字、余分な空白、文末の「.」の有無は採点に影響しません。登録されていない答えは「採点保留」になり、誤りとはしません。</p>';
    }
    return '';
  }

  /* ---- 不足語を補う並べ替え：補う語を加える・直す・消す（確定前だけ。途中保存・再開で復元される） ---- */
  var addWordMsg = '';
  function addWordSet() {
    var s = state.activeSession;
    if (!s || !s.current || s.current.phase !== 'answer') return;
    var input = document.getElementById('add-word-input');
    var w = G.cleanWord(input ? input.value : s.current.addedInput);
    if (!w) addWordMsg = '補う語を入力してください。';
    else if (/\s/.test(w)) addWordMsg = '補う語は1語で入力してください（空白を入れずに）。';
    else { s.current.added = w; s.current.addedInput = w; }
    persist(); render();
    var f = document.getElementById(addWordMsg ? 'add-word-input' : 'add-word-input');
    if (f) f.focus({ preventScroll: true });
  }
  function addWordDel() {
    var s = state.activeSession;
    if (!s || !s.current || s.current.phase !== 'answer') return;
    var qq = q(s.items[s.index].questionId), n = qq.tokens.length;
    s.current.added = null; s.current.addedInput = '';
    s.current.draft = (s.current.draft || []).filter(function (i) { return i !== n; }); // 解答欄に置いていたら外す
    persist(); render();
    var f = document.getElementById('add-word-input'); if (f) f.focus({ preventScroll: true });
  }

  /** 選択肢をタップしたとき：画面全体を描き直さず、その場で選択状態だけを変える（すぐに反応が見えるように） */
  function selectChoice(id) {
    var s = state.activeSession;
    if (!s || !s.current || s.current.phase !== 'answer') return;
    var qq = q(s.items[s.index].questionId);
    s.current.draft = id;
    var btns = appEl.querySelectorAll('[data-act="choose"]');
    for (var i = 0; i < btns.length; i++) {
      var on = btns[i].getAttribute('data-choice') === id;
      btns[i].classList.toggle('is-selected', on);
      btns[i].setAttribute('aria-checked', on ? 'true' : 'false');
    }
    var blank = appEl.querySelector('.q-sentence .blank');
    if (blank && qq.format === 'fill') {
      var text = ''; qq.choices.forEach(function (c) { if (c.id === id) text = c.text; });
      blank.textContent = text;
      blank.classList.add('filled');
    }
    var submit = document.getElementById('submit-btn');
    if (submit) submit.disabled = false;
    schedulePersist();
  }

  /** 選択の途中経過は、表示が変わったあとで保存する（画面を閉じるときは pagehide でも保存） */
  var persistTimer = null;
  function schedulePersist() {
    if (persistTimer) return;
    persistTimer = setTimeout(function () { persistTimer = null; persist(); }, 0);
  }

  /** 解説の開閉（表示だけ。保存しない） */
  function toggleExplanation(btn) {
    var body = document.getElementById(btn.getAttribute('aria-controls'));
    var open = btn.getAttribute('aria-expanded') !== 'true';
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    btn.querySelector('.explain-toggle-state').textContent = open ? 'とじる' : 'ひらく';
    body.classList.toggle('is-open', open);
  }

  /** 「初回診断とは？」の開閉（表示だけ。保存しない）。解説と同じ開閉の部品（.collapse）を使う */
  function toggleHelp(btn) {
    var body = document.getElementById(btn.getAttribute('aria-controls'));
    var open = btn.getAttribute('aria-expanded') !== 'true';
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    body.classList.toggle('is-open', open);
  }

  /** 進捗バー：直前の値から新しい値へ動かす（表示だけ。記録はすでに保存済み） */
  function animateProgress() {
    var fill = appEl.querySelector('.q-bar-fill');
    if (!fill) return;
    var to = fill.getAttribute('data-to') + '%';
    if (fill.style.width === to) return;
    fill.getBoundingClientRect(); // 起点の幅を確定させてから変える
    root.requestAnimationFrame(function () { fill.style.width = to; });
  }

  function mountSessionWidgets() {
    var s = state.activeSession;
    if (!s || !s.current || s.current.phase !== 'answer') return;
    var qq = q(s.items[s.index].questionId);
    var btn = document.getElementById('submit-btn');
    if (qq.format === 'order') {
      var n = qq.tokens.length, cur = s.current;
      var hasAdded = qq.orderKind === 'missing' && !!cur.added;
      // 補った語は語句の番号 n として扱い、語句の最後に加える（解答欄のどこにでも置ける）
      var tokens = hasAdded ? qq.tokens.concat([cur.added]) : qq.tokens;
      var pool = hasAdded ? cur.pool.concat([n]) : cur.pool;
      var placed = (cur.draft || []).filter(function (i) { return i < tokens.length; });
      EA.orderWidget.mount(document.getElementById('order-mount'), tokens, pool, placed, function (next) {
        cur.draft = next; persist();
        btn.disabled = !hasDraft(qq, cur);
      }, { fixedStart: qq.fixedStart || null, fixedEnd: qq.fixedEnd || null, addedIndex: hasAdded ? n : null });
      var aw = document.getElementById('add-word-input');
      if (aw) {
        aw.addEventListener('input', function () { cur.addedInput = aw.value; schedulePersist(); });
        aw.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' && !ev.isComposing) { ev.preventDefault(); addWordSet(); } });
      }
    }
    if (qq.format === 'ja2en') {
      var input = document.getElementById('ja2en-input');
      input.addEventListener('input', function () {
        s.current.draft = input.value; persist();
        btn.disabled = !hasDraft(qq, s.current);
      });
    }
  }

  /* ================= 画面：診断結果 ================= */
  function sessionRecord(id) {
    for (var i = state.sessions.length - 1; i >= 0; i--) if (state.sessions[i].id === id) return state.sessions[i];
    return null;
  }

  function renderResults() {
    var rec = sessionRecord(view.params.sessionId);
    if (!rec) return renderHome();
    var atts = rec.attemptIds.map(attemptById).filter(function (a) { return a && q(a.questionId); }); // 削除した問題の回答は出さない
    var solid = atts.filter(M.isSolid).length;
    var flagged = atts.filter(P.needsFollowUp).length;
    var main = atts.filter(function (a) { return !a.retryOf; }), re = atts.filter(function (a) { return a.retryOf; });
    solid = main.filter(M.isSolid).length;
    var reOk = re.filter(function (a) { return G.isSkillCorrect(a.result); }).length;
    var nextAt = P.nextReviewDate(state, BANK);
    var h = '<p class="eyebrow">不定詞 Lv1の結果</p><h1 class="page-title">' + main.length + '問中、ヒントなし・自信がないの申告なしで正解 ' + solid + '問</h1>' +
      '<p class="lead">' + (re.length ? '解き直し ' + re.length + '問中 ' + reOk + '問正解。' : '') +
      'この結果をもとに、項目ごとの確認状況と復習予定を決めました。' + (nextAt ? '次の復習は ' + U.fmtDate(nextAt) + '（' + U.relDay(nextAt, now()) + '）です。' : '') + '</p>';
    var no = 0;
    h += '<ol class="result-list">' + atts.map(function (a) {
      var qq = q(a.questionId);
      return '<li class="result-row"><div class="result-main"><span class="result-no">' + (a.retryOf ? '↳' : ++no) + '</span>' +
        '<div class="result-body"><p class="result-q">' + esc(promptTextOf(qq)) + '<span class="result-format">' + esc((a.retryOf ? '解き直し・' : '') + fmtLabel(qq)) + '</span></p>' +
        '<p class="result-ans" lang="en">' + (a.responseText ? esc(a.responseText) : '（わからない）') + '</p>' +
        '<div class="result-tags">' + resultBadge(a.result) + flagsHtml(a) + '</div></div></div>' +
        '<details class="result-detail"><summary>解説を見る</summary>' + (a.feedback ? '<p class="feedback-note">' + esc(a.feedback) + '</p>' : '') + explanationHtml(qq) + '</details></li>';
    }).join('') + '</ol>';
    h += '<div class="actions actions-split"><button type="button" class="btn-primary btn-lg" data-go="home">ホームへ</button></div>';
    return h;
  }

  /* ================= 画面：学習のまとめ ================= */
  function renderSummary() {
    var rec = sessionRecord(view.params.sessionId);
    if (!rec) return renderHome();
    var t = now();
    var atts = rec.attemptIds.map(attemptById).filter(function (a) { return a && q(a.questionId); }); // 削除した問題の回答は出さない
    var h = '<p class="eyebrow">' + esc(sessionLabelOf(rec)) + 'のまとめ' + (rec.endedEarly ? '（今日はここまで）' : '') + '</p><h1 class="page-title">おつかれさまでした</h1>';
    if (rec.type === 'trial') return h + trialSummaryHtml(atts);
    if (rec.type === 'self') return h + selfSummaryHtml(rec, atts);
    var RB = EA.banks[rec.unitId] || BANK; // この学習回の単元の項目だけを示す
    if (atts.length) {
      h += '<section class="panel"><div class="panel-head"><h2>今回の回答</h2></div><ul class="att-list">' + atts.map(function (a) {
        var qq = q(a.questionId);
        return '<li><button type="button" class="att-row" data-act="question" data-q="' + qq.id + '">' +
          '<span class="att-type">' + esc(typeLabelOf(a)) + '</span>' +
          '<span class="att-q">' + esc(plain(qq.ja || qq.sentence)) + '</span>' +
          '<span class="att-tags">' + resultBadge(a.result) + flagsHtml(a) + '</span></button></li>';
      }).join('') + '</ul></section>';
    }
    if ((rec.unresolved || []).length) {
      h += '<section class="panel"><div class="panel-head"><h2>次回にもちこす内容</h2><p class="panel-note">確認済みにはしていません。次の復習で、別の問題で確かめます。</p></div><ul class="plain-list">' +
        rec.unresolved.map(function (u) { return '<li><strong>' + esc(skill(u.skillId).label) + '</strong>：' + esc(u.why) + '</li>'; }).join('') + '</ul></section>';
    }
    h += '<section class="panel"><div class="panel-head"><h2>確認状況と次の復習</h2></div><ul class="plan-list">' +
      RB.skills.map(function (sk) {
        var st = M.analyze(sk.id, state.attempts, RB);
        var sch = state.schedule[sk.id];
        var ch = (rec.scheduleChanges || []).filter(function (c) { return c.skillId === sk.id; })[0];
        return '<li><div class="plan-name"><span class="skill-label">' + esc(sk.label) + '</span><span class="skill-term">' + esc(sk.term) + '</span></div>' +
          '<div class="plan-status">' + statusInline(st) + '</div>' +
          '<div class="plan-due">' + (sch ? '<strong>' + U.fmtDate(sch.dueAt) + '</strong>（' + U.relDay(sch.dueAt, t) + '）' : '—') +
          (ch ? '<span class="plan-why">' + esc(ch.why) + '</span>' : (sch ? '<span class="plan-why">今回は変更なし</span>' : '')) + '</div></li>';
      }).join('') + '</ul>' +
      ((rec.deferredSkills || []).length ? '<p class="panel-note">ほかに' + rec.deferredSkills.length + '件の復習が残っています。一度に増やしすぎないよう、次回にまわしました。</p>' : '') +
      '</section>';
    h += '<div class="actions"><button type="button" class="btn-primary btn-lg" data-go="home">ホームへ</button></div>';
    return h;
  }

  /* ================= 画面：履歴・復習（単元一覧 → 単元の詳細） ================= */
  /** 問題IDから、その問題がある単元の問題集を探す */
  function bankOfQuestion(id) {
    for (var k in EA.banks) if (EA.findQuestion(EA.banks[k], id)) return EA.banks[k];
    return null;
  }
  /** 回答の単元ID（記録の unitId。古い記録で無い場合は、問題がある単元） */
  function attemptUnitId(a) {
    var b = (a.unitId && EA.banks[a.unitId]) || bankOfQuestion(a.questionId);
    if (!b) return a.unitId || null;
    // 練習用の問題集（不定詞 Lv1 など）の回答は、親の単元の履歴にまとめる
    return b.unit.parent && EA.banks[b.unit.parent] ? b.unit.parent : b.unit.id;
  }

  /**
   * 単元の復習の状態。既存の復習判定（planner.dueReviews / buildReviewSession）と、ホームの課題の順番
   * （途中の学習 → 初回診断 → 類題 → 復習）をそのまま使う。
   *   ready     今すぐ始められる。count は buildReviewSession が実際に出す問題数（一覧の「復習◯問」と一致）
   *   blocked   期限は来ているが、途中の学習・初回診断・類題が先（why に理由）
   *   scheduled 次の復習日が決まっている（next）
   *   none      予定なし（診断前・試作の単元）
   */
  function reviewInfo(bank, t) {
    if (bank.unit.trial) return { kind: 'none', trial: true };
    var u = state.units[bank.unit.id] || {};
    var due = P.dueReviews(state, bank, t);
    var next = P.nextReviewDate(state, bank);
    if (due.length) {
      if (state.activeSession) return { kind: 'blocked', why: '途中の学習を最後まで進めると始められます。', resume: true };
      if (!u.diagnosticDoneAt) return { kind: 'blocked', why: '不定詞 Lv1 のあとに始められます。' };
      var count = P.buildReviewSession(state, bank, t).items.length;
      if (count) return { kind: 'ready', count: count };
    }
    return next ? { kind: 'scheduled', next: next } : { kind: 'none' };
  }

  function renderHistory() {
    var t = now();
    var unitId = view.params.unit;
    var bank = unitId && EA.banks[unitId];
    if (!bank) return historyUnitsHtml(t);
    return historyUnitHtml(bank, t);
  }

  /** 単元一覧：単元名のボタン。今すぐ復習できる単元だけ「復習◯問」を添える */
  function historyUnitsHtml(t) {
    return '<h1 class="page-title">履歴・復習</h1>' +
      '<ul class="unit-picks" aria-label="単元">' + Object.keys(EA.banks).filter(function (k) { return !EA.banks[k].unit.parent; }).map(function (k) {
        var b = EA.banks[k], ri = reviewInfo(b, t);
        return '<li><button type="button" class="unit-pick" data-act="history-unit" data-unit="' + esc(k) + '">' +
          '<span class="unit-pick-name">' + esc(b.unit.title) + '</span>' +
          (ri.kind === 'ready' ? '<span class="unit-pick-due">' + icon('repeat') + '復習' + ri.count + '問</span>' : '') +
          icon('chevron') + '</button></li>';
      }).join('') + '</ul>' + dateListHtml();
  }

  /* ================= 履歴・復習：日付別の学習記録（日付 → 単元 → 間違えた問題） ================= */
  /** 回答した時点の問題文と正解（保存済みの控えを優先）。当時の内容を確認できないときは note に理由 */
  function contentOf(a) {
    var qq = D.findQ(a.questionId), snap = a.snapshot;
    var known = typeof a.questionVersion === 'number', same = !!qq && known && a.questionVersion === qq.version;
    var prompt = snap && snap.prompt ? snap.prompt : qq ? D.promptTextOf(qq) : '';
    var correct = snap && snap.correct ? snap.correct : qq ? D.correctTextOf(qq) : '';
    var note = '';
    if (!snap) {
      if (!qq) note = '旧データのため、当時の問題文と正解を確認できません。';
      else if (!same) note = '旧データのため当時の問題文・正解は保存されていません。いまの問題（版 ' + qq.version + '）の内容を表示しています' + (known ? '（回答したのは版 ' + a.questionVersion + '）' : '') + '。';
    }
    return { prompt: prompt, correct: correct, note: note };
  }
  /** 回答の単元。問題が削除された古い記録は、文法項目（skillId）を持つ単元にまとめる */
  function unitIdOfGroup(g) {
    var u = attemptUnitId(g.first);
    if (u) return u;
    for (var k in EA.banks) if (EA.findSkill(EA.banks[k], g.first.skillId)) return EA.banks[k].unit.parent || k;
    return 'other';
  }
  function unitTitle(id) { return EA.banks[id] ? EA.banks[id].unit.title : '（単元不明）'; }

  /** 日付の一覧：今日を含む直近7日はすべて（学習しなかった日は「学習なし」）、それより前は1問以上回答した日だけ。新しい順 */
  function dateListHtml() {
    var today = todayKey(), keys = [];
    for (var i = 0; i < 7; i++) keys.push(D.shiftKey(today, -i));
    keys = keys.concat(D.daysWithRecords(state.attempts).filter(function (k) { return k < keys[6]; }));
    var open = view.params.openDay;
    return '<section aria-labelledby="days-title" class="day-list-section"><h2 id="days-title" class="section-title">日付別の学習記録</h2>' +
      '<ul class="day-list" aria-label="日付（新しい順）">' + keys.map(function (k) {
        var groups = D.dayGroups(state.attempts, k), sum = D.summarize(groups);
        var label = D.labelOfKey(k) + (k === today ? '（今日）' : '');
        if (!groups.length) return '<li class="day-row is-empty"><span class="day-date">' + esc(label) + '</span><span class="day-sum muted">学習なし</span></li>';
        var isOpen = open === k, units = {}, order = [];
        groups.forEach(function (g) {
          var u = unitIdOfGroup(g);
          if (!units[u]) { units[u] = []; order.push(u); }
          units[u].push(g);
        });
        return '<li class="day-row' + (isOpen ? ' is-open' : '') + '"><span class="day-date">' + esc(label) + '</span>' +
          '<span class="day-sum"><span class="num">' + sum.problems + '</span>問・誤答 <span class="num">' + sum.wrong + '</span></span>' +
          '<button type="button" class="btn-quiet day-open" data-act="day-open" data-day="' + k + '" aria-expanded="' + isOpen + '" aria-controls="day-' + k + '">単元を見る' + icon('chevron') + '</button>' +
          (isOpen ? '<ul class="day-units" id="day-' + k + '">' + order.map(function (u) {
            var s2 = D.summarize(units[u]);
            return '<li><button type="button" class="day-unit" data-act="day-unit" data-day="' + k + '" data-unit="' + esc(u) + '">' +
              '<span class="day-unit-name">' + esc(unitTitle(u)) + '</span>' +
              '<span class="day-unit-sum">問題 <span class="num">' + s2.problems + '</span>・誤答 <span class="num' + (s2.wrong ? ' is-ng' : '') + '">' + s2.wrong + '</span></span>' +
              icon('chevron') + '</button></li>';
          }).join('') + '</ul>' : '') + '</li>';
      }).join('') + '</ul></section>';
  }

  /** その日・その単元で間違えた問題：問題文・最初に誤答したときの自分の回答・正解（解き直しで正解していても最初の誤答を出す） */
  function renderDayUnit() {
    var day = view.params.day, unit = view.params.unit;
    var groups = D.dayGroups(state.attempts, day).filter(function (g) { return unitIdOfGroup(g) === unit; });
    var wrong = groups.filter(function (g) { return g.hadWrong; });
    var h = '<button type="button" class="btn-text back" data-act="day-back" data-day="' + esc(day) + '">← 日付の一覧に戻る</button>' +
      '<p class="eyebrow">' + esc(D.labelOfKey(day)) + '</p><h1 class="page-title">' + esc(unitTitle(unit)) + '</h1>' +
      '<p class="lead">この日に取り組んだ問題 ' + groups.length + '問のうち、間違えた問題 ' + wrong.length + '問</p>';
    if (!wrong.length) return h + '<p class="muted">この日、この単元で間違えた問題はありません。</p>';
    return h + '<ul class="wrong-list">' + wrong.map(function (g) {
      var fw = g.attempts.filter(function (a) { return !a.gaveUp && a.result === 'incorrect'; })[0];
      var c = contentOf(fw);
      return '<li class="panel wrong-item"><p class="wrong-tags">' + tagsHtml(g) + '<span class="muted">' + esc(D.timeOf(fw.answeredAt)) + ' ・ ' + esc(typeLabelOf(fw)) + '</span></p>' +
        '<dl class="wrong-grid">' +
          '<dt>問題文</dt><dd class="wrong-prompt" lang="en">' + (c.prompt ? esc(c.prompt) : '<span lang="ja" class="muted">確認できません</span>') + '</dd>' +
          '<dt>最初の回答</dt><dd class="wrong-mine" lang="en">' + esc(fw.responseText || '（なし）') + '</dd>' +
          '<dt>正解</dt><dd class="wrong-correct" lang="en">' + (c.correct ? esc(c.correct) : '<span lang="ja" class="muted">確認できません</span>') + '</dd>' +
        '</dl>' + (c.note ? '<p class="rec-version" role="note">' + esc(c.note) + '</p>' : '') +
        '<div class="actions-inline"><button type="button" class="btn-text" data-act="record-open" data-day="' + esc(day) + '" data-key="' + esc(g.key) + '">解説と解き直しの結果を見る</button></div></li>';
    }).join('') + '</ul>';
  }

  /** 単元の詳細：見出し＝単元名、上に「復習」、下に「学習履歴」（この単元の記録だけ） */
  function historyUnitHtml(bank, t) {
    var id = bank.unit.id, ri = reviewInfo(bank, t);
    var h = '<button type="button" class="btn-text back" data-act="history-units">← 単元一覧に戻る</button>' +
      '<h1 class="page-title">' + esc(bank.unit.title) + '</h1>';

    // 復習
    h += '<section class="panel review-panel" aria-labelledby="review-title"><div class="panel-head"><h2 id="review-title">復習</h2></div>';
    if (ri.kind === 'ready') {
      h += '<div class="review-now"><p class="review-count"><span class="num">' + ri.count + '</span>問 今すぐ復習できます</p>' +
        '<button type="button" class="btn-primary btn-lg" data-act="task-review" data-unit="' + esc(id) + '">復習をはじめる' + icon('chevron') + '</button></div>';
    } else if (ri.kind === 'blocked') {
      h += '<p class="review-note">' + esc(ri.why) + '</p>' +
        (ri.resume ? '<div class="actions-inline"><button type="button" class="btn-quiet" data-act="task-resume">続きから再開</button></div>' : '');
    } else if (ri.kind === 'scheduled') {
      h += '<p class="review-next">' + icon('calendar') + '<span>次の復習</span><strong>' + esc(monthDay(ri.next)) + '</strong><span class="muted">' + U.relDay(ri.next, t) + '</span></p>';
    } else {
      h += '<p class="muted">' + (ri.trial ? 'この単元は復習の対象外です。' : '復習の予定はまだありません。') + '</p>';
    }
    if (!bank.unit.trial && (view.params.skill || state.attempts.some(function (a) { return attemptUnitId(a) === id; }))) {
      h += '<details class="review-skills"' + (view.params.skill ? ' open' : '') + '><summary>項目ごとの確認状況と復習予定</summary>' + skillPanelsHtml(bank, t) + '</details>';
    }
    h += '</section>';

    // 学習履歴（この単元の回答だけ。新しい順）
    var list = state.attempts.filter(function (a) { return attemptUnitId(a) === id; }).reverse();
    h += '<section aria-labelledby="log-title" class="history-log"><h2 id="log-title" class="section-title">学習履歴</h2>' +
      (list.length ? '<ul class="att-list panel">' + list.map(function (a) {
        var qq = q(a.questionId);
        return '<li><button type="button" class="att-row" data-act="question" data-q="' + esc(a.questionId) + '">' +
          '<span class="att-type">' + esc(typeLabelOf(a)) + '<span class="muted">' + U.fmtDateTime(a.answeredAt) + '</span></span>' +
          '<span class="att-q">' + esc(qq ? promptTextOf(qq) : '（削除した問題：' + a.questionId + '）') + '<span class="muted att-ans" lang="en">' + esc(a.responseText || '（わからない）') + '</span></span>' +
          '<span class="att-tags">' + resultBadge(a.result) + flagsHtml(a) + '</span></button></li>';
      }).join('') + '</ul>' : '<p class="muted">学習履歴はまだありません</p>') + '</section>';
    return h;
  }

  /** 短文読解の状態（定着の回数・次の確認日・次にすること） */
  function readingStatusRows(skillId) {
    var rs = EA.reading.status(state, skillId);
    if (rs.kind === 'none') return '<dt>短文読解</dt><dd class="muted">まだ（不定詞 Lv1 のあとに始まります）</dd>';
    var r = rs.r;
    return '<dt>短文読解</dt><dd class="rs-' + rs.kind + '"><strong>' + esc(rs.label) + '</strong>' +
      (r.countDays.length ? '<span class="muted">正解した日：' + r.countDays.map(D.labelOfKey).join('・') + '</span>' : '') + '</dd>' +
      '<dt>短文の次の確認</dt><dd>' + esc(D.labelOfKey(r.dueDay)) + (rs.kind === 'settled' ? '（まとめ復習）' : '（単独の短文）') +
      (r.next ? '<span class="muted">' + esc(r.next.text) + '</span>' : '') + '</dd>';
  }

  /** 項目ごとの確認状況と復習予定（選んだ単元の項目・問題だけ） */

    return bank.skills.map(function (sk) {
        var st = M.analyze(sk.id, state.attempts, bank);

        var open = view.params.skill === sk.id;
        var qs = bank.questions.filter(function (x) { return x.skill === sk.id; });
        var meaningText = { confirmed: '訳を見ずに確認できた', recheck: '再確認が必要', reference: '訳・解説を見たあとの回答のみ（参考）', unchecked: 'まだ確認していない' }[st.meaning];
        return '<section class="panel skill-panel" id="skill-' + sk.id + '"><div class="skill-panel-head">' +
          '<div><h3>' + esc(sk.label) + '<span class="skill-term">' + esc(sk.term) + '</span></h3><p class="muted">' + esc(sk.plain) + '</p></div>' +
          '<div class="skill-panel-due">' + (sch ? '<span class="label">次の復習</span><strong>' + U.fmtDate(sch.dueAt) + '</strong><span class="muted">' + U.relDay(sch.dueAt, t) + ' ・ 間隔 ' + sch.intervalDays + '日</span>' : '<span class="muted">予定なし（診断前）</span>') + '</div></div>' +
          '<dl class="status-grid">' +
            '<dt>いまの状態</dt><dd class="tone-text-' + st.tone + '">' + esc(st.headline) + '</dd>' +
            '<dt>これまでの確認実績</dt><dd>' + achievementMeter(st.achievement) + ' ' + esc(st.achievementLabel) + '</dd>' +
            '<dt>意味の確認</dt><dd>' + esc(meaningText) + '</dd>' +
            readingStatusRows(sk.id) +
          '</dl>' +
          // 詳しい実績（ホームの一行では「実績 n/3」だけを示す）
          '<ul class="ach-list" aria-label="これまでの確認実績">' + ACH_SHORT.map(function (label, j) {
            var on = st.achievement >= j + 1;
            return '<li class="' + (on ? 'is-on' : '') + '"><span>' + label + '</span><span class="ach-dot" aria-hidden="true">' + (on ? icon('check') : '') + '</span>' +
              '<span class="sr">' + (on ? '（確認済み）' : '（まだ）') + '</span></li>';
          }).join('') + '</ul>' +
          (st.issues.length ? '<ul class="issue-list">' + st.issues.map(function (i) {
            return '<li><strong>' + esc(i.label) + '</strong>（' + U.fmtDate(i.since) + '〜）<span class="muted">' + esc(i.rule) + '</span></li>';
          }).join('') + (st.teacherCandidate ? '<li><strong>講師に相談する候補</strong><span class="muted">同じ内容で2回以上つまずいています。</span></li>' : '') + '</ul>' : '') +
          '<details' + (open ? ' open' : '') + '><summary>判定の根拠</summary><ul class="evidence">' + st.evidence.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul></details>' +
          (sch && sch.history ? '<details><summary>復習予定が決まった理由</summary><ul class="sched-history">' + sch.history.slice().reverse().map(function (x) {
            return '<li><span class="muted">' + U.fmtDateTime(x.at) + '</span> ' + esc(SESSION_LABEL[x.sessionType]) + '：' + esc(x.why) + ' → ' + U.fmtDate(x.dueAt) + '</li>';
          }).join('') + '</ul></details>' : '') +
          '<details' + (open ? ' open' : '') + '><summary>この項目の問題（' + qs.length + '問）・解説・過去の回答</summary><ul class="q-list">' + qs.map(function (x) {
            var n = state.attempts.filter(function (a) { return a.questionId === x.id; });
            var last = n[n.length - 1];
            return '<li><button type="button" class="att-row" data-act="question" data-q="' + x.id + '"><span class="att-type">' + esc(fmtLabel(x)) + '</span>' +
              '<span class="att-q">' + esc(plain(x.ja || x.sentence)) + (x.status === 'excluded' ? '（判定から除外中）' : x.retired ? '（出題終了）' : '') + '</span>' +
              '<span class="att-tags">' + (last ? resultBadge(last.result) : '<span class="muted">未回答</span>') + '<span class="muted">' + n.length + '回</span></span></button></li>';
          }).join('') + '</ul></details></section>';
      }).join('');
  }

  /* ================= 画面：問題の詳細 ================= */
  function renderQuestion() {
    var qq = q(view.params.q);
    if (!qq) return renderHistory();
    var qb = bankOfQuestion(qq.id) || BANK;
    // 以前の試用版の問題IDで記録された回答も、同じ問題の回答として表示する
    var atts = state.attempts.filter(function (a) { return a.questionId === qq.id || (qb.aliases && qb.aliases[a.questionId] === qq.id); }).reverse();
    var backUnit = EA.banks[qb.unit.parent] || qb;
    return '<button type="button" class="btn-text back" data-act="back-history" data-unit="' + esc(backUnit.unit.id) + '" data-skill="' + qq.skill + '">← ' + esc(backUnit.unit.title) + 'の履歴・復習へ</button>' +
      '<p class="eyebrow">' + esc(skill(qq.skill).label) + ' ・ ' + esc(fmtLabel(qq)) + ' ・ ' + esc(qq.id) + '（版 ' + qq.version + '）</p>' +
      '<section class="sheet">' + questionPromptHtml(qq, null) +
      '<p class="muted">確認すること：' + esc(qq.checks) + '</p>' +
      (qq.retired ? '<p class="muted">この問題は出題を終えました（' + esc(qq.retiredReason || '') + '）。過去の回答は判定にそのまま使います。</p>' : '') + explanationHtml(qq) +
      ((qq.changes || []).length ? '<details><summary>問題の修正履歴</summary><ul class="plain-list">' + qq.changes.map(function (c) { return '<li>版' + c.version + '：' + esc(c.what) + '。過去の記録：' + esc(c.oldRecords) + '</li>'; }).join('') + '</ul></details>' : '') +
      '</section>' +
      '<section class="panel"><div class="panel-head"><h2>過去の回答（' + atts.length + '回）</h2></div>' +
      (atts.length ? '<div class="table-wrap"><table class="att-table"><thead><tr><th>日時</th><th>種類</th><th>答え</th><th>結果</th></tr></thead><tbody>' + atts.map(function (a) {
        return '<tr><td class="num">' + U.fmtDateTime(a.answeredAt) + '<span class="muted">版' + a.questionVersion + '</span></td><td>' + esc(typeLabelOf(a)) + '</td><td lang="en">' + esc(a.responseText || '（わからない）') + '</td>' +
          '<td>' + resultBadge(a.result) + flagsHtml(a) + (M.isExcluded(a, qb) ? '<span class="flag">判定から除外</span>' : '') + '</td></tr>';
      }).join('') + '</tbody></table></div>' : '<p class="muted">まだ回答していません。</p>') + '</section>';
  }

      '<div class="actions-inline"><button type="button" class="btn-quiet" data-act="teacher-records">' + icon('chart') + '生徒の記録を確認する</button>' +

    if (demo) {
      h += '<section class="panel dev"><div class="panel-head"><h2>デモモード：日付を進める</h2><p class="panel-note">後日の復習が出るかを確かめるための機能です。通常の記録には影響しません。</p></div>' +
