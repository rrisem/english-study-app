<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>英文法ドリル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="英文法ドリル">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/*
 * レイアウトの考え方：澄んだ空の色の上に、白いカードを浮かべる。ホームは「次にやること｜単元の進み具合」を
 * 1枚のカードにまとめ、その下に3つの使い方の確認状況、いちばん下に今週の学習。今日の学習時間は「学習時間」画面に分ける。
 * 問題画面は1列・中央寄せで、英文と回答操作だけに集中できる配置。
 * 色：空の青（押す場所・いまここ）＋ 蛍光ペンの黄色（解説で to＋動詞 の部分に引く線）。正誤・状態の色は別に持つ。
 */
:root {
  --bg: #edf3fa;
  --bg-top: #f7fafd;
  --surface: #ffffff;
  --surface-2: #f0f4fa;
  --ink: #17253b;
  --muted: #56647b;
  --line: #dde5f0;
  --accent: #1c5cc0;
  --accent-2: #3d8ee6;
  --accent-ink: #ffffff;
  --accent-soft: #e2ecfa;
  --track: #e3e9f2;
  --marker: #fff0a3;
  --marker-ink: #3b3100;
  --ok: #1f6b45;
  --ok-soft: #e1f1e8;
  --ng: #a3342c;
  --ng-soft: #f8e4e1;
  --hold: #7a5a00;
  --hold-soft: #f6efd8;
  --focus: #e0a100;
  --chip-1: #2f6fc4;
  --chip-2: #c25a3e;
  --chip-3: #55677e;
  --chip-ink: #ffffff;
  --hill-1: #c8daf1;
  --hill-2: #d9e6f6;
  --hill-3: #e6eef9;
  --flame: #e0663f;
  --shadow: 0 12px 32px rgba(28, 72, 140, 0.08), 0 1px 3px rgba(28, 72, 140, 0.06);
  --glow: 0 8px 20px rgba(28, 92, 192, 0.28);
  --cta: #154a9f;       /* その状態でいちばん優先する操作のボタン（ホームで最も濃い青） */
  --cta-ink: #ffffff;

  --font-ja: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --font-en: "Atkinson Hyperlegible", "Helvetica Neue", Arial, var(--font-ja);
  --font-mono: ui-monospace, "SFMono-Regular", Menlo, monospace;

  --fs-xs: 0.8125rem;
  --fs-s: 0.9375rem;
  --fs-m: 1.0625rem;
  --fs-l: 1.375rem;
  --fs-xl: 1.75rem;
  --fs-xxl: 2.25rem;

  --r: 18px;
  --r-s: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1520; --bg-top: #121c2b; --surface: #172131; --surface-2: #1e2a3d; --ink: #e6edf7; --muted: #a2b2c8; --line: #2b3b53;
    --accent: #86b6f5; --accent-2: #5f9dec; --accent-ink: #0b1626; --accent-soft: #1f3354; --track: #26354b;
    --marker: #5c4f12; --marker-ink: #fff3c4;
    --ok: #7fd1a3; --ok-soft: #173326; --ng: #f19a90; --ng-soft: #3a1d1b; --hold: #e6c56a; --hold-soft: #332a12; --focus: #ffcc4d;
    --chip-1: #3e78c8; --chip-2: #b85a40; --chip-3: #5a6c84; --chip-ink: #ffffff;
    --hill-1: #1c2b42; --hill-2: #172437; --hill-3: #131e2e; --flame: #f08a63;
    --shadow: 0 12px 32px rgba(0, 0, 0, 0.35), 0 1px 3px rgba(0, 0, 0, 0.3); --glow: 0 8px 20px rgba(0, 0, 0, 0.35);
    --cta: #8fbcf7; --cta-ink: #0b1626;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1520; --bg-top: #121c2b; --surface: #172131; --surface-2: #1e2a3d; --ink: #e6edf7; --muted: #a2b2c8; --line: #2b3b53;
  --accent: #86b6f5; --accent-2: #5f9dec; --accent-ink: #0b1626; --accent-soft: #1f3354; --track: #26354b;
  --marker: #5c4f12; --marker-ink: #fff3c4;
  --ok: #7fd1a3; --ok-soft: #173326; --ng: #f19a90; --ng-soft: #3a1d1b; --hold: #e6c56a; --hold-soft: #332a12; --focus: #ffcc4d;
  --chip-1: #3e78c8; --chip-2: #b85a40; --chip-3: #5a6c84; --chip-ink: #ffffff;
  --hill-1: #1c2b42; --hill-2: #172437; --hill-3: #131e2e; --flame: #f08a63;
  --shadow: 0 12px 32px rgba(0, 0, 0, 0.35), 0 1px 3px rgba(0, 0, 0, 0.3); --glow: 0 8px 20px rgba(0, 0, 0, 0.35);
  --cta: #8fbcf7; --cta-ink: #0b1626;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg) linear-gradient(180deg, var(--bg-top) 0, var(--bg) 480px) no-repeat;
  color: var(--ink);
  font-family: var(--font-ja);
  font-size: var(--fs-m);
  line-height: 1.7;
  -webkit-tap-highlight-color: transparent;
}
[lang="en"] { font-family: var(--font-en); }
button { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.35; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.label { display: inline-block; font-size: var(--fs-xs); color: var(--muted); letter-spacing: 0.06em; margin-right: 0.75em; font-weight: 700; }
[hidden] { display: none !important; }

/* ---------- 上部バー ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg-top); }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg-top); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.topbar-inner { max-width: 1160px; margin: 0 auto; min-height: 68px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 6px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; font-weight: 700; }
.brand-mark { font-family: var(--font-en); font-weight: 700; background: linear-gradient(160deg, var(--accent-2), var(--accent)); color: var(--accent-ink); padding: 2px 9px 3px; border-radius: 9px; font-size: 1.05rem; }
.brand-name { font-size: var(--fs-m); letter-spacing: 0.14em; }
.nav { display: flex; gap: 6px; flex-wrap: wrap; }
.nav-item { display: inline-flex; align-items: center; gap: 7px; background: none; border: 0; padding: 8px 18px; border-radius: 999px; color: var(--ink); font-size: var(--fs-s); cursor: pointer; min-height: 44px; }
.nav-item .icon { width: 18px; height: 18px; color: var(--muted); }
@media (hover: hover) { .nav-item:hover:not(.is-current) { background: var(--accent-soft); } }
.nav-item.is-current { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.nav-item.is-current .icon { color: var(--accent-ink); }
@media (max-width: 720px) {
  .topbar-inner { gap: 4px 12px; }
  .nav { width: 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding-bottom: 6px; }
  .nav-item { flex-direction: column; gap: 2px; padding: 6px 4px; border-radius: 12px; font-size: var(--fs-xs); min-height: 52px; white-space: nowrap; }
}
/* 4項目のナビを、320px 幅でも文字が切れずに1行で並べる */
@media (max-width: 360px) {
  .nav { gap: 2px; }
  .nav-item { padding-inline: 1px; font-size: 0.6875rem; letter-spacing: -0.02em; }
}
.devbar, .warnbar { font-size: var(--fs-s); padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
.devbar { background: var(--hold-soft); color: var(--hold); }
.warnbar { background: var(--ng-soft); color: var(--ng); }

/* ---------- 本体 ---------- */
.main {
  max-width: 1080px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
  display: flex; flex-direction: column; gap: 24px;
}
.view-session, .view-question, .view-results, .view-summary { max-width: 820px; }
.eyebrow { font-size: var(--fs-xs); color: var(--muted); letter-spacing: 0.08em; font-weight: 700; }
.eyebrow-note { font-weight: 400; letter-spacing: 0; margin-left: 0.75em; }
.page-title { font-size: var(--fs-xl); }
.lead { color: var(--muted); max-width: 40em; }
.toast { background: var(--accent-soft); color: var(--ink); border-radius: var(--r-s); padding: 12px 16px; font-size: var(--fs-s); }

/* ---------- ボタン ---------- */
.btn-primary, .btn-quiet, .btn-danger, .btn-toggle {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 10px 20px; border-radius: var(--r-s); cursor: pointer;
  font-weight: 700; font-size: var(--fs-s); border: 1px solid transparent; touch-action: manipulation;
}
.btn-primary { background: linear-gradient(135deg, var(--accent-2), var(--accent)); color: var(--accent-ink); border-radius: 12px; }
@media (hover: hover) { .btn-primary:hover:not(:disabled) { filter: brightness(1.08); } }
.btn-primary:disabled { background: var(--surface-2); box-shadow: none; color: var(--muted); cursor: not-allowed; filter: none; }
.btn-lg { min-height: 56px; padding: 12px 28px; font-size: var(--fs-m); }
.btn-quiet { background: var(--surface); border-color: var(--line); color: var(--ink); font-weight: 400; }
@media (hover: hover) { .btn-quiet:hover:not(:disabled) { border-color: var(--accent); } }
.btn-quiet:disabled { color: var(--muted); opacity: 0.6; cursor: not-allowed; }
.btn-danger { background: var(--ng); color: var(--surface); }
.btn-text { background: none; border: 0; padding: 8px 4px; color: var(--accent); cursor: pointer; font-size: var(--fs-s); text-decoration: underline; text-underline-offset: 3px; min-height: 40px; }
.btn-text:disabled { color: var(--muted); text-decoration: none; cursor: default; }
.btn-toggle { background: var(--surface); border-color: var(--line); font-weight: 400; }
.btn-toggle[aria-pressed="true"] { background: var(--hold-soft); border-color: var(--hold); color: var(--hold); font-weight: 700; }
.toggle-box { width: 20px; height: 20px; border: 2px solid currentColor; border-radius: 4px; display: inline-grid; place-items: center; font-size: 0.8rem; line-height: 1; }
.actions { display: flex; justify-content: flex-end; }
.actions-split { justify-content: flex-start; gap: 12px; flex-wrap: wrap; }
.actions-inline { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }

/* ---------- ホーム ----------
 * 優先順位：① 次にやること（唯一の濃いボタン）② 単元の進み具合 ③ 項目ごとの確認状況 ④ 今週の学習
 * 今日の学習時間・目標は、上部ナビの「学習時間」画面にまとめる。
 * カードは「今日の学習」と「今週の学習」の2枚。項目ごとの確認状況はカードにせず、細い縦線で3列に分ける。
 */
.view-home { max-width: 1160px; padding-block: 8px 72px; gap: 28px; }
.icon { width: 1.15em; height: 1.15em; flex: none; vertical-align: -0.2em; }
.home { display: grid; gap: clamp(24px, 4vw, 40px); min-width: 0; }
.home h1, .home h2, .greet-title { font-feature-settings: "palt"; }

/* あいさつ＋背景の丘（飾り） */
.greet-line { color: var(--muted); font-size: var(--fs-s); letter-spacing: 0.08em; margin: 0 0 -8px; }

/* 共通の小物 */
.bar { height: 8px; border-radius: 99px; background: var(--track); overflow: hidden; }
.bar span { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent-2), var(--accent)); }
.bar-lg { height: 10px; }
.dash-head { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: var(--fs-m); }
.dash-icon { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); }
.dash-icon .icon { width: 19px; height: 19px; }
.dash-label { font-size: var(--fs-xs); color: var(--muted); font-weight: 700; letter-spacing: 0.06em; display: flex; align-items: center; gap: 6px; }
.btn-link { background: none; border: 0; padding: 8px 0; min-height: 40px; color: var(--accent); font-weight: 700; font-size: var(--fs-s); display: inline-flex; align-items: center; gap: 2px; cursor: pointer; letter-spacing: 0.04em; }
.btn-link .icon { width: 16px; height: 16px; }

/* 1. 今日の学習（1枚のカード）：広い幅（iPad横向きなど）は「次にやること｜単元の進み具合」の2列。
 *    狭い幅では「次にやること」を先にして縦に並べる */
.dash { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0, 1fr); background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: clamp(20px, 3vw, 32px); gap: 24px; }
.dash-col { display: grid; gap: 12px; align-content: start; min-width: 0; }
@media (min-width: 900px) {
  .dash { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 0; }
  .dash-col { padding-inline: clamp(20px, 2.6vw, 36px); }
  .dash-col:first-child { padding-left: 0; }
  .dash-col:last-child { padding-right: 0; }
  .dash-col + .dash-col { border-left: 1px solid var(--line); }
}
@media (max-width: 899px) {
  .dash .hero { padding-bottom: 20px; border-bottom: 1px solid var(--line); }
}
.hero-title { font-size: clamp(1.5rem, 1.1rem + 1.4vw, 1.875rem); line-height: 1.3; overflow-wrap: anywhere; }
.hero-detail { font-size: var(--fs-s); color: var(--muted); overflow-wrap: anywhere; }
.hero-why { font-size: var(--fs-s); color: var(--muted); }
.hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 4px; }
.hero .btn-primary { border-radius: 16px; min-height: 58px; padding-inline: 28px; justify-content: space-between; min-width: min(100%, 300px); box-shadow: var(--glow); }
.hero .btn-primary .icon { width: 20px; height: 20px; }
.hero .btn-quiet .icon { color: var(--accent); }
.hero-due { display: flex; align-items: flex-start; gap: 8px; margin: 0; padding: 12px 14px; border-radius: var(--r-s); background: var(--hold-soft); color: var(--ink); font-size: var(--fs-s); }
.hero-due .icon { color: var(--hold); margin-top: 0.2em; }
.hero-due .num { font-family: var(--font-en); font-size: 1.125rem; margin: 0 2px; }
.hero-done .dash-icon { background: var(--ok-soft); color: var(--ok); }

.unit-col { grid-template-columns: 96px minmax(0, 1fr); column-gap: 18px; align-items: center; }
.unit-col > .path, .unit-col > .dash-fact { grid-column: 1 / -1; }
.unit-tile { width: 96px; height: 96px; border-radius: 16px; display: grid; place-content: center; text-align: center; line-height: 1.1;
  background: linear-gradient(160deg, var(--accent-2), var(--accent)); color: var(--accent-ink); box-shadow: var(--glow); }
.unit-tile [lang="en"] { font-family: var(--font-en); font-weight: 700; font-size: 2.125rem; letter-spacing: -0.02em; }
.unit-tile-plus { font-size: var(--fs-xs); font-weight: 700; opacity: 0.9; }
.unit-info { display: grid; gap: 4px; min-width: 0; }
.unit-name { font-size: var(--fs-l); font-weight: 700; line-height: 1.3; }
.unit-sub { font-size: var(--fs-s); color: var(--muted); }
.unit-info .bar { margin-top: 6px; }
.dash-fact { display: flex; align-items: center; gap: 8px; font-size: var(--fs-s); color: var(--muted); padding-top: 12px; border-top: 1px solid var(--line); }
.dash-fact strong { color: var(--ink); }
.dash-fact .num { font-family: var(--font-en); font-size: 1.125rem; }
.path { list-style: none; margin: 4px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); font-size: var(--fs-xs); color: var(--muted); text-align: center; }
.path-step { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.path-step + .path-step::before { content: ""; position: absolute; top: 11px; right: calc(50% + 17px); width: calc(100% - 34px); height: 1px; background: var(--line); }
.path-mark { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); font-family: var(--font-en); font-size: 0.75rem; font-weight: 700; line-height: 1; }
.path-mark .icon { width: 13px; height: 13px; }
.path-step.is-done .path-mark { background: var(--accent-soft); border-color: var(--accent-soft); color: var(--accent); }
.path-step.is-now { color: var(--accent); font-weight: 700; }
.path-step.is-now .path-mark { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.time-big { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 4px; line-height: 1; margin-top: 6px; }
/* 学習時間画面：今日の実績と目標・進捗バー・目標を変更 を1枚にまとめる */
.view-time { max-width: 820px; }
.time-card { display: grid; gap: 14px; background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: clamp(20px, 3vw, 32px); min-width: 0; }
.time-card .bar { margin-top: 4px; }
.time-goal-edit { display: grid; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
.time-goal-edit .field-note { margin-top: 0; }
.time-big .num { font-family: var(--font-en); font-size: 3rem; font-weight: 700; letter-spacing: -0.02em; }
.time-unit { font-size: var(--fs-l); font-weight: 700; }
.time-of { font-size: var(--fs-m); color: var(--muted); margin-left: 2px; }
.time-left { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: var(--fs-s); color: var(--muted); margin-top: 6px; }
.time-left .icon { color: var(--muted); }
.time-left strong { color: var(--ink); font-family: var(--font-en); font-size: 1.125rem; }
.time-left .btn-text { margin-left: auto; }

/* 2. 項目ごとの確認状況（3列） */
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; margin-bottom: 14px; }
.section-head h2 { font-size: var(--fs-l); letter-spacing: 0.04em; margin-right: auto; }
.skills-alert { font-size: var(--fs-s); font-weight: 700; color: var(--ng); }
.skill-cols { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
@media (min-width: 760px) {
  .skill-cols { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; }
  .skill-col { padding-inline: clamp(16px, 2.2vw, 28px); }
  .skill-col:first-child { padding-left: 0; }
  .skill-col:last-child { padding-right: 0; }
  .skill-col + .skill-col { border-left: 1px solid var(--line); }
}
.skill-col { display: grid; gap: 8px; align-content: start; min-width: 0; }
.tag { justify-self: start; display: inline-block; padding: 3px 12px; border-radius: 8px; font-size: var(--fs-xs); font-weight: 700; letter-spacing: 0.04em; color: var(--chip-ink); }
.tag-1 { background: var(--chip-1); } .tag-2 { background: var(--chip-2); } .tag-3 { background: var(--chip-3); }
.skill-open { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; background: none; border: 0; padding: 4px 0; min-height: 44px; cursor: pointer; text-align: left; }
.skill-open .skill-label { font-size: var(--fs-l); font-weight: 700; }
.skill-open .icon { color: var(--muted); }
@media (hover: hover) { .skill-open:hover .skill-label { color: var(--accent); } }
.skill-plain { font-size: var(--fs-s); color: var(--muted); padding-bottom: 6px; }
.ach-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.ach-list li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: var(--fs-s); }
.ach-dot { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--muted); flex: none; }
.ach-list li.is-on .ach-dot { background: var(--accent-2); border-color: var(--accent-2); color: var(--accent-ink); }
.ach-dot .icon { width: 14px; height: 14px; }
.skill-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; font-size: var(--fs-s); padding-top: 4px; }
.skill-due { color: var(--muted); white-space: nowrap; }
.skills-note { margin-top: 12px; }

/* 4. 今週の学習 */
.week { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px 24px; align-items: center; background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: clamp(18px, 3vw, 28px); }
.week h2 { font-size: var(--fs-m); display: flex; align-items: center; gap: 8px; }
.week h2 .icon { color: var(--accent); }
.week-cell { display: grid; gap: 4px; min-width: 0; }
.week-cell .muted { font-size: var(--fs-s); }
.week-title { grid-column: 1 / -1; }
.week-big { font-weight: 700; font-size: var(--fs-m); line-height: 1.1; }
.week-big .num { font-family: var(--font-en); font-size: 2rem; margin-right: 2px; }
.week-cell .bar { margin-top: 6px; }
.week-streak .icon { color: var(--flame); width: 18px; height: 18px; }
.week-bars { grid-column: 1 / -1; list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; height: 112px; }
.wb { display: grid; grid-template-rows: minmax(0, 1fr) auto; justify-items: center; gap: 6px; min-width: 0; }
.wb-track { position: relative; width: min(100%, 30px); height: 100%; }
.wb-fill { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 6px 6px 3px 3px; background: var(--accent-soft); }
.wb.has .wb-fill { background: color-mix(in srgb, var(--accent-2) 45%, var(--accent-soft)); }
.wb.is-today .wb-fill { background: linear-gradient(180deg, var(--accent-2), var(--accent)); }
.wb.is-future .wb-fill { background: transparent; border: 1.5px dashed var(--line); }
.wb-name { font-size: var(--fs-xs); color: var(--muted); }
.wb.is-today .wb-name { color: var(--accent); font-weight: 700; }
}
@media (max-width: 600px) {
  .view-home { padding-top: 0; gap: 20px; }
  .hero .btn-primary { width: 100%; }
  .unit-col { grid-template-columns: 72px minmax(0, 1fr); }
  .unit-tile { width: 72px; height: 72px; border-radius: 14px; }
  .unit-tile [lang="en"] { font-size: 1.625rem; }
  .time-big .num { font-size: 2.5rem; }
}
.home .hero-detail, .home .hero-why, .skill-plain { text-wrap: pretty; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 20px clamp(16px, 3vw, 28px); min-width: 0; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; margin-bottom: 12px; }
.panel-head h2 { font-size: var(--fs-l); }
.panel-note { font-size: var(--fs-xs); color: var(--muted); }
.skill-list, .att-list, .plan-list, .q-list, .result-list, .plain-list, .evidence, .sched-history { list-style: none; margin: 0; padding: 0; }
.skill-row {
  width: 100%; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.4fr) auto; gap: 12px; align-items: center;
  background: none; border: 0; border-top: 1px solid var(--line); padding: 14px 4px; text-align: left; cursor: pointer; min-height: 60px;
}
.skill-list li:first-child .skill-row { border-top: 0; }
.skill-row:hover { background: var(--surface-2); }
.skill-name { display: grid; }
.skill-label { font-weight: 700; }
.skill-term { font-size: var(--fs-xs); color: var(--muted); margin-left: 0; font-weight: 400; }
h2 .skill-term { margin-left: 10px; }
.skill-status { display: flex; align-items: center; gap: 10px; font-size: var(--fs-s); }
.skill-due { font-size: var(--fs-s); color: var(--muted); white-space: nowrap; }
.meter { display: inline-flex; gap: 3px; flex: none; }
.meter-seg { width: 14px; height: 14px; border-radius: 3px; border: 2px solid var(--accent); background: transparent; }
.meter-seg.on { background: var(--accent); }

/* ---------- 単元 ---------- */
.unit-head { display: flex; gap: 16px; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
.unit-head h2 { font-size: var(--fs-xl); margin: 4px 0; }
.steps { list-style: none; padding: 0; margin: 20px 0 12px; display: flex; gap: 8px; flex-wrap: wrap; }
.steps li { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 99px; background: var(--surface-2); font-size: var(--fs-s); }
.steps li.done { background: var(--ok-soft); color: var(--ok); font-weight: 700; }
.step-mark { width: 20px; height: 20px; border-radius: 50%; border: 2px solid currentColor; display: inline-grid; place-items: center; font-size: 0.75rem; }
.unit-scope { font-size: var(--fs-s); color: var(--muted); }
/* 履歴・復習：単元一覧（単元名のボタン）と単元の詳細 */
.view-history { max-width: 820px; }
.unit-picks { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.unit-pick { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 14px 20px; text-align: left; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); touch-action: manipulation; }
@media (hover: hover) { .unit-pick:hover { border-color: var(--accent); } }
.unit-pick-name { font-size: var(--fs-l); font-weight: 700; margin-right: auto; min-width: 0; overflow-wrap: anywhere; }
.unit-pick-due { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; background: var(--hold-soft); color: var(--hold); font-size: var(--fs-s); font-weight: 700; white-space: nowrap; }
.unit-pick > .icon { color: var(--muted); }
.review-panel { display: grid; gap: 12px; }
.review-panel .panel-head { margin-bottom: 0; }
.review-now { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; }
.review-count { font-weight: 700; }
.review-count .num { font-family: var(--font-en); font-size: 2rem; margin-right: 4px; }
.review-next { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.review-next .icon { color: var(--accent); align-self: center; }
.review-next strong { font-size: var(--fs-l); }
.review-skills { display: grid; gap: 12px; }
.review-skills > .skill-panel { margin-top: 12px; box-shadow: none; }
.skill-panel-head h3 { font-size: var(--fs-l); }
.section-title { font-size: var(--fs-l); margin-bottom: 12px; }
@media (max-width: 520px) { .review-now .btn-primary { width: 100%; } }
/* 単元で扱う範囲：既存の用法ラベル（タグ）だけで示す */
.unit-range { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0; }
.unit-range .label { margin-right: 4px; }
.later { color: var(--muted); padding: 0 4px; }
.later h2 { font-size: var(--fs-m); margin-bottom: 4px; }

/* ---------- 問題画面 ---------- */
.q-progress { display: grid; grid-template-columns: auto auto 1fr; align-items: center; gap: 12px; }
.q-type { font-weight: 700; color: var(--accent); }
.q-count { font-family: var(--font-en); font-variant-numeric: tabular-nums; color: var(--muted); }
.q-bar { height: 8px; background: var(--track); border-radius: 99px; overflow: hidden; }
.q-bar .q-bar-fill { display: block; height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); border-radius: 99px; transition: width 0.45s ease-out; }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: clamp(20px, 4vw, 40px); display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.q-instruction { color: var(--muted); font-size: var(--fs-s); }
.q-ja { font-size: var(--fs-l); font-weight: 700; }
.q-question { font-size: var(--fs-l); }
.q-sentence { font-size: clamp(1.5rem, 3.4vw, 2rem); line-height: 1.6; overflow-wrap: anywhere; }
.blank { display: inline-block; min-width: 5.5em; border-bottom: 3px solid var(--accent); margin: 0 0.25em; text-align: center; color: var(--accent); font-weight: 700; }
.blank.filled { background: var(--accent-soft); border-radius: 4px 4px 0 0; padding: 0 0.3em; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.choice {
  display: flex; align-items: center; gap: 12px; text-align: left;
  min-height: 60px; padding: 12px 16px; border-radius: var(--r-s);
  background: var(--surface); border: 2px solid var(--line); cursor: pointer; font-size: var(--fs-m); touch-action: manipulation;
}
.choice[lang="en"] { font-size: 1.25rem; }
@media (hover: hover) { .choice:hover:not(.choice-result) { border-color: var(--accent); } }
.choice.is-selected { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.choice-dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--muted); flex: none; }
.choice.is-selected .choice-dot { border-color: var(--accent); background: radial-gradient(circle, var(--accent) 0 45%, transparent 50%); }
.answer-area { min-width: 0; }
.field-label { display: block; font-size: var(--fs-s); font-weight: 700; margin-bottom: 6px; }
.text-input { width: 100%; font-size: 1.375rem; padding: 14px 16px; border-radius: var(--r-s); border: 2px solid var(--line); background: var(--surface); color: var(--ink); resize: vertical; font-family: var(--font-en); }
.text-input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.text-input.mono { font-family: var(--font-mono); font-size: var(--fs-xs); }
.field-note { font-size: var(--fs-xs); color: var(--muted); margin-top: 6px; }

/* 並び替え */
.order-answer {
  min-height: 84px; padding: 12px; border-radius: var(--r-s); border: 2px dashed var(--accent);
  background: var(--accent-soft); display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
}
.order-placeholder { color: var(--muted); font-size: var(--fs-s); font-family: var(--font-ja); }
.order-pool { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; min-height: 56px; }
.chip {
  font-family: var(--font-en); font-size: 1.25rem; min-height: 52px; padding: 8px 16px; border-radius: var(--r-s);
  background: var(--surface); border: 2px solid var(--line); cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none;
}
.order-answer .chip { border-color: var(--accent); }
.chip-ghost { opacity: 0.25; border-style: dashed; cursor: default; display: inline-flex; align-items: center; }
.chip-lifted { opacity: 0.35; }
.chip-drag { position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none; box-shadow: 0 8px 24px rgba(0,0,0,0.2); border-color: var(--accent); }
.order-tools { margin-top: 6px; }

.hint { background: var(--hold-soft); color: var(--ink); border-left: 4px solid var(--hold); padding: 12px 16px; border-radius: 0 var(--r-s) var(--r-s) 0; }
.helpers { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-top: 16px; border-top: 1px solid var(--line); }
.helpers-note { font-size: var(--fs-xs); color: var(--muted); flex-basis: 100%; }

.your-answer { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: var(--fs-l); }
.verdict { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.verdict .badge { font-size: var(--fs-m); padding: 6px 14px; }
.feedback-note { background: var(--surface-2); padding: 12px 16px; border-radius: var(--r-s); }
.reason { display: grid; gap: 12px; border-top: 1px solid var(--line); padding-top: 16px; }
.reason .choices { grid-template-columns: 1fr; }
.reason-q { font-size: var(--fs-l); font-weight: 700; }
.reason-note { font-size: var(--fs-xs); color: var(--muted); }
.reason-result { background: var(--surface-2); padding: 12px 16px; border-radius: var(--r-s); display: grid; gap: 4px; }
.reason-correct { color: var(--muted); font-size: var(--fs-s); }

/* 正誤表示（色＋記号＋文字） */
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: var(--fs-xs); font-weight: 700; border: 1.5px solid currentColor; white-space: nowrap; }
.badge-mark { font-size: 1.1em; line-height: 1; }
.tone-ok { color: var(--ok); background: var(--ok-soft); }
.tone-ng { color: var(--ng); background: var(--ng-soft); }
.tone-hold { color: var(--hold); background: var(--hold-soft); }
.flag { display: inline-block; font-size: var(--fs-xs); padding: 2px 8px; border-radius: 4px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.flag-warn { color: var(--ng); }

/* 解説 */
.explain { border-top: 1px solid var(--line); padding-top: 20px; display: grid; gap: 12px; }
.ex-answer { font-size: clamp(1.375rem, 3vw, 1.75rem); line-height: 1.6; overflow-wrap: anywhere; }
mark { background: linear-gradient(transparent 45%, var(--marker) 45%); color: inherit; padding: 0 2px; }
.ex-translation { font-size: var(--fs-l); }
.ex-also { font-size: var(--fs-s); color: var(--muted); }
.ex-map { list-style: none; margin: 4px 0; padding: 0; display: grid; gap: 6px; }
.ex-map li { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px 14px; border-radius: var(--r-s); background: var(--surface-2); }
.ex-map li.is-mark { background: var(--marker); color: var(--marker-ink); font-weight: 700; }
.ex-en { font-size: 1.125rem; overflow-wrap: anywhere; }
.ex-arrow { color: var(--muted); }
.ex-map li.is-mark .ex-arrow { color: inherit; }
.ex-point { border-left: 4px solid var(--accent); padding-left: 14px; }
.ex-term { font-size: var(--fs-s); color: var(--muted); }

/* 結果・まとめ */
.result-list { display: grid; gap: 12px; }
.result-row { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px 20px; }
.result-main { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; }
.result-no { font-family: var(--font-en); font-weight: 700; color: var(--muted); font-size: var(--fs-l); width: 1.5em; }
.result-body { display: grid; gap: 4px; min-width: 0; }
.result-q { font-weight: 700; }
.result-format { font-size: var(--fs-xs); color: var(--muted); margin-left: 10px; font-weight: 400; }
.result-ans { font-size: var(--fs-l); overflow-wrap: anywhere; }
.result-tags, .att-tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.result-detail { margin-top: 10px; }
summary { cursor: pointer; color: var(--accent); font-size: var(--fs-s); min-height: 40px; display: flex; align-items: center; }

.att-row {
  width: 100%; display: grid; grid-template-columns: 8.5em minmax(0, 1fr) auto; gap: 12px; align-items: center;
  background: none; border: 0; border-top: 1px solid var(--line); padding: 12px 4px; text-align: left; cursor: pointer; min-height: 56px;
}
.att-list > li:first-child .att-row, .q-list > li:first-child .att-row { border-top: 0; }
.att-row:hover { background: var(--surface-2); }
.att-type { font-size: var(--fs-xs); font-weight: 700; color: var(--accent); display: grid; }
.att-type .muted { font-weight: 400; }
.att-q { min-width: 0; display: grid; }
.att-ans { font-size: var(--fs-s); overflow-wrap: anywhere; }
ul.att-list.panel { padding-block: 8px; }

.plan-list li { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) minmax(0, 1.2fr); gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); align-items: center; }
.plan-list li:first-child { border-top: 0; }
.plan-name { display: grid; }
.plan-status { display: flex; gap: 10px; align-items: center; font-size: var(--fs-s); }
.plan-due { display: grid; font-size: var(--fs-s); }
.plan-why { color: var(--muted); font-size: var(--fs-xs); }

/* 履歴 */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; padding: 12px 18px; cursor: pointer; color: var(--muted); min-height: 48px; }
.tab.is-current { color: var(--accent); font-weight: 700; box-shadow: inset 0 -3px 0 var(--accent); }
.skill-panel { display: grid; gap: 12px; }
.skill-panel-head { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.skill-panel-head h2 { font-size: var(--fs-l); }
.skill-panel-due { display: grid; text-align: right; }
.status-box { background: var(--surface-2); border-radius: var(--r-s); padding: 14px 16px; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; }
.status-box .evidence { grid-column: 1 / -1; font-size: var(--fs-s); color: var(--muted); }
.evidence li::before, .plain-list li::before { content: "・"; }
.sched-history li { font-size: var(--fs-s); padding: 4px 0; }
.back { align-self: flex-start; }
.table-wrap { overflow-x: auto; }
.att-table { width: 100%; border-collapse: collapse; font-size: var(--fs-s); }
.att-table th, .att-table td { text-align: left; padding: 10px 8px; border-top: 1px solid var(--line); vertical-align: top; }
.att-table th { font-size: var(--fs-xs); color: var(--muted); border-top: 0; }
.att-table td .muted { display: block; font-size: var(--fs-xs); }

/* 設定 */
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.seg-item { min-height: 48px; min-width: 64px; padding: 8px 16px; border-radius: var(--r-s); border: 2px solid var(--line); background: var(--surface); cursor: pointer; }
.seg-item.is-current { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; color: var(--accent); }
.plain-list { display: grid; gap: 4px; font-size: var(--fs-s); }
.panel.dev { border-style: dashed; }
.panel.danger h2 { color: var(--ng); }

/* ---------- 画面幅による調整 ---------- */
@media (max-width: 760px) {
  .skill-row { grid-template-columns: minmax(0, 1fr) auto; }
  .skill-status { grid-column: 1 / -1; grid-row: 2; }
  .plan-list li { grid-template-columns: 1fr; gap: 4px; }
  .att-row { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .skill-panel-due { text-align: left; }
}
@media (max-width: 520px) {
  .choices { grid-template-columns: 1fr; }
  .ex-map li { grid-template-columns: 1fr; gap: 2px; }
  .ex-arrow { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* ---------- 確認状況（実績＋いまの状態）・確認問題の案内 ---------- */
.status-inline { display: flex; align-items: center; gap: 10px; font-size: var(--fs-s); min-width: 0; }
.status-text { overflow-wrap: anywhere; }
.tone-text-recheck { color: var(--ng); font-weight: 700; }
.tone-text-note { color: var(--hold); font-weight: 700; }
.tone-text-ok { color: var(--ok); }
.tone-text-none { color: var(--muted); }
.status-grid { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 0; background: var(--surface-2); border-radius: var(--r-s); padding: 14px 16px; align-items: center; }
.status-grid dt { font-size: var(--fs-xs); color: var(--muted); font-weight: 700; }
.status-grid dd { margin: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.issue-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: var(--fs-s); }
.issue-list li { border-left: 4px solid var(--ng); padding: 6px 12px; display: grid; }
.next-note { background: var(--accent-soft); border-radius: var(--r-s); padding: 12px 16px; }
.basics { border: 2px solid var(--accent); border-radius: var(--r-s); padding: 14px 16px; display: grid; gap: 8px; }
.session-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.verdict .label { margin-right: 0; }
details.panel > summary { font-size: var(--fs-s); }
details.panel > p { margin-top: 8px; }
@media (max-width: 760px) {
  .status-inline { grid-column: 1 / -1; grid-row: 2; }
  .status-grid { grid-template-columns: 1fr; }
}

/* ---------- 問題画面の操作への反応（表示だけ。採点・保存には関係しない） ---------- */
/* 押した瞬間の手ごたえ（タップ・クリック共通） */
.choice, .btn-primary, .btn-quiet, .btn-toggle, .chip { transition: transform 0.08s ease-out, background-color 0.15s ease-out, border-color 0.15s ease-out; }
.choice:active:not(.choice-result), .btn-primary:active:not(:disabled), .btn-quiet:active:not(:disabled), .btn-toggle:active, .chip:active { transform: scale(0.98); }
/* 選択中：枠と背景の色＋丸の中が埋まる（採点結果とは別の見た目） */
.choice-dot { transition: border-color 0.15s ease-out; position: relative; }

    target: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/>',
    lock: '<rect x="5.5" y="10.5" width="13" height="9.5" rx="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/>',
    flame: '<path d="M12 20.5c-3.6 0-6-2.4-6-5.6 0-3.4 2.6-5.2 3.6-8.4 1.6 1.4 2 3 2 4.4 1-.6 1.8-1.8 2-3.4 2 1.8 4.4 4.2 4.4 7.4 0 3.2-2.4 5.6-6 5.6z"/>'
  };
  function icon(name) {
    return '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + ICON_PATH[name] + '</svg>';
  }

  /** 単元の流れ（初回診断 → 解説と類題 → 後日の復習）。記録された事実だけから作る */
  function unitSteps(task) {
    var u = P.unitState(state, BANK.unit.id);
    var s = state.activeSession;
    var reviewed = (state.sessions || []).some(function (x) { return x.type === 'review'; });
    var cur = { diagnostic: 0, practice: 1, review: 2 }[task.kind];
    if (task.kind === 'resume') { cur = s ? { diagnostic: 0, practice: 1, review: 2 }[s.type] : -1; if (cur === undefined) cur = -1; }
    var steps = [
      { label: '初回診断', done: !!u.diagnosticDoneAt },
      { label: '解説と類題', done: !!u.practiceDoneAt, skipped: !u.practiceDoneAt && !!u.practiceSkippedAt },
      { label: '後日の復習', done: reviewed }
    ];
    return { steps: steps, cur: cur, done: steps.filter(function (x) { return x.done; }).length };
  }
  /**
   * 単元の現在地（3段階を1つの表示で）。色だけでなく、記号と文字でも見分けられる：
   *   いまここ … 番号＋太字＋「いまここ」／ 済み … ✓＋「済み」／ 見送り … －（破線の丸）＋「見送り」／ まだ … 番号＋「まだ」
   */
  function unitPath(us) {
    return '<ol class="path" aria-label="この単元の流れ">' + us.steps.map(function (st, i) {
      var now_ = i === us.cur;
      var kind = now_ ? 'now' : st.done ? 'done' : st.skipped ? 'skipped' : 'todo';
      var label = { now: 'いまここ', done: '済み', skipped: '見送り', todo: 'まだ' }[kind];
      var mark = kind === 'done' ? icon('check') : kind === 'skipped' ? '－' : '<span class="num">' + (i + 1) + '</span>';
      return '<li class="path-step is-' + kind + '"' + (now_ ? ' aria-current="step"' : '') + '>' +
        '<span class="path-mark" aria-hidden="true">' + mark + '</span>' +
        '<span class="path-label">' + st.label + '</span><span class="path-state">' + label + '</span></li>';
    }).join('') + '</ol>';
  }

  /** ホームの項目の一行：いまの状態（既存の判定 mastery.analyze から短いことばに） */
  function skillLineStatus(st) {
    if (!st.attemptCount) return { cls: 'none', text: '未回答', mark: '—' };
    if (st.needsRecheck) return { cls: 'recheck', text: '要確認', mark: '！' };
    if (st.unsure) return { cls: 'unsure', text: '自信なし', mark: '△' };
    if (st.achievement > 0) return { cls: 'ok', text: '順調', mark: '✓' };
    return { cls: 'wip', text: '確認中', mark: '…' };
  }

  function monthDay(ms) { var d = new Date(ms); return (d.getMonth() + 1) + '月' + d.getDate() + '日'; }
  function shortDate(ms) { var d = new Date(ms); return (d.getMonth() + 1) + '/' + d.getDate() + '（' + '日月火水木金土'.charAt(d.getDay()) + '）'; }

  /** 確認実績の3段階（mastery.js の ACHIEVEMENTS と同じ定義を、短いことばで） */
  var ACH_SHORT = ['自力で1問正解', '別の問題でも自力で正解', '後日の復習でも正解'];

  function renderHome() {
    var t = now();
    var task = P.homeTask(state, BANK, t);
    var due = P.dueReviews(state, BANK, t);
    var next = P.nextReviewDate(state, BANK);
    var statuses = BANK.skills.map(function (sk) { return M.analyze(sk.id, state.attempts, BANK); });
    var recheckN = statuses.filter(function (s) { return s.needsRecheck; }).length;
    var isTrialResume = task.kind === 'resume' && state.activeSession && state.activeSession.type === 'trial';
    var unit = isTrialResume ? (EA.banks[state.activeSession.unitId] || BANK).unit : BANK.unit;
    var us = unitSteps(task);

    var h = '<div class="home">';

    // あいさつは小さな一行だけ（課題名がホームで最も大きい見出し）
    h += '<p class="greet-line">' + (state.attempts.length ? 'おかえりなさい' : 'ようこそ') + '</p>';

    // 1. 次にやること ｜ 単元の進み具合（1枚のカード）
    // 復習の予定は、日付が決まってから出す（予定がない間は行ごと省く）。期限を迎えたら件数と、復習を始められるときは「次にやること」のボタン
    var reviewFact = '';
    if (due.length && task.kind === 'resume') {
      reviewFact = ''; // 「続きから再開」の下の案内（期限を迎えた復習が◯件）と重ねない
    } else if (due.length) {
      reviewFact = '<div class="dash-fact is-due">' + icon('calendar') + '<span>次の復習<strong class="fact-date">今日</strong><span class="fact-sub">' + due.length + '件</span></span>' +
        (task.kind === 'review' ? '' : '<span class="fact-note">解説と類題のあとに始められます</span>') + '</div>';
    } else if (next) {
      reviewFact = '<p class="dash-fact">' + icon('calendar') + '<span>次の復習<strong class="fact-date">' + esc(monthDay(next)) + '</strong></span></p>';
    }

    h += '<section class="dash" aria-label="今日の学習">';
    h += '<div class="dash-col hero hero-' + task.kind + '">' +
      '<p class="dash-head"><span class="dash-icon">' + icon(task.kind === 'done' ? 'check' : task.kind === 'review' ? 'repeat' : 'play') + '</span>' +
        (task.kind === 'done' ? '今日の課題' : '次にやること') + '</p>' +
      '<div class="hero-title-row"><h1 class="hero-title" id="hero-title">' + esc(task.title) + '</h1>' +
        (task.help ? '<button type="button" class="btn-help" data-act="toggle-help" aria-expanded="false" aria-controls="hero-help">' +
          '<span class="help-mark" aria-hidden="true">?</span>' + esc(task.help.label) + '</button>' : '') + '</div>' +
      (task.help ? '<div class="collapse" id="hero-help"><div class="collapse-inner"><p class="hero-help-text">' + esc(task.help.text) + '</p></div></div>' : '') +
      (task.detail ? (task.detailKind === 'size'
        ? '<p class="hero-size">' + icon(task.detailIcon || 'clock') + '<span>' + esc(task.detail) + '</span></p>'
        : '<p class="hero-detail">' + esc(task.detail) + '</p>') : '') +
      (task.why ? '<p class="hero-why">' + esc(task.why) + '</p>' : '') +
      '<div class="hero-actions">' +
      (task.cta ? '<button type="button" class="btn-primary btn-lg hero-cta" data-act="task-' + task.kind + '">' + esc(task.cta) + icon('chevron') + '</button>'
        : '<button type="button" class="btn-quiet hero-cta" data-go="history">' + icon('book') + '解説と回答を見返す</button>') +
      '</div>' +
      (task.kind === 'resume' && task.dueWaiting ? '<p class="hero-due" role="note">' + icon('calendar') +
        '<span>復習 <strong class="num">' + task.dueWaiting + '</strong>件が待っています（この学習のあとに始められます）</span></p>' : '') +
      '</div>';

    h += '<div class="dash-col unit-col">' +
      '<div class="unit-tile" aria-hidden="true"><span lang="en">to</span><span class="unit-tile-plus">＋動詞</span></div>' +
      '<div class="unit-info"><p class="dash-label">単元</p><p class="unit-name">' + esc(unit.title) + '</p>' +
      (isTrialResume ? '<p class="unit-sub">試作（確認状況・復習予定には反映しません）</p>' : '') +
      '</div>' +
      (isTrialResume ? '' : unitPath(us)) +
      reviewFact +
      '</div>';

    h += '</section>';

    // 2. 項目ごとの確認状況：1項目1行（用法名｜いまの状態｜これまでの実績｜次の復習）。押すと「履歴・復習」の項目へ
    var today0 = U.startOfDay(t);
    h += '<section class="skills-panel" aria-labelledby="skills-title"><div class="section-head"><h2 id="skills-title">項目ごとの確認状況</h2>' +
      '<button type="button" class="btn-link" data-go="history">履歴・復習を見る' + icon('chevron') + '</button></div>' +
      '<ul class="skill-lines">' + BANK.skills.map(function (sk, i) {
        var st = statuses[i], sch = state.schedule[sk.id], ls = skillLineStatus(st);
        var dueToday = sch && sch.dueAt <= today0;
        var dueText = !sch ? '復習は未定' : dueToday ? '復習は今日' : '復習は' + U.relDay(sch.dueAt, t);
        return '<li><button type="button" class="skill-line" data-act="skill" data-skill="' + sk.id + '" aria-label="' + esc(sk.term + '：' + ls.text + '・これまでの実績 ' + st.achievement + ' / 3・' + dueText + '（詳しく見る）') + '">' +
          '<span class="skill-line-term">' + esc(sk.term) + '</span>' +
          '<span class="skill-line-status st-' + ls.cls + '"><span aria-hidden="true">' + ls.mark + '</span>' + ls.text + '</span>' +
          '<span class="skill-line-ach">' + achievementMeter(st.achievement) + '実績 ' + st.achievement + '/3</span>' +
          '<span class="skill-line-due' + (dueToday ? ' is-today' : '') + '">' + dueText + '</span>' +
          icon('chevron') + '</button></li>';
      }).join('') + '</ul>' +
      '<p class="panel-note skills-note">実績 ＝ これまでの確認（アプリ内の記録で、習得の保証ではありません）。項目を押すと詳しい実績を確認できます。</p></section>';

    return h + '</div>';
  }


  /* ================= 画面：単元一覧 ================= */
  function renderUnits() {
    var u = P.unitState(state, BANK.unit.id);
    var steps = [
      ['初回診断', !!u.diagnosticDoneAt],
      ['解説と類題', !!u.practiceDoneAt],
      ['1回目の復習', state.sessions.some(function (s) { return s.type === 'review'; })]
    ];
    var canSelf = !!u.diagnosticDoneAt; // 初回の学習（初回診断）を終えた単元だけ
    var selfOpen = canSelf && !!view.params.selfOpen;
    return '<h1 class="page-title">単元</h1>' +
      '<section class="panel unit-card"><div class="unit-head"><div><p class="eyebrow">利用できます</p><h2>' + esc(BANK.unit.title) + '</h2>' +
      '<p>' + esc(BANK.unit.description) + '</p></div>' +
      '<div class="unit-btns"><button type="button" class="btn-primary" data-go="home">ホームの課題へ</button>' +
      (LV1 ? '<button type="button" class="btn-quiet" data-act="lv1-start"' + (state.activeSession ? ' disabled aria-describedby="lv1-busy"' : '') + '>' + icon('play') + 'Lv1を練習する（' + lv1Count() + '問）</button>' : '') +
      (canSelf ? '<button type="button" class="btn-quiet" data-act="self-open" aria-expanded="' + selfOpen + '" aria-controls="self-practice">' + icon('repeat') + 'もう一度練習する</button>' : '') +
      '</div></div>' +
      (LV1 && state.activeSession ? '<div class="lv1-busy" id="lv1-busy"><p class="unit-scope">途中の学習が保存されているため、Lv1の練習はいま始められません（途中の学習を上書きしないため）。続きを最後まで進めてから始めてください。</p>' +
        '<div class="actions-inline"><button type="button" class="btn-primary" data-act="task-resume">途中の学習を再開</button></div></div>' : '') +
      (selfOpen ? selfPracticeHtml(BANK) : '') +
      '<ol class="steps">' + steps.map(function (s) { return '<li class="' + (s[1] ? 'done' : '') + '"><span class="step-mark" aria-hidden="true">' + (s[1] ? '✓' : '') + '</span>' + s[0] + '<span class="sr">' + (s[1] ? '（済み）' : '（まだ）') + '</span></li>'; }).join('') + '</ol>' +
      // 扱う範囲は既存の用法ラベルで示す（詳しい範囲の説明 scopeNote は問題集に残し、出題範囲は変えない）
      '<p class="unit-range"><span class="label">扱う範囲</span>' + BANK.skills.map(function (sk, i) {
        return '<span class="tag tag-' + (i + 1) + '">' + esc(sk.term) + '</span>';
      }).join('') + '</p></section>' +
      trialUnitsHtml() +
      '<section class="later"><h2>今後追加する予定の単元</h2><p>動名詞・比較・関係代名詞などを予定しています。まだ利用できません。</p></section>';
  }

  /**
   * 「もう一度練習する」：範囲を選んで、復習予定日を待たずに練習を始める。
   * 途中の学習が保存されているときは、上書きしないよう始められない（再開へ案内する）。
   */
  function selfPracticeHtml(bank) {
    var ranges = P.selfPracticeRanges(bank);
    var sel = view.params.selfRange || 'all';
    var n = P.selfPracticeQuestions(state, bank, sel).length;
    var busy = !!state.activeSession;
    return '<div class="self-practice" id="self-practice">' +
      '<p class="field-label" id="self-range-label">練習する範囲</p>' +
      '<div class="seg" role="radiogroup" aria-labelledby="self-range-label">' + ranges.map(function (r) {
        var on = r.id === sel;
        return '<button type="button" role="radio" aria-checked="' + on + '" class="seg-item' + (on ? ' is-current' : '') + '" data-act="self-range" data-range="' + esc(r.id) + '">' + esc(r.label) + '</button>';
      }).join('') + '</div>' +
      '<p class="field-note">' + n + '問。しばらく解いていない問題から選びます。自分で始めた練習として履歴に残し、確認状況・復習予定は変えません。</p>' +
      (busy ? '<p class="toast toast-error" role="note">途中の学習が保存されているため、いまは始められません（途中の学習を上書きしないため）。続きを最後まで進めてから始めてください。</p>' +
        '<div class="actions-inline"><button type="button" class="btn-primary" data-act="task-resume">途中の学習を再開</button></div>'
        : '<div class="actions-inline"><button type="button" class="btn-primary" data-act="self-start"' + (n ? '' : ' disabled') + '>練習をはじめる' + icon('chevron') + '</button></div>') +
      '</div>';
  }

  function lv1Count() { return LV1 ? LV1.questions.filter(function (x) { return x.status !== 'excluded' && !x.retryFor; }).length : 0; }

  function selfSummaryHtml(rec, atts) {
    var main = atts.filter(function (a) { return !a.retryOf; }), re = atts.filter(function (a) { return a.retryOf; });
    var ok = main.filter(function (a) { return G.isSkillCorrect(a.result); }).length;
    var reOk = re.filter(function (a) { return G.isSkillCorrect(a.result); }).length;
    return '<p class="lead">範囲：' + esc(rec.rangeLabel || '全範囲') + ' ・ ' + main.length + '問中 ' + ok + '問正解' +
      (re.length ? '（解き直し ' + re.length + '問中 ' + reOk + '問正解）' : '') + '。自分で始めた練習として履歴に残しました。確認状況と復習予定は変わりません。</p>' +
      '<section class="panel"><div class="panel-head"><h2>今回の回答</h2></div><ul class="att-list">' + atts.map(function (a) {
        var qq = q(a.questionId);
        return '<li><button type="button" class="att-row" data-act="question" data-q="' + qq.id + '">' +
          '<span class="att-type">' + esc(skill(qq.skill).term) + (a.retryOf ? '<span class="muted">解き直し</span>' : '') + '</span>' +
          '<span class="att-q">' + esc(plain(qq.ja || qq.sentence)) + '</span>' +
          '<span class="att-tags">' + resultBadge(a.result) + '</span></button></li>';
      }).join('') + '</ul></section>' +
      '<div class="actions actions-split"><button type="button" class="btn-primary btn-lg" data-go="home">ホームへ</button>' +
      '<button type="button" class="btn-quiet" data-go="units">' + (rec.practiceSet ? '単元へ' : '単元へ（もう一度練習する）') + '</button></div>';
  }

  /* ================= 画面：問題 ================= */
  function renderSession() {
    var s = state.activeSession;
    if (!s) return renderHome();
    var item = s.items[s.index];
    var total = s.items.length;
    // 進捗＝この学習回で終えた項目の数 ÷ 全項目（既存の定義）。答えを確定して正誤を表示した時点で、その項目を「終えた」に数える
    var done = s.index + (s.current && s.current.index === s.index && s.current.phase === 'feedback' ? 1 : 0);
    var pct = Math.round(done / total * 100);
    var fromPct = progressShown.sessionId === s.id ? progressShown.pct : pct;
    progressShown = { sessionId: s.id, pct: pct };
    var progress = '<div class="q-progress"><span class="q-type">' + esc(s.practiceSet === 'lv1' ? '不定詞Lv1の練習' : SESSION_LABEL[s.type]) + '</span>' +
      '<span class="q-count">' + (s.index + 1) + ' / ' + total + '</span>' +
      '<span class="q-bar" role="progressbar" aria-label="この学習の進み具合（終えた項目）" aria-valuemin="0" aria-valuemax="' + total + '" aria-valuenow="' + done + '">' +
      '<span class="q-bar-fill" data-to="' + pct + '" style="width:' + fromPct + '%"></span></span></div>';

    if (item.kind === 'explain') {
      var qq = q(item.questionId), src = attemptById(item.sourceAttemptId);
      var nextIt = s.items[s.index + 1];
      return progress + '<section class="sheet">' +
        '<p class="eyebrow">診断の問題（' + esc(fmtLabel(qq)) + '）の解説</p>' +
        questionPromptHtml(qq, null) +
        (src ? '<div class="your-answer"><span class="label">あなたの答え</span><span lang="en">' + (src.responseText ? esc(src.responseText) : '（なし）') + '</span>' + resultBadge(src.result) + flagsHtml(src) + '</div>' : '') +
        (src && src.feedback ? '<p class="feedback-note">' + esc(src.feedback) + '</p>' : '') +
        explanationHtml(qq) +
        '<div class="actions"><button type="button" class="btn-primary btn-lg" data-act="next">' +
        (nextIt && nextIt.attemptType === 'retry' ? '答えを隠して解き直す' : nextIt ? '次へ（別の問題で確かめる）' : '次へ') + '</button></div>' +
        '</section>';
    }

    var qq2 = q(item.questionId);
    var cur = S.ensureCurrent(state, SB(), T());
    // 見出しの補足（定型文）。初回診断・確認問題は出さない（診断の案内は1問目の first-note だけ）
    var typeNote = {
      retry: '解説を読んだ直後の解き直しです（類題とは別に記録します）。',
      similar: '単語や場面を変えた類題です。',
      review: '復習です。答えを見ずに思い出してみましょう。',
      trial: '試作の問題です（確認状況・復習予定には反映しません）。',
      self: item.retryOf ? '間違えた問題と同じ形式・同じ用法の、別の問題です。' : '自分で始めた練習です（範囲：' + (s.rangeLabel || '全範囲') + '）。確認状況・復習予定には反映しません。'
    }[item.attemptType] || '';
    // 確認問題は、問題画面の見出しでは「類題」と短く示す（記録・履歴の種類は「確認問題」のまま）
    var typeLabel = s.practiceSet === 'lv1' ? (item.retryOf ? 'Lv1練習・解き直し' : 'Lv1練習') : item.attemptType === 'followup' ? '類題' : TYPE_LABEL[item.attemptType];

    // 初回診断の1問目を初めて開いたときだけ、結果と解説がいつ出るかを短く案内する（そのまま答えられる位置）。
    // 診断を始めた直後だけ firstNoteFor が立つ。途中から再開したとき・再読み込みしたとき・2問目以降では出さない
    var firstDiag = firstNoteFor === s.id && s.type === 'diagnostic' && s.index === 0 && cur.phase === 'answer';
    var body = '<section class="sheet" aria-live="polite">' +
      '<p class="eyebrow">' + esc(typeLabel) + ' ・ ' + esc(fmtLabel(qq2)) + (typeNote ? '<span class="eyebrow-note">' + esc(typeNote) + '</span>' : '') + '</p>' +
      (firstDiag ? '<p class="first-note" role="note">' + icon('clock') + '<span>結果と解説は全問回答後に表示されます</span></p>' : '');

    if (cur.phase === 'answer') {
      body += questionPromptHtml(qq2, cur.draft, { hideJa: qq2.showJa === 'after' }) + '<div class="answer-area" id="answer-area">' + answerControlHtml(qq2, cur) + '</div>';
      if (cur.hintUsed) body += '<div class="hint" role="note"><span class="label">ヒント</span>' + esc(qq2.hint) + '</div>';
      body += '<div class="helpers">' +
        '<button type="button" class="btn-toggle" data-act="unsure" aria-pressed="' + (cur.unsure ? 'true' : 'false') + '">' +
          '<span class="toggle-box" aria-hidden="true">' + (cur.unsure ? '✓' : '') + '</span>自信がない</button>' +
        '<button type="button" class="btn-quiet" data-act="hint"' + (cur.hintUsed ? ' disabled' : '') + '>ヒントを見る</button>' +
        '<button type="button" class="btn-quiet" data-act="giveup">' + giveUpLabel(s) + '</button>' +
        '<span class="helpers-note">「自信がない」「ヒントを見る」は押さなくてかまいません。押しても減点はありません（ヒントを見た場合は「ヒントあり」と記録します）。「' + giveUpLabel(s) + '」を押すと、この問題は「わからない」として記録され、正解には数えられません。' +
          (s.type === 'diagnostic' ? '解説は全問に答えたあとに表示されます。' : '') + '</span>' +
        '</div>' +
        '<div class="actions"><button type="button" class="btn-primary btn-lg" data-act="submit" id="submit-btn"' + (hasDraft(qq2, cur) ? '' : ' disabled') + '>回答を確定</button></div>';
    } else {
      var a = attemptById(cur.attemptId);
      if (cur.phase === 'reason') {
        // 意味の問いに答えるまでは、日本語訳・正答・正誤・解説を出さない。英文と、聞いている部分（太字）だけを示す
        body += reasonAskHtml(qq2, cur);
      } else {
        body += questionPromptHtml(qq2, qq2.format === 'fill' ? a.response : null);
        if (qq2.choices) body += resultChoicesHtml(qq2, a, cur);
        else body += '<div class="your-answer"><span class="label">あなたの答え</span><span lang="en">' + (a.responseText ? esc(a.responseText) : '（わからない）') + '</span></div>';
        body += '<div class="verdict"><span class="label">答え</span>' + resultBadge(a.result) + flagsHtml(a) + '</div>';
        if (a.feedback) body += '<p class="feedback-note">' + esc(a.feedback) + '</p>';
        if (a.reason) body += reasonResultHtml(qq2, a);
        if (a.followUp) {
          body += '<div class="next-note" role="note">' + (a.followUp.added
            ? '<strong>' + (a.followUp.kind === 'retry' ? 'このあと、同じ形式・同じ用法の別の問題で解き直します。' : 'このあと、単語や場面を変えた問題でもう一度確かめます。') + '</strong>'
            : esc(a.followUp.why)) + '</div>';
          if (a.followUp.basics) body += basicsHtml(skill(a.skillId));
        }
        // 構造の段階解説がある問題は、それを解説とする（日本語訳も解説の中で任意に開く）
        body += qq2.structure ? structureHtml(qq2, cur) : collapsibleExplanationHtml(qq2);
        body += '<div class="actions"><button type="button" class="btn-primary btn-lg" data-act="next">' + (s.index + 1 >= total ? '結果を見る' : '次へ') + '</button></div>';
      }
    }
    return progress + body + '</section>';
  }

  /** 英文の中で、意味の問いが聞いている部分を太字＋下線にする（to が複数あっても対象がわかるように） */
  function targetSentenceHtml(sentence, target) {
    var i = target ? sentence.indexOf(target) : -1;
    if (i < 0) return esc(sentence);
    return esc(sentence.slice(0, i)) + '<strong class="reason-target">' + esc(target) + '</strong>' + esc(sentence.slice(i + target.length));
  }

  /** 意味の問い（回答前）：英文＋太字の部分＋短い質問＋3択。選んでから「回答を確定」 */
  function reasonAskHtml(qq, cur) {
    var r = qq.reason;
    return '<div class="reason">' +
      '<p class="eyebrow">意味の問い<span class="eyebrow-note">日本語訳・正誤・解説は、この問いに答えたあとに表示します。</span></p>' +
      '<p class="q-sentence reason-sentence" lang="en">' + targetSentenceHtml(r.sentence, r.target) + '</p>' +
      '<p class="reason-q">' + esc(r.prompt) + '</p>' +
      '<div class="choices" role="radiogroup" aria-label="意味の問いの選択肢">' +
      ordered(r.choices, cur.reasonOrder).map(function (c) {
        var on = cur.reasonDraft === c.id;
        return '<button type="button" role="radio" aria-checked="' + on + '" class="choice' + (on ? ' is-selected' : '') + '" data-act="reason-choose" data-choice="' + c.id + '">' +
          '<span class="choice-dot" aria-hidden="true"></span>' + esc(c.text) + '</button>';
      }).join('') + '</div>' +
      '<div class="actions"><button type="button" class="btn-primary btn-lg" data-act="reason" id="reason-submit"' + (cur.reasonDraft ? '' : ' disabled') + '>回答を確定</button></div>' +
      '</div>';
  }

  /**
   * 意味の問い（回答後）：○×、選んだもの・この文での意味、どの語句とどの語句がどうつながるか、文法用語。
   * 答えたときの文言（a.reason に保存）を使う。問題データの更新前の回答でも、当時の選択肢で表示する。
   */
  function reasonResultHtml(qq, a) {
    var r = a.reason, cur = qq.reason || {};
    var sameVersion = r.reasonVersion && r.reasonVersion === qq.version;
    var answerText = r.answerText, choiceText = r.choiceText;
    if (!answerText || !choiceText) {
      // 古い記録（文言を保存していない）：今の設問か、以前の共通の選択肢から探す
      var pool = (cur.choices || []).concat((EA.banks[a.unitId] && EA.banks[a.unitId].legacyReasonChoices) || []);
      pool.forEach(function (c) { if (!answerText && c.id === (r.answerId || (r.kind === 'role' ? a.skillId : cur.answer))) answerText = c.text; if (!choiceText && c.id === r.choiceId) choiceText = c.text; });
    }
    var chosen = null;
    if (sameVersion) (cur.choices || []).forEach(function (c) { if (c.id === r.choiceId) chosen = c; });
    var h = '<div class="reason-result"><span class="label">意味の問い</span>' +
      '<span>' + (r.correct ? '○ 選んだ意味は合っています。' : '× 選んだ意味とは違います。答えは正解なので、意味をもう一度確かめましょう。') + '</span>';
    if (!r.correct && choiceText) h += '<span class="reason-correct">あなたが選んだもの：' + esc(choiceText) + '</span>';
    if (!r.correct && chosen && chosen.feedback) h += '<span class="reason-correct">' + esc(chosen.feedback) + '</span>';
    if (answerText) h += '<span class="reason-answer">この文では：' + esc(answerText) + '</span>';
    if (sameVersion && cur.link) {
      h += '<div class="reason-link"><p class="reason-link-map" lang="en"><span class="reason-link-head">' + esc(cur.link.head) + '</span>' +
        '<span class="reason-link-arrow" aria-hidden="true">←</span><strong class="reason-target">' + esc(cur.target) + '</strong></p>' +
        '<p>' + esc(cur.link.text) + '</p>' +
        (cur.link.term ? '<p class="ex-term"><span class="label">文法の名前</span>' + esc(cur.link.term) + '</p>' : '') + '</div>';
    }
    if (r.independent === false) h += '<span class="reason-correct">日本語訳や解説を見たあとの回答なので、考え方の参考として記録します。</span>';
    if (!sameVersion) h += '<span class="reason-correct">この回答は以前の版の設問への回答です（確認状況の判定には使いません）。</span>';
    return h + '</div>';
  }

  /** 意味の問いの選択：画面全体を描き直さず、選択状態だけを変える */
  function selectReason(id) {
    var s = state.activeSession;
    if (!s || !s.current || s.current.phase !== 'reason') return;
    s.current.reasonDraft = id;
    var btns = appEl.querySelectorAll('[data-act="reason-choose"]');
    for (var i = 0; i < btns.length; i++) {
      var on = btns[i].getAttribute('data-choice') === id;
      btns[i].classList.toggle('is-selected', on);
      btns[i].setAttribute('aria-checked', on ? 'true' : 'false');
    }
    var b = document.getElementById('reason-submit');
    if (b) b.disabled = false;
    schedulePersist();
  }

  /**
   * 採点後の選択肢：色だけでなく記号と文字で示す。
   *   正答 …「✓ 正解」／ 選んだ誤答 …「× あなたの答え」／ 選んで正解 …「✓ 正解・あなたの答え」
   * 採点後は押せない（選び直しはできない）。
   */
  function resultChoicesHtml(qq, a, cur) {
    var chosen = a.gaveUp ? null : a.response;
    return '<ul class="choices choices-result" aria-label="採点結果">' + ordered(qq.choices, cur.choiceOrder).map(function (c) {
      var isAns = c.id === qq.answer, isMine = c.id === chosen;
      var cls = isAns ? 'is-correct' : (isMine ? 'is-wrong' : 'is-other');
      var tag = isAns && isMine ? '✓ 正解・あなたの答え' : isAns ? '✓ 正解' : isMine ? '× あなたの答え' : '';
      return '<li class="choice choice-result ' + cls + '"' + (qq.format === 'fill' || qq.choicesLang === 'en' ? ' lang="en"' : '') + '>' +
        '<span class="result-icon" aria-hidden="true">' + (isAns ? '✓' : isMine ? '×' : '') + '</span>' +
        '<span class="choice-text">' + rich(c.text) + '</span>' +
        (tag ? '<span class="result-tag" lang="ja">' + tag + '</span>' : '') + '</li>';
    }).join('') + '</ul>' + (a.gaveUp ? '<p class="your-answer"><span class="label">あなたの答え</span>（わからない）</p>' : '');
  }

  /**
   * 開閉できる解説。最初は開いた状態。高さの上限を設けないので長い解説も欠けない。
   * 開閉の動きの途中でも中身は読める・押せる（visibility は閉じ終わったときだけ hidden になる）。
   */
  function collapsibleExplanationHtml(qq) {
    return '<section class="explain-block">' +
      '<button type="button" class="explain-toggle" data-act="toggle-explain" aria-expanded="true" aria-controls="ex-body">' +
      '<span class="explain-toggle-label">解説</span><span class="explain-toggle-state">とじる</span>' +
      '<span class="explain-chevron" aria-hidden="true"></span></button>' +
      '<div class="collapse is-open" id="ex-body"><div class="collapse-inner">' + explanationHtml(qq, { bare: true }) + '</div></div>' +
      '</section>';
  }

  /* ================= 英文構造の段階解説（回答を確定したあとだけ表示） ================= */
  var SX_BRACKETS = { modifier: ['（', '）'], omit: ['（', '）'] };

  function sxState(cur) { return cur.structure || (cur.structure = { open: false, step: 0, translation: false }); }

  function structureHtml(qq, cur) {
    var sv = sxState(cur);
    return '<section class="sx" aria-label="英文構造の段階解説">' +
      '<button type="button" class="btn-quiet sx-open" data-act="sx-toggle" aria-expanded="' + sv.open + '" aria-controls="sx-panel">' +
      (sv.open ? '構造をとじる' : '構造を見る') + '</button>' +
      '<div class="sx-panel" id="sx-panel"' + (sv.open ? '' : ' hidden') + '>' + (sv.open ? structurePanelInner(qq, sv) : '') + '</div></section>';
  }

  function segHtml(sg) {
    if (!sg.role) return '<span class="sx-plain">' + esc(sg.text) + '</span>';
    var b = SX_BRACKETS[sg.role] || ['', ''];
    return '<span class="sx-seg sx-' + sg.role + (sg.isNew ? ' is-new' : '') + '">' +
      '<span class="sx-words" lang="en">' + (b[0] ? '<span class="sx-bracket" aria-hidden="true">' + b[0] + '</span>' : '') + esc(sg.text) +
      (b[1] ? '<span class="sx-bracket" aria-hidden="true">' + b[1] + '</span>' : '') + '</span>' +
      '<span class="sx-label">' + esc(sg.label) + '</span></span>';
  }

  function structurePanelInner(qq, sv) {
    var m = EA.structure.stepModel(qq.structure, sv.step);
    var last = m.index === m.total - 1;
    return '<p class="sx-progress" aria-live="polite"><span class="sx-count">段階 ' + (m.index + 1) + ' / ' + m.total + '</span>' + esc(m.title) + '</p>' +
      '<ol class="sx-steps" aria-hidden="true">' + qq.structure.steps.map(function (s, i) {
        return '<li class="' + (i === m.index ? 'is-current' : i < m.index ? 'is-done' : '') + '"></li>';
      }).join('') + '</ol>' +
      '<p class="sx-sentence">' + m.segments.map(segHtml).join(' ') + '</p>' +
      (m.skeleton ? '<div class="sx-skeleton"><span class="label">骨格</span><p class="sx-sentence sx-sentence-sm">' +
        m.skeleton.map(function (p) { return segHtml({ text: p.text, role: 'skel', label: p.label, isNew: true }); }).join(' ') + '</p></div>' : '') +
      '<p class="sx-text">' + esc(m.text) + '</p>' +
      '<div class="sx-controls">' +
        '<button type="button" class="btn-quiet" data-act="sx-prev" aria-label="前の段階へ"' + (m.index === 0 ? ' disabled' : '') + '>← 前へ</button>' +
        '<button type="button" class="btn-quiet" data-act="sx-next" aria-label="次の段階へ"' + (last ? ' disabled' : '') + '>次へ →</button>' +
        '<button type="button" class="btn-quiet" data-act="sx-restart"' + (m.index === 0 ? ' disabled' : '') + '>最初から</button>' +
      '</div>' +
      '<div class="sx-trans"><button type="button" class="btn-text" data-act="sx-trans" aria-expanded="' + sv.translation + '" aria-controls="sx-trans-text">' +
        (sv.translation ? '日本語訳をかくす' : '日本語訳を見る') + '</button>' +
        '<p id="sx-trans-text" class="sx-trans-text"' + (sv.translation ? '' : ' hidden') + '>' + esc(qq.structure.translation) + '</p></div>';
  }

  /** 構造解説の操作：段階の状態を保存し、解説の部分だけを描き直す（読んでいる位置を動かさない） */
  function structureAction(act) {
    var s = state.activeSession;
    if (!s || !s.current || s.current.phase !== 'feedback') return;
    var qq = q(s.items[s.index].questionId);
    if (!qq || !qq.structure) return;
    var sv = sxState(s.current), total = qq.structure.steps.length;
    var a = attemptById(s.current.attemptId), at = now();
    if (act === 'sx-toggle') { sv.open = !sv.open; if (sv.open) EA.structure.recordView(a, 'open', sv.step, total, at); }
    if (act === 'sx-prev' && sv.step > 0) sv.step--;
    if (act === 'sx-next' && sv.step < total - 1) { sv.step++; EA.structure.recordView(a, 'step', sv.step, total, at); }
    if (act === 'sx-restart') sv.step = 0;
    if (act === 'sx-trans') { sv.translation = !sv.translation; if (sv.translation) EA.structure.recordView(a, 'translation', null, total, at); }
    var section = appEl.querySelector('.sx');
    var tmp = document.createElement('div');
    tmp.innerHTML = structureHtml(qq, s.current);
    section.replaceWith(tmp.firstChild);
    // 押したボタンにフォーカスを戻す（押せなくなったときは、となりの操作へ）
    var focusAct = act;
    if (act === 'sx-next' && sv.step === total - 1) focusAct = 'sx-prev';
    if ((act === 'sx-prev' || act === 'sx-restart') && sv.step === 0) focusAct = 'sx-next';
    var f = appEl.querySelector('[data-act="' + focusAct + '"]');
    if (f && act !== 'sx-toggle') f.focus({ preventScroll: true });
    if (act === 'sx-toggle') appEl.querySelector('[data-act="sx-toggle"]').focus({ preventScroll: true });
    schedulePersist();
  }

  /** 単元一覧の試作の単元 */
  function trialUnitsHtml() {
    return Object.keys(EA.banks).filter(function (k) { return EA.banks[k].unit.trial; }).map(function (k) {
      var b = EA.banks[k];
      return '<section class="panel unit-card"><div class="unit-head"><div><p class="eyebrow">試作（確認状況・復習予定には反映しません）</p><h2>' + esc(b.unit.title) + '</h2>' +
        '<p>' + esc(b.unit.description) + '</p></div>' +
        '<button type="button" class="btn-quiet" data-act="task-trial" data-unit="' + k + '"' + (state.activeSession ? ' disabled' : '') + '>試す（' + b.questions.length + '問）</button></div>' +
        (state.activeSession ? '<p class="unit-scope">途中の学習があるため、ホームで再開するか終えてから試せます。</p>' : '') + '</section>';
    }).join('');
  }

  function trialSummaryHtml(atts) {
    return '<section class="panel"><div class="panel-head"><h2>今回の回答</h2><p class="panel-note">試作の問題です。確認状況・復習予定には反映しません。構造の解説を見たことも、正解や理解の根拠にはしていません。</p></div><ul class="att-list">' +
      atts.map(function (a) {
        var qq = q(a.questionId), v = a.structureView;
        return '<li><button type="button" class="att-row" data-act="question" data-q="' + qq.id + '"><span class="att-type">試作</span>' +
          '<span class="att-q" lang="en">' + esc(qq.sentence) + '<span class="muted">構造の解説：' + (v ? '開いた（' + v.maxStepSeen + ' / ' + v.totalSteps + ' 段階まで' + (v.translationOpened ? '・訳を見た' : '') + '）' : '開いていない') + '</span></span>' +
          '<span class="att-tags">' + resultBadge(a.result) + '</span></button></li>';
      }).join('') + '</ul></section><div class="actions"><button type="button" class="btn-primary btn-lg" data-go="home">ホームへ</button></div>';
  }

  /** 選択肢を、学習回の中で決めた順番（正答の位置が毎回変わる）に並べる */
  function ordered(choices, order) {
    if (!order) return choices;
    var byId = {};
    choices.forEach(function (c) { byId[c.id] = c; });
    var out = order.map(function (id) { return byId[id]; }).filter(Boolean);
    return out.length === choices.length ? out : choices;
  }

  function hasDraft(qq, cur) {
    if (qq.format === 'order') return !!(cur.draft && cur.draft.length === qq.tokens.length);
    if (qq.format === 'ja2en') return !!(cur.draft && cur.draft.trim());
    return !!cur.draft;
  }

  function answerControlHtml(qq, cur) {
    if (qq.format === 'fill' || qq.format === 'meaning') {
      return '<div class="choices" role="radiogroup" aria-label="選択肢">' + ordered(qq.choices, cur.choiceOrder).map(function (c) {
        var on = cur.draft === c.id;
        return '<button type="button" role="radio" aria-checked="' + on + '" class="choice' + (on ? ' is-selected' : '') + '" data-act="choose" data-choice="' + c.id + '"' + (qq.format === 'fill' || qq.choicesLang === 'en' ? ' lang="en"' : '') + '>' +
          '<span class="choice-dot" aria-hidden="true"></span><span class="choice-text">' + rich(c.text) + '</span></button>';
      }).join('') + '</div>';
    }
    if (qq.format === 'order') return '<div id="order-mount" lang="en"></div>';
    if (qq.format === 'ja2en') {
      return '<label class="field-label" for="ja2en-input">英文を入力</label>' +
        '<textarea id="ja2en-input" class="text-input" rows="2" lang="en" autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false" placeholder="ここに英文を書きます">' + esc(cur.draft || '') + '</textarea>' +
        '<p class="field-note">大文字・小文字、余分な空白、文末の「.」の有無は採点に影響しません。登録されていない答えは「採点保留」になり、誤りとはしません。</p>';
    }
    return '';
  }

  /** 選択肢をタップしたとき：画面全体を描き直さず、その場で選択状態だけを変える（すぐに反応が見えるように） */
  function selectChoice(id) {
    var s = state.activeSession;
    if (!s || !s.current || s.current.phase !== 'answer') return;
    var qq = q(s.items[s.index].questionId);
    s.current.draft = id;
    var btns = appEl.querySelectorAll('[data-act="choose"]');
    for (var i = 0; i < btns.length; i++) {
      var on = btns[i].getAttribute('data-choice') === id;
      btns[i].classList.toggle('is-selected', on);
      btns[i].setAttribute('aria-checked', on ? 'true' : 'false');
    }
    var blank = appEl.querySelector('.q-sentence .blank');
    if (blank && qq.format === 'fill') {
      var text = ''; qq.choices.forEach(function (c) { if (c.id === id) text = c.text; });
      blank.textContent = text;
      blank.classList.add('filled');
    }
    var submit = document.getElementById('submit-btn');
    if (submit) submit.disabled = false;
    schedulePersist();
  }

  /** 選択の途中経過は、表示が変わったあとで保存する（画面を閉じるときは pagehide でも保存） */
  var persistTimer = null;
  function schedulePersist() {
    if (persistTimer) return;
    persistTimer = setTimeout(function () { persistTimer = null; persist(); }, 0);
  }

  /** 解説の開閉（表示だけ。保存しない） */
  function toggleExplanation(btn) {
    var body = document.getElementById(btn.getAttribute('aria-controls'));
    var open = btn.getAttribute('aria-expanded') !== 'true';
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    btn.querySelector('.explain-toggle-state').textContent = open ? 'とじる' : 'ひらく';
    body.classList.toggle('is-open', open);
  }

  /** 「初回診断とは？」の開閉（表示だけ。保存しない）。解説と同じ開閉の部品（.collapse）を使う */
  function toggleHelp(btn) {
    var body = document.getElementById(btn.getAttribute('aria-controls'));
    var open = btn.getAttribute('aria-expanded') !== 'true';
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    body.classList.toggle('is-open', open);
  }

  /** 進捗バー：直前の値から新しい値へ動かす（表示だけ。記録はすでに保存済み） */
  function animateProgress() {
    var fill = appEl.querySelector('.q-bar-fill');
    if (!fill) return;
    var to = fill.getAttribute('data-to') + '%';
    if (fill.style.width === to) return;
    fill.getBoundingClientRect(); // 起点の幅を確定させてから変える
    root.requestAnimationFrame(function () { fill.style.width = to; });
  }

  function mountSessionWidgets() {
    var s = state.activeSession;
    if (!s || !s.current || s.current.phase !== 'answer') return;
    var qq = q(s.items[s.index].questionId);
    var btn = document.getElementById('submit-btn');
    if (qq.format === 'order') {
      EA.orderWidget.mount(document.getElementById('order-mount'), qq.tokens, s.current.pool, s.current.draft || [], function (placed) {
        s.current.draft = placed; persist();
        btn.disabled = !hasDraft(qq, s.current);
      }, { fixed: qq.fixedStart || null });
    }
    if (qq.format === 'ja2en') {

  /* ================= 画面：診断結果 ================= */
  function sessionRecord(id) {
    for (var i = state.sessions.length - 1; i >= 0; i--) if (state.sessions[i].id === id) return state.sessions[i];
    return null;
  }

    h += '<ol class="result-list">' + atts.map(function (a, i) {

        '<div class="result-body"><p class="result-q">' + esc(qq.ja || qq.question) + '<span class="result-format">' + esc(fmtLabel(qq)) + '</span></p>' +

      // 診断はもう終わっているので、ここは記録を変えずにホームへ戻るだけ
      '<button type="button" class="btn-quiet" data-act="skip-practice-later">ホームへ戻る（解説と類題はあとで）</button>' +
      (flagged ? '' : '<button type="button" class="btn-quiet" data-act="skip-practice">確認問題はとばす</button>') +

  /* ================= 画面：学習のまとめ ================= */
  function renderSummary() {

          '<span class="att-q">' + esc(plain(qq.ja || qq.sentence)) + '</span>' +

    }
    if ((rec.unresolved || []).length) {
      h += '<section class="panel"><div class="panel-head"><h2>次回にもちこす内容</h2><p class="panel-note">確認済みにはしていません。次の復習で、別の問題で確かめます。</p></div><ul class="plain-list">' +
        rec.unresolved.map(function (u) { return '<li><strong>' + esc(skill(u.skillId).label) + '</strong>：' + esc(u.why) + '</li>'; }).join('') + '</ul></section>';
    }

          (ch ? '<span class="plan-why">' + esc(ch.why) + '</span>' : (sch ? '<span class="plan-why">今回は変更なし</span>' : '')) + '</div></li>';
